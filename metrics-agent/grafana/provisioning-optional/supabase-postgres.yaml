# Copied into Grafana's provisioning directory by entrypoint.sh ONLY when
# SUPABASE_MONITOR_PASSWORD is set. Connects to the production Supabase
# Postgres (project spinrmobileapp, ca-central-1) as the dedicated
# `grafana_monitor` role -- NOT the service-role key and NOT the app's
# DATABASE_URL. That role was created 2026-09-25 with no grants at all:
# it can read Postgres statistics views only (pg_stat_*, pg_database_size),
# has SELECT on 0 application tables, no USAGE on the public schema, is not
# a member of pg_monitor/pg_read_all_stats (so it cannot see other
# sessions' query text, which can contain PII), CONNECTION LIMIT 3,
# statement_timeout 5s, default_transaction_read_only on. See
# docs/change-log/2026-09-25-metrics-agent-supabase-redis-metrics.md for
# the exact SQL and the verification query.
# $VAR references are expanded by Grafana from its own environment --
# entrypoint.sh passes SUPABASE_MONITOR_PASSWORD through explicitly to the
# `env -i` Grafana invocation.
apiVersion: 1
datasources:
  - name: Supabase Postgres (read-only stats)
    uid: supabase-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db.soavhtdhefowwvforzwb.supabase.co:5432
    user: grafana_monitor
    editable: false
    jsonData:
      database: postgres
      sslmode: require
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 14400
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: $SUPABASE_MONITOR_PASSWORD
