# Spinr backend packaging metadata.
#
# WHY THIS FILE EXISTS
#
# The dependency source of truth for Spinr is requirements.in -> requirements.txt
# (pip-compile, enforced by .github/workflows/pip-compile-check.yml). Production
# builds from requirements.txt via backend/Dockerfile, and that has not changed.
#
# This file exists solely because FastAPI Cloud's deploy path requires a
# pyproject.toml: `fastapi deploy` resolves the app from the directory that holds
# one. It is a MIRROR of requirements.txt, not a second source of truth — it
# carries the identical pinned versions so the FastAPI Cloud dev tier runs the
# same dependency set as production. A dev environment silently running different
# package versions is worse than no dev environment: it manufactures confidence
# that does not transfer.
#
# DO NOT hand-edit the dependency list below. It is generated, and
# .github/workflows/pip-compile-check.yml fails the build when it drifts from
# requirements.txt. To change a dependency:
#
#   1. edit backend/requirements.in
#   2. pip-compile backend/requirements.in --output-file backend/requirements.txt \
#        --strip-extras --no-header --annotation-style line --no-upgrade
#   3. python -m backend.scripts.sync_pyproject_deps --write
#
# See docs/runbooks/fastapi-cloud-dev.md and docs/adr/011-environment-topology.md.

[project]
name = "spinr-backend"
version = "1.0.0"
description = "Spinr ride-sharing platform backend (FastAPI)"
# Matches backend/Dockerfile's pinned python:3.12.13-slim runtime. Note
# requirements.txt was pip-compiled under Python 3.11 (see its header) — a
# pre-existing discrepancy, harmless in practice since production has always
# installed this pin set under 3.12, but worth knowing before changing either.
requires-python = ">=3.12,<3.13"

