name: EAS Native Build (iOS/Android)

# ─── What this does ────────────────────────────────────────────────────────
# Triggers a full native EAS **build** — a new installable binary (.ipa/.apk) —
# NOT an OTA update. Use this whenever the NATIVE layer changes and an OTA
# therefore cannot deliver the fix:
#   • a dependency with a native side changes version (e.g. react-native-screens)
#   • a config-plugin / Info.plist / AndroidManifest / permission change
#   • a runtimeVersion bump (OTA is gated by runtimeVersion, so a bump needs a
#     fresh binary to land on)
#
# For JS-only changes, use the "EAS Mobile Update" workflow (eas-build.yml)
# instead — it's faster (over-the-air, no store round-trip).
#
# ─── Prerequisites ─────────────────────────────────────────────────────────
#   • Repo secret EXPO_TOKEN (already used by the OTA workflow).
#   • Repo secret PLAY_SERVICE_ACCOUNT_JSON (base64-encoded Google Cloud
#     service account key) for any Android run with auto_submit — decoded
#     at runtime into <app>/play-service-account.json, the path both apps'
#     eas.json submit profiles point at.
#   • The target app must ALREADY exist in Google Play Console under its
#     package name (com.spinr.user / com.spinr.driver). Google's Publishing
#     API cannot create a new app entry, and the first release of a brand
#     new app has to be uploaded through the Play Console UI once by hand.
#   • iOS build credentials must already exist on EAS (distribution cert +
#     provisioning profile). --non-interactive cannot create them; if they're
#     missing the run fails with a clear message — run `eas credentials` once
#     locally to set them up, then re-run this workflow.
#   • For `preview` (internal distribution) iOS installs, the target device's
#     UDID must be registered with the provisioning profile. `production`
#     produces a store build for TestFlight instead.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        required: true
        default: "driver-app"
        type: choice
        options: [driver-app, rider-app]
      platform:
        description: "Platform to build"
        required: true
        default: "ios"
        type: choice
        options: [ios, android, all]
      profile:
        description: "EAS build profile (from eas.json)"
        required: true
        default: "preview"
        type: choice
        options: [development, test, preview, android-auto, production]
      auto_submit:
        description: "Auto-submit to the store after build (production only)"
        required: false
        default: false
        type: boolean

# One native build per app/platform at a time; a newer request cancels a
# queued older one for the same target rather than stacking expensive builds.
concurrency:
  group: eas-native-build-${{ github.event.inputs.app }}-${{ github.event.inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.event.inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node 22, not 20 — see eas-build.yml's rider job for the full
      # root-cause writeup and the caveat on what "verified under Node 22"
      # actually covers (the app's own install, not eas-cli's, on a real
      # runner). Same fix, applied here since this workflow hits the
      # identical expo-github-action + eas-version: latest combination.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: yarn install --frozen-lockfile

      - name: Decode Play service account key
        # Required for ANY Android submission: both apps' eas.json submit
        # profiles set `serviceAccountKeyPath: ./play-service-account.json`,
        # and eas-cli reads that file locally when it registers the submission
        # — so without this step `--auto-submit` on Android fails on a missing
        # key. Only `deploy-driver-play-testing.yml` had it, which is why that
        # workflow is the only path that has ever reached Play; a
        # `--auto-submit` Android run from here could not have worked.
        #
        # Skipped when nothing will be submitted, and on an iOS-only build
        # (iOS credentials come from EAS, not from this file), so an iOS run
        # is not newly gated on an Android-only secret.
        if: >-
          ${{ github.event.inputs.auto_submit == 'true' &&
              github.event.inputs.platform != 'ios' }}
        # Passed via env, never interpolated into the script body: a raw-JSON
        # value (the obvious mistake for a secret named *_JSON) carries double
        # quotes and would break shell quoting, letting $(...) in the key
        # material execute on the runner. Same pattern as
        # deploy-driver-play-testing.yml.
        env:
          PLAY_KEY_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_KEY_B64" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is empty or unset."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          printf '%s' "$PLAY_KEY_B64" | base64 -d > play-service-account.json

          # An empty/garbage decode otherwise stays green here and fails deep
          # inside EAS, where it is far harder to attribute.
          if ! jq -e '.client_email and .private_key' play-service-account.json > /dev/null 2>&1; then
            echo "::error::Decoded key is not valid service-account JSON (missing client_email/private_key)."
            echo "The secret must hold the BASE64-encoded key file, not raw JSON."
            exit 1
          fi
          echo "Service account key decoded and validated."

      - name: Trigger EAS native build
        run: |
          SUBMIT_FLAG=""
          PROFILE="${{ github.event.inputs.profile }}"
          if [ "${{ github.event.inputs.auto_submit }}" = "true" ]; then
            if [ "$PROFILE" = "production" ]; then
              SUBMIT_FLAG="--auto-submit"
            elif [ "$PROFILE" = "android-auto" ]; then
              SUBMIT_FLAG="--auto-submit-with-profile android-auto"
            fi
          fi
          # --no-wait returns as soon as the build is queued (native iOS builds
          # run 20-40 min on EAS servers — well past a sensible Actions runtime).
          # The command prints the build detail URL; watch progress there or in
          # `eas build:list`.
          eas build \
            --platform "${{ github.event.inputs.platform }}" \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive \
            --no-wait \
            $SUBMIT_FLAG

      - name: Clean up credentials
        if: always()
        run: rm -f play-service-account.json

      - name: Where to find the build
        run: |
          echo "Build queued on EAS. Track it at:"
          echo "  https://expo.dev/accounts  →  project  →  Builds"
          echo "or run:  eas build:list --platform ${{ github.event.inputs.platform }} --limit 5"
