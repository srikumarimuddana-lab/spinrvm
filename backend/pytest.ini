[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=60
# Coverage ratchet history: 6% → 40% (2026-04-28) → 50% (2026-05-05) → 60% (2026-05-05, new extended test suite).
# Baseline before new tests was 53.8% (7844/14585 stmts). 65% requires 1636 more; new suite adds ~900.
# Next step: 2026-07 sprint → 65 → 70. Target ceiling: 80.
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # A8 (ACTION_ITEMS.md): a leaked un-awaited coroutine (an AsyncMock used
    # where production code calls something synchronously, or a
    # spawn()/create_task() double that doesn't consume its coroutine
    # argument) makes the suite an unreliable merge gate. Without this rule,
    # pytest 9's unraisableexception plugin already re-raises on whatever
    # test happens to be running when GC collects the leaked coroutine --
    # not the test that actually leaked it -- but only sometimes, since it
    # depends on GC timing; a leak with no unlucky "victim" nearby just
    # shows as a warning. This rule makes every leak an immediate, correctly
    # -attributed failure on its own test instead. Two rules, both needed --
    # confirmed empirically the *same* leak surfaces via either path
    # depending on GC timing on a given run:
    #
    # 1. Usually PytestUnraisableExceptionWarning, not RuntimeWarning: the
    #    coroutine finalizer's "was never awaited" warning is routed through
    #    sys.unraisablehook (CPython's coroutine-never-awaited finalizer,
    #    not a plain warnings.warn() call site), which pytest's
    #    unraisableexception plugin wraps and re-emits as
    #    PytestUnraisableExceptionWarning -- the embedded traceback text
    #    merely *mentions* RuntimeWarning inside the message. The message
    #    regex needs the inline (?s) DOTALL flag: without it, `.` doesn't
    #    match the newlines in that embedded traceback and the filter
    #    silently never matches (confirmed: without (?s), a
    #    deliberately-leaking scratch test kept passing under this exact
    #    rule with no visible error).
    # 2. Occasionally a plain RuntimeWarning directly (observed on repeated
    #    runs of the same scratch leak, so this path is real too, not
    #    hypothetical) -- kept as a second, narrower rule.
    error:(?s).*was never awaited.*:pytest.PytestUnraisableExceptionWarning
    error:coroutine .* was never awaited:RuntimeWarning
env =
    SUPABASE_URL=https://test.supabase.co
    SUPABASE_SERVICE_ROLE_KEY=test_key
    SECRET_KEY=test-secret-key
    ENV=test