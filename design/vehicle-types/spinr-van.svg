    <line x1="780" y1="184" x2="780" y2="284" stroke="rgba(255,255,255,0.35)" stroke-width="6"/>
    <!-- sliding door track + handle -->
    <line x1="500" y1="296" x2="500" y2="430" stroke="#D5D9E0" stroke-width="2"/>
    <rect x="556" y="330" width="42" height="10" rx="5" fill="#C7CDD6"/>
