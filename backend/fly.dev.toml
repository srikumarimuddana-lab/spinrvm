# Fly.io backend — DEV/TEST (Toronto/yyz). See docs/adr/011-environment-topology.md
# and docs/runbooks/dev-test-environments.md.
#
# THIS FILE IS INERT UNTIL A HUMAN WITH REAL FLY.IO ACCESS RUNS:
#   fly apps create spinr-backend-dev --org <your-org>
# No such app exists yet. `flyctl deploy --config backend/fly.dev.toml` fails
# with "app not found" until that command has been run. This file describes
# what the app should look like; it provisions nothing by itself.
#
# This single app serves BOTH local-development integration and the CI/test
# tier, backed by one shared throwaway Supabase project (ADR-011 §2). That
# sharing is deliberate: the property that earns staging its own project — a
# schema nobody resets under you — is exactly what dev and test do not need.
#
# Differences from backend/fly.toml (production, "spinr-backend-yyz"):
#   - distinct app name, so a stale local `fly` context can never deploy this
#     config over production.
#   - ENV = "development". Unlike staging (ENV="staging") this also flips
#     Settings.debug (core/config.py:356, `ENV.lower() == "development"`).
#     Chosen deliberately for this tier: mobile dev/preview builds have no
#     Firebase App Check attestation, so App Check enforcement
#     (core/middleware.py:890) must be off here or every request 403s.
#   - scaled to nothing when idle: 1 machine, auto-stop, min_machines_running
#     = 0. This tier is used in bursts (a manual deploy, a CI run, an E2
#     Locust ramp), never 24/7.
#
# NOT a canary and NOT staging. This app must never be pointed at the
# production Supabase project or production Redis — see the "What NOT to do"
# section of docs/runbooks/dev-test-environments.md.
#
# Secrets (SUPABASE_*, JWT_SECRET, ADMIN_PASSWORD, FIREBASE_*, REDIS_URL, ...)
# are NOT set here, same convention as production fly.toml. They must be
# dev-only values — never copies of production secrets. Stripe credentials
# are deliberately left unset (ADR-011, "Deliberately out of scope"): whether
# non-prod tiers exercise payment flows at all is a separate decision.
app = "spinr-backend-dev"
primary_region = "yyz"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "development"
  PORT = "8000"
  # PIPEDA data residency (CLAUDE.md "Data residency") applies to the dev
  # Supabase project too. There is no "it's only dev" exception — the project
  # this points at must be provisioned in a Canadian region.
  SUPABASE_REGION = "ca-central-1"
  UVICORN_WORKERS = "1"
  PYTHONUNBUFFERED = "1"
  # Purely descriptive. Nothing in the backend branches on this value; it
  # exists so logs and Sentry events are attributable to a tier without
  # overloading ENV, which does carry behavior. See ADR-011 §3.
  SPINR_DEPLOY_TIER = "dev"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
