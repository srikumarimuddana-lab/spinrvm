name: Detect changed surfaces

# Reusable `workflow_call` filter job shared by ci.yml, ci-guardrails.yml,
# and security-gates.yml (Phase 2, docs/audit/2026-08-27-cicd-gates-
# guardrails-audit.md Section 2/5). Extracted from ci-guardrails.yml's own
# Phase 1 inline job now that a second and third caller need it -- one
# caller didn't justify extraction (CLAUDE.md "no single-use
# abstractions"), three does.
#
# Uses dorny/paths-filter -- not a new dependency, already vendored and
# proven in this repo by eas-build.yml's own `detect` job (same pinned
# SHA this file uses).
#
# Every caller applies the SAME fail-open rule: only skip a job when the
# triggering event is `pull_request` AND this filter actually completed
# successfully (`result == 'success'` -- a `failure` or a `cancelled` run,
# e.g. an external mid-flight cancellation like ACTION_ITEMS.md C47, both
# fail open) AND reported the surface as untouched AND the PR didn't touch
# `.github/workflows/**` itself (every caller also ORs in
# `outputs.workflows == 'true'`, so a PR editing a gate exercises the gate
# it's changing instead of relying on the filter having separately marked
# some other surface as touched). On `push`, `merge_group`,
# `workflow_dispatch`, or `schedule` -- or if this job itself doesn't run
# or errors -- every caller's own `if:` falls back to "run everything".
# Path-filtering is a PR-time fast-feedback optimization only; it is never
# the last line of defense before `main`, and it never gets to silently
# decide what runs on a non-PR event.
#
# NAMING NOTE: `admin` below means `admin-dashboard/**` (the frontend
# surface) -- unrelated to `backend/routes/admin/`, which lives under the
# `backend` output instead (see backend/scripts/check_admin_coverage_floor.py
# for the gate that tracks that directory). Do not wire a backend-admin-
# routes gate to this `admin` output.

on:
  workflow_call:
    outputs:
      backend:
        description: "backend/** changed"
        value: ${{ jobs.filter.outputs.backend }}
      rider:
        description: "rider-app/** or shared/** changed"
        value: ${{ jobs.filter.outputs.rider }}
      driver:
        description: "driver-app/** or shared/** changed"
        value: ${{ jobs.filter.outputs.driver }}
      admin:
        description: "admin-dashboard/** changed (frontend -- see NAMING NOTE above)"
        value: ${{ jobs.filter.outputs.admin }}
      shared:
        description: "shared/** changed"
        value: ${{ jobs.filter.outputs.shared }}
      migrations:
        description: "backend/migrations/** changed"
        value: ${{ jobs.filter.outputs.migrations }}
      workflows:
        description: ".github/workflows/** changed -- a CI/CD change itself; every caller treats this as run-everything, not just another filtered surface"
        value: ${{ jobs.filter.outputs.workflows }}

jobs:
  filter:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Explicit bound because this job is now a blocking dependency for ~21
    # jobs across 3 heavy workflows (Phase 2) -- a hang here (e.g. a
    # dorny/paths-filter GitHub API stall) should fail fast into every
    # caller's `result != 'success'` fail-open leg rather than leave 21
    # downstream jobs queued for the org/repo default timeout.
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      rider: ${{ steps.filter.outputs.rider }}
      driver: ${{ steps.filter.outputs.driver }}
      admin: ${{ steps.filter.outputs.admin }}
      shared: ${{ steps.filter.outputs.shared }}
      migrations: ${{ steps.filter.outputs.migrations }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            rider:
              - 'rider-app/**'
              - 'shared/**'
            driver:
              - 'driver-app/**'
              - 'shared/**'
            admin:
              - 'admin-dashboard/**'
            shared:
              - 'shared/**'
            migrations:
              - 'backend/migrations/**'
            workflows:
              - '.github/workflows/**'
