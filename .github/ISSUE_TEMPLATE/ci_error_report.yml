name: CI Error Report
description: Structured error report generated by the CI Audit system (or manually filed) for a CI pipeline failure.
title: "[CI-ERR] <workflow> — <job> — <error type>"
labels: ["ci-failure", "ci-audit", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## CI Error Report
        This report captures a CI failure for root cause analysis, impact assessment, and tracked resolution.
        It is auto-generated by the CI Error Audit workflow (`ci-error-audit.yml`) or can be filed manually.

  - type: input
    id: run_id
    attributes:
      label: Workflow Run ID
      placeholder: "12345678"
    validations:
      required: true

  - type: input
    id: workflow_name
    attributes:
      label: Workflow Name
      placeholder: "CI/CD Pipeline"
    validations:
      required: true

  - type: input
    id: failed_job
    attributes:
      label: Failed Job(s)
      placeholder: "backend-test, admin-test"
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch
      placeholder: "main"
    validations:
      required: true

  - type: input
    id: commit_sha
    attributes:
      label: Commit SHA
      placeholder: "abc1234"

  - type: dropdown
    id: error_category
    attributes:
      label: Error Category
      description: Primary classification of the failure
      options:
        - "test — unit/integration test failure"
        - "test — e2e / Playwright failure"
        - "lint — ruff / ESLint / TypeScript"
        - "security — CVE / secrets / Trivy"
        - "build — Docker / Next.js / Expo"
        - "deploy — Railway / Render / Vercel / EAS"
        - "infra — GitHub Actions runner / environment"
        - "flaky — intermittent / non-deterministic"
        - "coverage — threshold not met"
        - "migration — DB migration error"
        - "dependency — package install failure"
        - "other"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "P0 — Blocking (main is broken / production at risk)"
        - "P1 — High (blocks PR merge / feature delivery)"
        - "P2 — Medium (intermittent / non-blocking with workaround)"
        - "P3 — Low (cosmetic / informational)"
    validations:
      required: true

  - type: textarea
    id: error_message
    attributes:
      label: Error message / log excerpt
      description: Paste the relevant error output (redact secrets)
      render: text
      placeholder: |
        FAILED tests/test_rides.py::test_ride_acceptance - AssertionError: Expected 200 got 409
        ...
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: Root cause analysis
      description: What caused this failure? Be specific.
      placeholder: |
        The ride acceptance endpoint returns 409 when the ride is already taken.
        Test expects 200 because it doesn't mock the race condition guard.
        Root cause: test isolation — no cleanup between test runs, shared ride_id.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact assessment
      description: What features / users / systems are affected?
      placeholder: |
        - Affected surface: backend
        - Feature: ride acceptance / dispatch
        - Users at risk: drivers attempting to accept rides
        - Related issues: none
        - Blast radius: medium — dispatch is core flow but fallback works
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Fix applied
      description: What was done to fix this? Reference PR if applicable.
      placeholder: |
        Added cleanup fixture in conftest.py to delete test rides after each test.
        PR: #NNN
    validations:
      required: true

  - type: textarea
    id: guard_rail
    attributes:
      label: Guard rail added
      description: What was added to prevent this class of failure recurrence?
      placeholder: |
        Added @pytest.fixture(autouse=True) ride cleanup in tests/conftest.py.
        CI guard rail: no change needed — this was a test isolation issue.
    validations:
      required: true

  - type: textarea
    id: change_requests
    attributes:
      label: Change Requests identified
      description: Improvements identified during investigation that require separate approval
      placeholder: |
        CR-2026-002: Standardise test fixture cleanup across all test files
        CR-2026-003: Add test run isolation via database transaction rollback

  - type: dropdown
    id: status
    attributes:
      label: Resolution status
      options:
        - "🔴 Open — under investigation"
        - "🟡 In progress — fix being developed"
        - "🟢 Fixed — PR merged"
        - "⚪ Closed — won't fix (see comment)"
        - "🔵 Monitoring — fix deployed, watching for recurrence"
    validations:
      required: true

  - type: input
    id: fix_pr
    attributes:
      label: Fix PR URL
      placeholder: "https://github.com/org/repo/pull/NNN"

  - type: input
    id: resolved_at
    attributes:
      label: Resolved at (date)
      placeholder: "2026-04-25"

  - type: checkboxes
    id: resolution_checklist
    attributes:
      label: Resolution checklist
      options:
        - label: Root cause identified
        - label: Fix implemented and tested locally
        - label: All CI checks pass on fix PR
        - label: Guard rail added to prevent recurrence
        - label: Change Requests filed for any identified improvements
        - label: Audit report updated in reports/audits/
