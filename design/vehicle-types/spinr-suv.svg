<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#FAFBFC"/>
      <stop offset="100%" stop-color="#E9ECF1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"  stop-color="#5C6B7A"/>
      <stop offset="100%" stop-color="#2B3742"/>
    </linearGradient>
    <linearGradient id="redband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EE2B2B"/>
      <stop offset="100%" stop-color="#C81E26"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#C9CED6"/>
      <stop offset="100%" stop-color="#9AA0AB"/>
    </radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="rgba(20,24,31,0.22)"/>
      <stop offset="70%" stop-color="rgba(20,24,31,0.10)"/>
      <stop offset="100%" stop-color="rgba(20,24,31,0)"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <ellipse cx="500" cy="476" rx="402" ry="40" fill="url(#ground)"/>

  <g>
    <!-- body: tall front, flat roof over cabin, sloped rear hatch -->
    <path d="M 86 348
             C 90 300, 132 282, 188 278
             L 252 184 C 266 166, 294 158, 330 158
             L 632 158 C 672 158, 700 168, 716 196
             L 760 286
             C 836 292, 892 308, 910 340
             C 920 358, 918 414, 906 436
             L 86 436 C 80 418, 80 372, 86 348 Z"
          fill="url(#body)" stroke="#D5D9E0" stroke-width="2"/>
    <!-- greenhouse: windshield + two side windows + small sloped quarter -->
    <path d="M 266 184 C 278 172, 302 166, 332 166
             L 628 166 C 662 166, 686 176, 700 200
             L 736 282 L 206 282
             C 212 246, 234 212, 266 184 Z"
          fill="url(#glass)"/>
    <line x1="326" y1="166" x2="296" y2="282" stroke="rgba(255,255,255,0.45)" stroke-width="7"/>
    <line x1="500" y1="166" x2="500" y2="282" stroke="rgba(255,255,255,0.32)" stroke-width="6"/>
    <line x1="648" y1="172" x2="690" y2="282" stroke="rgba(255,255,255,0.32)" stroke-width="6"/>
    <line x1="500" y1="294" x2="500" y2="430" stroke="#D5D9E0" stroke-width="2"/>
    <!-- bold red beltline -->
    <line x1="104" y1="320" x2="894" y2="320" stroke="#EE2B2B" stroke-width="16" stroke-linecap="round"/><line x1="112" y1="329.9" x2="886" y2="329.9" stroke="#A3161D" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- roof rails -->
    <rect x="312" y="151" width="372" height="9" rx="4.5" fill="#C7CDD6"/>
    <rect x="356" y="356" width="44" height="11" rx="5.5" fill="#C7CDD6"/>
    <rect x="556" y="356" width="44" height="11" rx="5.5" fill="#C7CDD6"/>
    <path d="M 276 178 C 320 168, 600 168, 690 196 L 670 180 C 600 172, 320 172, 292 180 Z"
          fill="url(#sheen)" opacity="0.65"/>
    <g><path d="M 262 296 q -22 -2 -30 12 q -2 8 8 9 l 22 -3 Z" fill="#EE2B2B" stroke="#C81E26" stroke-width="1.5"/><path d="M 236 310 l 8 7" stroke="#A3161D" stroke-width="3" stroke-linecap="round"/></g>
    <rect x="90" y="330" width="36" height="20" rx="5" fill="#EAF6FF"/>
    <path d="M 910 322 L 872 322 L 872 364 L 902 364 C 912 356, 912 330, 910 322 Z" fill="#EE2B2B"/>
    <!-- rugged lower cladding (dark) with a red rocker line -->
    <path d="M 92 408 L 902 408 L 898 436 L 86 436 Z" fill="rgba(35,38,44,0.15)"/>
    <line x1="210" y1="406" x2="790" y2="406" stroke="#EE2B2B" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="292" cy="420" r="78" fill="#23262C"/>
    <circle cx="292" cy="420" r="78" fill="none" stroke="#0E1014" stroke-width="2"/>
    <circle cx="292" cy="420" r="48.4" fill="url(#rim)"/>
    <line x1="292.0" y1="420.0" x2="292.0" y2="384.1" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/><line x1="292.0" y1="420.0" x2="326.1" y2="408.9" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/><line x1="292.0" y1="420.0" x2="313.1" y2="449.0" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/><line x1="292.0" y1="420.0" x2="270.9" y2="449.0" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/><line x1="292.0" y1="420.0" x2="257.9" y2="408.9" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/>
    <circle cx="292" cy="420" r="12.5" fill="#9AA0AB"/>
    <circle cx="292" cy="420" r="12.5" fill="none" stroke="#7C828D" stroke-width="2"/>
  </g>
  <g>
    <circle cx="700" cy="420" r="78" fill="#23262C"/>
    <circle cx="700" cy="420" r="78" fill="none" stroke="#0E1014" stroke-width="2"/>
    <circle cx="700" cy="420" r="48.4" fill="url(#rim)"/>
    <line x1="700.0" y1="420.0" x2="700.0" y2="384.1" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/><line x1="700.0" y1="420.0" x2="734.1" y2="408.9" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/><line x1="700.0" y1="420.0" x2="721.1" y2="449.0" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/><line x1="700.0" y1="420.0" x2="678.9" y2="449.0" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/><line x1="700.0" y1="420.0" x2="665.9" y2="408.9" stroke="#9AA0AB" stroke-width="10.1" stroke-linecap="round"/>
    <circle cx="700" cy="420" r="12.5" fill="#9AA0AB"/>
    <circle cx="700" cy="420" r="12.5" fill="none" stroke="#7C828D" stroke-width="2"/>
  </g>
  <g fill="none" stroke="rgba(20,24,31,0.18)" stroke-width="3">
    <path d="M 208 420 A 84 84 0 0 1 376 420"/>
    <path d="M 616 420 A 84 84 0 0 1 784 420"/>
  </g>
</svg>