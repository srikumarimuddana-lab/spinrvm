name: EAS Mobile Update

# ─── What this does ────────────────────────────────────────────────────────
# On every push to main that touches rider-app / driver-app / shared:
#   → Publishes an OTA JS-only update to the `preview` channel only
#     (android — the internal-distribution APKs handed to live testers).
#     Ungated, 100%, no rollout.
#
# On workflow_dispatch:
#   → profile=test | preview — ungated publish to that channel.
#   → profile=production     — behind the `production-ota` GitHub Environment
#                              (required reviewer). Defaults to 100%: no
#                              rollout state, so nothing has to be cleaned up
#                              afterwards and the next publish is never
#                              blocked. This is the ONLY path that publishes
#                              a production OTA.
#
# The rollout default was 10% from 2026-09-20 to 2026-09-22. In that window
# production OTA shipped exactly once, then blocked every later publish for
# two days because ending a rollout is manual and nobody did it. A canary
# nobody watches is not a safety feature, it is an outage. Pass 10 explicitly
# when someone is genuinely going to watch Sentry and then ramp it.
#
# Either way the exported source maps are uploaded to Sentry after each
# publish so post-OTA crashes symbolicate (see .github/actions/eas-ota-publish).
#
# 2026-09-20 (review item C7): before this, every merge to main published
# straight to `production` for both apps with no approval, no rollout and no
# sourcemaps — a JS-only regression reached every production handset on next
# launch, unsymbolicated, with no kill switch short of another `eas update`.
#
# 2026-09-22: C7 fixed that but published production on every push as a 10%
# rollout. Expo permits ONE active rollout per branch+platform+runtime
# version, and `eas update` has no non-interactive way to supersede one
# (checked against eas-cli 24.7.0's flag list), so the first push after C7
# created a rollout and every push after that was refused — two solid days of
# red runs (last green: run 1103, before 94ade62 landed), during which
# production handsets received nothing and the one rollout that did land
# stayed stuck at 10%. A rollout is
# human-paced state by design; an unattended push-triggered job cannot end
# one. Production is therefore dispatch-only: whoever starts a rollout is the
# one who ramps or reverts it.
#
# NOTE — iOS has no `preview` population (App Store installs sit on the
# `production` channel), so with production on dispatch only a push publishes
# no iOS OTA at all. iOS JS fixes ship by dispatching this workflow with
# profile=production. That is deliberate, not an oversight.
#
# OPERATOR NOTES
#   • The `production-ota` environment must exist in repo Settings →
#     Environments with at least one required reviewer. GitHub auto-creates
#     a referenced environment with NO protection rules, so until a human
#     adds the reviewer this gate is inert — check before relying on it.
#     Still inert as of 2026-09-22: in run 35743544726 the production jobs
#     started after the same ~90s queue delay as the ungated preview jobs,
#     with no approval pause.
#   • Expo allows ONE active per-update rollout per branch+platform+runtime
#     version. Before dispatching profile=production, end any rollout still in
#     progress:
#         eas update:list --branch production --json --non-interactive
#         eas update:edit <GROUP_ID> --rollout-percentage 100 --non-interactive
#         eas update:revert-update-rollout --group <GROUP_ID> --non-interactive
#     (docs.expo.dev/eas-update/rollouts). The publish step prints these with
#     the real group ID filled in whenever Expo refuses for this reason.
#   • Sentry upload needs repo secret SENTRY_AUTH_TOKEN and variables
#     SENTRY_ORG, SENTRY_PROJECT_RIDER, SENTRY_PROJECT_DRIVER. When unset the
#     upload step warns and skips (the publish still happens).
#
# OTA updates are JS-only. Native changes (new deps with native side, plugin
# changes, Info.plist, permission additions, runtimeVersion bumps) still
# require a full EAS build run separately.

on:
  push:
    branches: [main]
    paths:
      - "rider-app/**"
      - "driver-app/**"
      - "shared/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to update"
        required: true
        default: "both"
        type: choice
        options: [rider-app, driver-app, both]
      profile:
        description: "OTA channel"
        required: true
        default: "preview"
        type: choice
        options: [test, preview, production]
      rollout_percentage:
        description: "Production only, ignored for preview/test. 100 = publish to everyone, leaves no rollout state. Below 100 starts a canary you MUST end before the next production publish (see EAS Rollout Control) — only pick that if someone is actually going to watch it."
        required: false
        default: "100"
        type: string

# Channel routing background:
# `github.event.inputs.*` is only populated for workflow_dispatch, so a push
# must not fall through to a default profile. Real store builds live on two
# channels: iOS App Store submissions use the `production` build profile /
# channel; Android has two live populations — every internal-distribution APK
# handed to live testers is on `preview`, and Play production installs (first
# cut 2026-09-09 from the `production` build profile) are on `production`.
# A push therefore publishes android to `preview` and nothing else;
# `production` (ios and android) is reached only by workflow_dispatch with
# profile=production, which routes through the `production-ota` gate.
#
# Publishing is always by --branch (same name as the channel): `eas update
# --channel` requires the channel to be linked to exactly one branch and
# fails with "Channel has no branches associated with it" otherwise; the
# same-named channel routes builds to this branch (one-time
# `eas channel:edit <name> --branch <name>`).

# Detect which app(s) changed so push-triggered runs only process the affected
# app. Shared changes hit both.
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rider: ${{ steps.filter.outputs.rider }}
      driver: ${{ steps.filter.outputs.driver }}
      # Resolved once so the four publish jobs share one definition.
      is_production: ${{ steps.mode.outputs.is_production }}
      preview_pairs: ${{ steps.mode.outputs.preview_pairs }}
      production_pairs: ${{ steps.mode.outputs.production_pairs }}
      rollout: ${{ steps.mode.outputs.rollout }}
      message: ${{ steps.mode.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rider:
              - 'rider-app/**'
              - 'shared/**'
            driver:
              - 'driver-app/**'
              - 'shared/**'
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          INPUT_ROLLOUT: ${{ github.event.inputs.rollout_percentage }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            # Ungated preview leg only. Production is dispatch-only: Expo
            # permits one active rollout per branch+platform+runtime version
            # and `eas update` cannot supersede one non-interactively, so a
            # push-triggered production publish is refused from the second
            # push onward until a human ends the rollout (see the header).
            echo "preview_pairs=android:preview" >> "$GITHUB_OUTPUT"
            echo "production_pairs=" >> "$GITHUB_OUTPUT"
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "rollout=100" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_PROFILE" = "production" ]; then
            echo "preview_pairs=" >> "$GITHUB_OUTPUT"
            echo "production_pairs=ios:production android:production" >> "$GITHUB_OUTPUT"
            echo "is_production=true" >> "$GITHUB_OUTPUT"
            echo "rollout=${INPUT_ROLLOUT:-10}" >> "$GITHUB_OUTPUT"
          else
            # test / preview: one ungated leg on the chosen channel.
            echo "preview_pairs=ios:${INPUT_PROFILE} android:${INPUT_PROFILE}" >> "$GITHUB_OUTPUT"
            echo "production_pairs=" >> "$GITHUB_OUTPUT"
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "rollout=100" >> "$GITHUB_OUTPUT"
          fi
          # Single-line, bounded message (multi-line output would need a
          # heredoc delimiter; the action truncates to 1000 chars anyway).
          echo "message=$(printf '%s' "${MSG:-manual update}" | head -1 | cut -c1-1000)" >> "$GITHUB_OUTPUT"

  # ── Preview (ungated) ─────────────────────────────────────────────────────
  rider-preview:
    needs: detect
    if: |
      needs.detect.outputs.preview_pairs != '' && (
        (github.event_name == 'push' && needs.detect.outputs.rider == 'true') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'rider-app' || github.event.inputs.app == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/eas-ota-publish
        with:
          app_dir: rider-app
          pairs: ${{ needs.detect.outputs.preview_pairs }}
          message: ${{ needs.detect.outputs.message }}
          expo_token: ${{ secrets.EXPO_TOKEN }}
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry_org: ${{ vars.SENTRY_ORG }}
          sentry_project: ${{ vars.SENTRY_PROJECT_RIDER }}

  driver-preview:
    needs: detect
    if: |
      needs.detect.outputs.preview_pairs != '' && (
        (github.event_name == 'push' && needs.detect.outputs.driver == 'true') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'driver-app' || github.event.inputs.app == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/eas-ota-publish
        with:
          app_dir: driver-app
          pairs: ${{ needs.detect.outputs.preview_pairs }}
          message: ${{ needs.detect.outputs.message }}
          expo_token: ${{ secrets.EXPO_TOKEN }}
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry_org: ${{ vars.SENTRY_ORG }}
          sentry_project: ${{ vars.SENTRY_PROJECT_DRIVER }}

  # ── Production (gated: required reviewer on the `production-ota` environment,
  #    percentage rollout) ────────────────────────────────────────────────────
  rider-production:
    needs: detect
    # Dispatch-only — a push never reaches this job (see the header block).
    if: |
      needs.detect.outputs.is_production == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.app == 'rider-app' || github.event.inputs.app == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-ota
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/eas-ota-publish
        with:
          app_dir: rider-app
          pairs: ${{ needs.detect.outputs.production_pairs }}
          message: ${{ needs.detect.outputs.message }}
          rollout_percentage: ${{ needs.detect.outputs.rollout }}
          expo_token: ${{ secrets.EXPO_TOKEN }}
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry_org: ${{ vars.SENTRY_ORG }}
          sentry_project: ${{ vars.SENTRY_PROJECT_RIDER }}

  driver-production:
    needs: detect
    # Dispatch-only — a push never reaches this job (see the header block).
    if: |
      needs.detect.outputs.is_production == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.app == 'driver-app' || github.event.inputs.app == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-ota
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/eas-ota-publish
        with:
          app_dir: driver-app
          pairs: ${{ needs.detect.outputs.production_pairs }}
          message: ${{ needs.detect.outputs.message }}
          rollout_percentage: ${{ needs.detect.outputs.rollout }}
          expo_token: ${{ secrets.EXPO_TOKEN }}
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry_org: ${{ vars.SENTRY_ORG }}
          sentry_project: ${{ vars.SENTRY_PROJECT_DRIVER }}
