# gitleaks config for the `deploy-admin` build-output scan (CI, ci.yml [17-5]).
#
# Scope: this file is ONLY used for scanning `.next/` — the compiled Next.js
# build output — not the source tree. Do not point repo-wide scans at it.
#
# WHY THIS IS SEPARATE FROM THE ROOT /.gitleaks.toml — do not "consolidate" the
# two without re-checking this. The entries below need `[[allowlists]]` blocks
# (for `condition = "AND"`, which scopes the generic `encryptionKey` pattern to
# the manifests it may appear in). Two constraints make that unsafe in the root
# file:
#
#   1. gitleaks refuses a config containing both `[allowlist]` and
#      `[[allowlists]]` ("[allowlist] is deprecated, it cannot be used
#      alongside [[allowlists]]"). The root file uses `[allowlist]`, so
#      adding these there means converting its existing suppressions too.
#   2. gitleaks 8.18.4 — the version pinned by G5b in security-gates.yml —
#      **silently ignores** `[[allowlists]]`. It loads such a config without
#      error and applies none of the suppressions. Verified 2026-08-03 against
#      both binaries: an `sk_test_` key allowlisted via `[[allowlists]]` is
#      suppressed by 8.27.2 and reported by 8.18.4.
#
# So converting the root file would silently disarm every suppression it
# currently provides to G5b, and to G5a (gitleaks-action@v2, whose bundled
# version we do not pin) — turning the history scan back into the ~44k-finding
# noise wall its comments describe. Failing open, with no error.
#
# Consolidating is fine once G5a and G5b are both on >= 8.19 with a pinned,
# verified version. Until then, keep them separate.
#
# The gate exists to catch a real secret (a Supabase service_role key, a Stripe
# secret key, an admin password) reaching a deployed bundle — typically via an
# `NEXT_PUBLIC_*` var or a hardcoded literal. Every allowlist below suppresses a
# value that Next.js itself generates at build time, or third-party library
# source, and none of them can carry one of ours.
#
# Verified 2026-08-03 against a local `npm run build`: the default ruleset
# produced 13 findings, all from the `generic-api-key` rule, all accounted for
# by the entries below. See PR for the full itemised list.

[extend]
useDefault = true

# Build scratch, not a deploy artifact — Vercel builds from source and never
# uploads this directory. Contains the same generated preview-mode keys as the
# manifests below.
[[allowlists]]
description = "Next.js build cache"
paths = ['''\.next/cache/''']

# CR #4216 split this one entry into two (2026-08-18). Root cause, verified
# empirically against a real local `npm run build` + gitleaks 8.27.2 (not
# assumed): a `paths`-bearing `[[allowlists]]` entry in this gitleaks version
# fully excludes every byte of a matching file from scanning by EVERY rule —
# not just the entry's own regex — regardless of `condition = "AND"`. Proved
# this three ways:
#   1. A real 40-char high-entropy canary secret planted in one of these 4
#      manifest files, in a shape matching NONE of this entry's regexes, was
#      still silently skipped entirely ("scanned ~0 bytes").
#   2. A canary using the *exact* `encryptionKey": "<secret>"` shape planted
#      OUTSIDE these 4 files, with `paths` removed, was correctly still
#      caught by the plain `generic-api-key` rule — proving regex-only
#      scoping is NOT inherently unsafe by itself.
#   3. A canary with an UNRELATED secret shape (`sk_live_...`, matching
#      nothing here at all) planted INSIDE one of these 4 files, alongside a
#      benign `encryptionKey` value, was ALSO silently skipped — proving the
#      exclusion really is file-wide, not finding-wide. A real Stripe key
#      accidentally landing in `prerender-manifest.json` would currently go
#      undetected by this specific gate (G5a's separate git-history scan and
#      G5b's bundle scan on the REST of the build still apply; this is a gap
#      in one gate, not the only line of defense).
#
# gitleaks 8.27.2 has no allowlist mechanism that suppresses one specific
# regex match without excluding the whole file from every other rule too —
# `paths` is the only file-scoping primitive it offers, and it is
# structurally all-or-nothing. `stopwords` (the other content-adjacent
# allowlist check) matches against the *secret itself*, which is a fresh
# random value every build here, so it can't provide a stable anchor either.
# CR #4216's hoped-for full fix (drop `paths` entirely, rely on regex
# precision alone) is genuinely not achievable for one of these four
# regexes — `server-reference-manifest.json` really does use the bare JSON
# field name `"encryptionKey"` (verified directly in the built file, not
# guessed), which is exactly generic enough that a real secret elsewhere in
# the codebase could plausibly use the same field name. So this is now split:
#
# Entry A (below): the three specific, Next.js-internal-constant-shaped
# regexes. Verified safe to drop `paths` for these — planted each pattern's
# literal keyword as a canary OUTSIDE the 4 manifest files and confirmed all
# three are still caught (not swallowed) once `paths` is gone. Now enforced
# repo-wide, not just inside these 4 files — a real improvement, not just a
# reshuffle.
[[allowlists]]
description = "Next.js per-build generated preview/server-action keys — safe repo-wide, no path anchor needed"
regexTarget = "match"
regexes = [
  '''previewMode(Signing|Encryption)Key''',
  '''__NEXT_PREVIEW_MODE_(SIGNING|ENCRYPTION)_KEY''',
  '''NEXT_SERVER_ACTIONS_ENCRYPTION_KEY''',
]

# Entry B: the one pattern that genuinely cannot be made regex-only-safe
# (see the analysis above item 2/3) — the bare `"encryptionKey"` JSON field
# name `server-reference-manifest.json` actually uses. `paths` is kept here
# deliberately, with the file-wide-exclusion consequence now documented
# accurately rather than the previous comment's inaccurate claim that
# `condition = "AND"` scoped this to matching content only. This is the
# residual, disclosed gap CR #4216 could not close — filed as its own
# tracking note rather than silently left as an unexplained known-limitation.
[[allowlists]]
description = "Next.js Server Actions payload encryptionKey field — cannot safely drop paths, see CR #4216"
condition = "AND"
regexTarget = "match"
paths = [
  '''\.next/prerender-manifest\.json$''',
  '''\.next/(server/)?middleware-manifest\.json$''',
  '''\.next/server/middleware/middleware-manifest\.json$''',
  '''\.next/server/server-reference-manifest\.json$''',
]
regexes = [
  '''encryptionKey"\s*:''',
]

# jsPDF library source, reached through a server sourcemap:
#   var f2 = (API.f2 = API.__private__.f2 = function(number) { ... })
# `generic-api-key` reads `API.f2 = <high-entropy blob>` as an assignment to an
# API key. Anchored on the jsPDF-specific symbol so it cannot mask an assignment
# to anything else.
[[allowlists]]
description = "jsPDF API.f2 helper misread as an API key assignment"
regexTarget = "match"
regexes = ['''API\.f2\s*=''']

# Cloudflare D1/Durable Objects metering field names, reached through a
# server edge-runtime sourcemap. The CI scan runs with --redact, so the
# report only ever shows the secret as the literal string "REDACTED" —
# do not allowlist on that placeholder text, it is not the real content.
# Rebuilt admin-dashboard locally and ran gitleaks WITHOUT --redact to see
# the real captured value: `CLOUDFLARE_DURABLE_OBJECT_QUERY_BINDINGS`, an
# all-caps enum-shaped field-name constant (paired with the field name
# `CLOUDFLARE_D1_ROWS_WRITTEN` immediately before it), consistent with a
# Cloudflare D1/Durable-Objects telemetry field list bundled by Vercel's
# edge-runtime instrumentation — not a live credential. First seen
# 2026-08-18, blocking every `deploy-admin` run on `main` since (identical
# match across 3 consecutive runs — 15:46, 17:04, 18:04 UTC — same file,
# same line, same value).
#
# Deliberately NO `paths` key here, unlike the other `condition = "AND"`
# entry above. Verified empirically (planting a real 40-char high-entropy
# canary secret in this same directory, `.next/server/edge/chunks/`) that
# gitleaks 8.27.2 treats an allowlist's `paths` list as a full pre-scan
# file exclusion REGARDLESS of `condition`/`regexes` — a canary secret in
# an otherwise-untouched file under that path was silently skipped
# entirely ("scanned ~0 bytes"), even though it matched neither this
# entry's regex nor its own content. Scoping by regex alone (below) still
# suppresses only this exact literal match — verified the same canary is
# still caught with this narrower entry in place.
[[allowlists]]
description = "Cloudflare D1/Durable Objects telemetry field-name pair misread as an API key"
regexTarget = "match"
regexes = ['''CLOUDFLARE_D1_ROWS_WRITTEN","CLOUDFLARE_DURABLE_OBJECT_QUERY_BINDINGS''']
