name: PR Checks

# Non-deployment PR hygiene workflow.
# Phase B (current): path-based auto-label + PR size advisory.
# Later phases will extend this file with:
#   - required-field enforcement (template-filled check)
#   - merge-conflict / CI-retry detection
#   - conditional section expander (appends Tier 5–7 subsections when relevant)
#   - auto-summary comment
#
# Never touches deployment pipelines. Read-mostly; write permission is limited
# to labels and PR comments.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-label:
    name: Auto-label by path
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  size-advisory:
    name: PR size advisory
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post size advisory if large
        uses: actions/github-script@v9
        with:
          script: |
            const FILE_LIMIT = 15;
            const LINE_LIMIT = 500;
            const MARKER = '<!-- spinr-size-advisory -->';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const total = pr.additions + pr.deletions;
            const over = total > LINE_LIMIT || pr.changed_files > FILE_LIMIT;

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(MARKER));

            if (!over) {
              // PR shrank back under the threshold — clean up stale advisory
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                core.info('PR under threshold; removed stale size advisory.');
              } else {
                core.info('PR under threshold; no advisory needed.');
              }
              return;
            }

            const body = [
              MARKER,
              '### PR size advisory',
              '',
              `This PR has **${pr.changed_files} files** and **${total} lines** changed (${pr.additions} added / ${pr.deletions} removed).`,
              '',
              `Thresholds: more than ${FILE_LIMIT} files or ${LINE_LIMIT} lines → consider splitting.`,
              '',
              'Large PRs take longer to review, hide regressions, and are harder to roll back. If this truly cannot be split (e.g. coordinated rename), note the reason in the PR body.',
              '',
              '_Not blocking — this is advisory only._',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info('Updated size advisory comment.');
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              core.info('Posted size advisory comment.');
            }

  required-fields:
    name: Required PR fields filled
    # Dependabot's PR body is auto-generated in its own format and never
    # matches this repo's custom template (Tier 1-4 fields) — it isn't
    # something a re-run or a body edit can fix, since Dependabot owns and
    # regenerates that body. Without this exemption, every Dependabot PR
    # above patch-level (which don't qualify for dependabot-auto-merge.yml's
    # auto-merge) permanently fails a required check it can never satisfy.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify template placeholders are filled
        uses: actions/github-script@v9
        with:
          script: |
            // Blocking check. Fails (red) if required fields are empty or still
            // contain `<angle-bracket>` placeholders. Ticks clean when fixed.
            // Type=trivial bypasses Tier 2-4.

            const MARKER = '<!-- spinr-required-fields -->';
            const VALID_TYPES = ['feat','fix','chore','refactor','perf','security','docs','trivial'];
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const body = pr.body || '';

            // ---- Helpers -------------------------------------------------
            const checked = (s) => /\[\s*x\s*\]/i.test(s || '');
            // Strip backtick-quoted spans so `git revert <sha>` doesn't trip the
            // placeholder check below. Template placeholders (e.g. `<one-line subject>`)
            // never appear inside code-fenced content.
            const stripCode = (s) => (s || '').replace(/`[^`]*`/g, '');
            const hasPlaceholder = (s) => /<[a-z][^>]*>/i.test(stripCode(s));
            // Match `**<label>...**` allowing extra words after the label
            // (e.g. `**Dependencies / coordination**`). Captures the rest of
            // the line plus any continuation sub-bullets that immediately
            // follow (indented or starting with `  -`), so multi-line values
            // are still picked up.
            const findLine = (label) => {
              const re = new RegExp('\\*\\*' + label + '[^*\\n]*\\*\\*[^\\n]*(?:\\n[ \\t]+[^\\n]+)*', 'i');
              const m = body.match(re);
              return m ? m[0] : null;
            };
            const findBlock = (startLabel, stopRe) => {
              const startRe = new RegExp(startLabel, 'i');
              const start = body.search(startRe);
              if (start === -1) return null;
              const rest = body.slice(start);
              const stop = rest.search(stopRe);
              return stop === -1 ? rest : rest.slice(0, stop);
            };

            // ---- Detect type -------------------------------------------
            const typeLine = findLine('Type');
            const typeMatch = typeLine && typeLine.match(/:\s*`?([a-z]+)`?/i);
            const type = typeMatch ? typeMatch[1].toLowerCase() : null;
            const isTrivial = type === 'trivial';

            // ---- Collect issues ----------------------------------------
            const issues = [];

            // Tier 1: Summary
            const summaryLine = findLine('Summary');
            if (!summaryLine || hasPlaceholder(summaryLine) || /:\s*$/.test(summaryLine)) {
              issues.push('Tier 1 `Summary`: fill in the one-line description (no `<...>` placeholder).');
            }

            // Tier 1: Type
            if (!type) {
              issues.push('Tier 1 `Type`: missing — pick one of ' + VALID_TYPES.join('/') + '.');
            } else if (!VALID_TYPES.includes(type)) {
              issues.push('Tier 1 `Type`: `' + type + '` is not valid — must be one of ' + VALID_TYPES.join('/') + '.');
            }

            // Tier 1: Linked issue
            const linkedLine = findLine('Linked issue');
            if (!linkedLine || !/(Fixes|Refs|none)\b/i.test(linkedLine) || hasPlaceholder(linkedLine.replace(/<n>/i, ''))) {
              issues.push('Tier 1 `Linked issue`: must start with `Fixes #N`, `Refs #N`, or `none` with reason.');
            }

            // Tier 1: Risk
            const riskLine = findLine('Risk');
            const riskMatch = riskLine && riskLine.match(/:\s*`?(low|medium|high)`?/i);
            if (!riskMatch) {
              issues.push('Tier 1 `Risk`: must be one of `low`/`medium`/`high`.');
            }

            // Tier 1: User-visible change
            const uvLine = findLine('User-visible change');
            if (!uvLine || !/(none|riders|drivers|admins|corporate)/i.test(uvLine)) {
              issues.push('Tier 1 `User-visible change`: must name the affected audience (`none`/`riders`/`drivers`/`admins`/`corporate`).');
            }

            // Tier 1: Scope contract
            const scopeLine = findLine('Scope contract');
            if (!scopeLine || !checked(scopeLine)) {
              issues.push('Tier 1 `Scope contract`: tick the `[x]` box to attest the PR matches its stated type.');
            }

            // ---- Trivial bypass ---------------------------------------
            if (!isTrivial) {
              // Tier 2: Surfaces touched — at least one [x]
              const surfacesLine = findLine('Surfaces touched');
              if (!surfacesLine || !checked(surfacesLine)) {
                issues.push('Tier 2 `Surfaces touched`: tick at least one surface.');
              }

              // Tier 2: Rollback plan
              const rollbackLine = findLine('Rollback plan');
              if (!rollbackLine || hasPlaceholder(rollbackLine) || !/(git-revert-safe|revert-plus-data-cleanup|coordinated|not-revertible)/i.test(rollbackLine)) {
                issues.push('Tier 2 `Rollback plan`: pick one of `git-revert-safe`/`revert-plus-data-cleanup`/`coordinated`/`not-revertible` and fill the one-line explanation.');
              }

              // Tier 2: Dependencies / coordination
              const depsLine = findLine('Dependencies');
              if (!depsLine || hasPlaceholder(depsLine)) {
                issues.push('Tier 2 `Dependencies / coordination`: write `none` or list PRs/releases/rotations this PR depends on.');
              }

              // Tier 2: Assumptions
              const assumptLine = findLine('Assumptions');
              if (!assumptLine || hasPlaceholder(assumptLine)) {
                issues.push('Tier 2 `Assumptions`: write `none` or state what this PR assumes about the rest of the system.');
              }

              // Tier 4: Unit tests
              const unitLine = findLine('Unit tests');
              if (!unitLine || hasPlaceholder(unitLine)) {
                issues.push('Tier 4 `Unit tests`: pick `added`/`updated`/`not-applicable` and give count or reason.');
              }

              // Tier 4: Pre-merge checklist — at least one [x]
              const checklistBlock = findBlock('Pre-merge checklist', /\n(##|<!--)/);
              if (!checklistBlock) {
                issues.push('Tier 4 `Pre-merge checklist`: section missing from PR body.');
              } else if (!checked(checklistBlock)) {
                issues.push('Tier 4 `Pre-merge checklist`: tick at least one box (or add explicit `N/A` notes inline).');
              }
            }

            // ---- Upsert comment + set status ---------------------------
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(MARKER));

            if (issues.length === 0) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              core.info('Required fields check: clean.');
              return;
            }

            const lines = [
              MARKER,
              '### :triangular_flag_on_post: PR template — required fields missing',
              '',
              'This PR cannot merge until the following are addressed:',
              '',
              ...issues.map(i => '- ' + i),
              '',
              isTrivial
                ? '_Type is `trivial` — only Tier 1 is required. The issues above are Tier 1 items._'
                : '_Setting `Type: trivial` (formatting/typo/comment-only/lockfile-only) skips Tier 2–4 checks._',
              '',
              '_This comment auto-refreshes when the PR body is edited._',
            ];
            const out = lines.join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: out });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: out });
            }
            core.setFailed(issues.length + ' required field(s) missing.');

  merge-conflict-detect:
    name: Detect merge commits on branch
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for merge commits between base and head
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          # Ensure we have the base commit locally (checkout@v4 + fetch-depth:0
          # usually does, but be defensive).
          git cat-file -e "$BASE_SHA" 2>/dev/null || git fetch origin "$BASE_SHA" --depth=1 || true
          MERGES="$(git log --merges --format='- %h %s' "${BASE_SHA}..${HEAD_SHA}" 2>/dev/null || true)"
          if [ -n "$MERGES" ]; then
            {
              echo 'merges<<MERGES_EOF'
              echo "$MERGES"
              echo 'MERGES_EOF'
              echo 'has_merges=true'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'has_merges=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Post advisory + apply label
        if: steps.scan.outputs.has_merges == 'true'
        uses: actions/github-script@v9
        env:
          MERGES: ${{ steps.scan.outputs.merges }}
        with:
          script: |
            // Advisory only — does not block. Pairs with Phase D's expander
            // which will auto-append the subsection template.
            const MARKER = '<!-- spinr-merge-conflict-detected -->';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const merges = (process.env.MERGES || '').trim();

            // Apply label (idempotent)
            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number,
                labels: ['debug:merge-conflict'],
              });
            } catch (e) { core.warning('addLabels: ' + e.message); }

            const body = pr.body || '';
            const alreadyDocumented = /conflict[\s\S]{0,200}(kept mine|kept theirs|merged manually)/i.test(body);

            const lines = [
              MARKER,
              '### :twisted_rightwards_arrows: Merge commit(s) detected on this branch',
              '',
              merges || '_(detection succeeded but log output was empty — re-check locally)_',
              '',
              alreadyDocumented
                ? '_Looks like the PR body already documents the conflict resolution — no action needed._'
                : 'Please add a **Tier 7 · Conflict & Debug Log → Merge conflict** subsection with:',
              ...(alreadyDocumented ? [] : [
                '',
                '- Files conflicted',
                '- Decision rule: `kept mine` / `kept theirs` / `merged manually`',
                '- Why — especially if a "theirs" change was dropped',
              ]),
              '',
              '_Advisory — not blocking._',
            ];
            const out = lines.join('\n');

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: out });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: out });
            }

  expand-sections:
    name: Expand conditional template sections
    # Skip when the sender is the github-actions bot — prevents infinite
    # loop when this job itself edits the PR body.
    if: github.event.pull_request.draft == false && github.event.sender.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Append Tier 5–7 subsections when diff warrants
        uses: actions/github-script@v9
        with:
          script: |
            // Appends per-area subsection templates to the PR body based on
            // which files changed. Each section carries an idempotency
            // marker so this step never double-appends.
            //
            // #2672: this job used to read pr.body straight off
            // context.payload.pull_request, which is a snapshot taken when
            // the triggering webhook fired. When a body edit lands right
            // before this job runs (e.g. the author fills in Tier 5/7 by
            // hand), that snapshot can already be stale relative to what's
            // actually on GitHub by the time this step checks for a marker
            // — every marker check below then runs against old content and
            // re-appends a second, blank copy on top of what the author
            // just filled in. Fetching the PR fresh here closes that race:
            // this step always sees whatever body is live right now.
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const fresh = (await github.rest.pulls.get({
              owner, repo, pull_number: pr.number,
            })).data;

            // ---- Detect diff shape --------------------------------------
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const paths = files.map(f => f.filename);
            const touched = (re) => paths.some(p => re.test(p));

            const MONEY_RE = /^backend\/(services\/(fare_|corporate_)|routes\/(payments|wallet|fares|tips|payouts|corporate)|utils\/(surge_engine|payment_retry))/;
            const MIGRATION_RE = /^backend\/migrations\//;
            const UI_RE = /^(rider-app|driver-app|admin-dashboard)\/.*\.(tsx|jsx|ts|js)$/;
            const AUTH_RE = /^backend\/(routes\/auth|routes\/admin\/auth|utils\/crypto|utils\/rate_limiter)/;
            const LIFESPAN_RE = /^backend\/core\/lifespan\.py$/;
            const RLS_RE = /^backend\/migrations\/.*(rls|policy).*\.sql$/i;
            const SAFETY_RE = /^backend\/(routes\/(safety|sos)|services\/insurance_|utils\/emergency_)/;

            const hasMoney = touched(MONEY_RE);
            const hasMigration = touched(MIGRATION_RE);
            const hasUI = touched(UI_RE);
            const hasAuth = touched(AUTH_RE);
            const hasBgJob = touched(LIFESPAN_RE);
            const hasRLS = touched(RLS_RE);
            const hasSafety = touched(SAFETY_RE);

            // ---- Detect type/risk from body ----------------------------
            const body = fresh.body || '';
            const typeLine = body.match(/\*\*Type\*\*[^\n]*/i)?.[0] || '';
            const typeMatch = typeLine.match(/:\s*`?([a-z]+)`?/i);
            const type = typeMatch ? typeMatch[1].toLowerCase() : null;
            const riskLine = body.match(/\*\*Risk\*\*[^\n]*/i)?.[0] || '';
            const riskMatch = riskLine.match(/:\s*`?(low|medium|high)`?/i);
            const risk = riskMatch ? riskMatch[1].toLowerCase() : null;
            const isTrivial = type === 'trivial';
            const isBugFix = type === 'fix';
            const isHighRisk = risk === 'high';

            if (isTrivial) {
              core.info('type=trivial — skipping section expansion.');
              return;
            }

            // ---- Section templates (each with idempotency marker) ------
            const sections = [];
            const add = (marker, heading, bullets) => {
              if (body.includes(marker)) return; // already appended
              sections.push([
                marker,
                '## ' + heading,
                '',
                ...bullets,
              ].join('\n'));
            };

            if (hasMigration) {
              add('<!-- spinr-expanded:migration -->',
                'Tier 5 · Migration details',
                [
                  '- **Migration file**: `backend/migrations/NN_*.sql`',
                  '- **Next sequence number verified**: `[ ]`',
                  '- **Reversible on paper**: describe rollback (drop column / revert default / etc.)',
                  '- **Forward-compatible with in-flight traffic**: `[ ]` — old backend can still read/write against new schema',
                  '- **Indexes added for new query patterns**: `[ ]` or N/A',
                  '- **RLS policies ship in the same migration for any new user-data table**: `[ ]` or N/A',
                  '- **Run-time estimate on prod data**: < 30 s (flag if longer and attach plan)',
                ]);
            }

            if (hasMoney) {
              add('<!-- spinr-expanded:money -->',
                'Tier 5 · Money-touching details',
                [
                  '- **Decimal-only arithmetic** — no floats touch fare/wallet/surge math: `[ ]`',
                  '- **Stripe idempotency**: `claim_stripe_event` called before processing webhook (N/A if not webhook): `[ ]`',
                  '- **Surge cap 2.5× respected** (or manual override with documented justification): `[ ]`',
                  '- **Corporate billing priority preserved** (rider wallet → card → allowance → master fallback): `[ ]`',
                  '- **Receipt line-items remain transparent** — no hidden "service fee": `[ ]`',
                  '- **PST/GST line items correct** (if receipt-facing): `[ ]` or N/A',
                  '- **Before/after fare on a sample trip** (attach): ',
                ]);
            }

            if (hasUI) {
              add('<!-- spinr-expanded:ui -->',
                'Tier 5 · UI change details',
                [
                  '- **Screenshots / screen recording attached** (iOS + Android if RN): `[ ]`',
                  '- **Accessibility** — labels, contrast, screen reader: `[ ]` or N/A',
                  '- **Dark mode verified** (if theme-aware): `[ ]` or N/A',
                  '- **i18n / localization strings added** (if user-visible copy): `[ ]` or N/A',
                  '- **Tested on smallest supported device width**: `[ ]`',
                ]);
            }

            if (hasAuth) {
              add('<!-- spinr-expanded:auth -->',
                'Tier 5 · Auth / RLS details',
                [
                  '- **JWT claims unchanged** (or downstream consumers listed): `[ ]`',
                  '- **Rider/driver role re-read from DB on every request** — never trusted from JWT: `[ ]`',
                  '- **OTP policy preserved** (SHA-256 at rest, 5/hr → 24h lockout, dev bypass gated by `ENV`): `[ ]` or N/A',
                  '- **Rate limits added/updated** for new auth endpoint: `[ ]` or N/A',
                  '- **Both allowed and denied paths covered by tests**: `[ ]`',
                ]);
            }

            if (hasBgJob) {
              add('<!-- spinr-expanded:background-job -->',
                'Tier 5 · Background-loop details',
                [
                  '- **Replay-safety mechanism** (claim flag / idempotency key / atomic DB claim / Redis leader lock) — pick one and name it: ',
                  '- **Loop interval**: `N s` — justify if < 30 s',
                  '- **Shutdown-safe** — in-flight work either finishes or is resumable next tick: `[ ]`',
                  '- **Metric emitted per tick** (`spinr.<domain>.<metric>`): ',
                  '- **Failure mode** — what happens if the tick throws? (Sentry only? retry next tick? backoff?)',
                ]);
            }

            if (hasRLS) {
              add('<!-- spinr-expanded:rls -->',
                'Tier 5 · RLS policy details',
                [
                  '- **Policies enumerate SELECT / INSERT / UPDATE / DELETE explicitly** — never `FOR ALL` on user-writable tables: `[ ]`',
                  '- **Both allowed and denied paths tested against anon key**: `[ ]`',
                  '- **Service role bypass still intentional and documented**: `[ ]`',
                ]);
            }

            if (hasSafety) {
              add('<!-- spinr-expanded:safety -->',
                'Tier 5 · Safety details',
                [
                  '- **Insurance period derivation correct** (derive from ride state, not UI): `[ ]`',
                  '- **`driver_insurance_periods` rows append-only** — no update/delete: `[ ]`',
                  '- **SOS never auto-dials 911** — only offers one-tap: `[ ]` or N/A',
                  '- **Emergency-contact fan-out tested end-to-end**: `[ ]` or N/A',
                ]);
            }

            if (isBugFix) {
              add('<!-- spinr-expanded:bug-fix -->',
                'Tier 6 · Bug-fix notes',
                [
                  '- **Root cause (one paragraph)**: ',
                  '- **How it was introduced** (commit/PR link or "unknown — pre-dates history"): ',
                  '- **Why it was not caught earlier** (missing test / missing alert / dormant path): ',
                  '- **Regression test added that fails without this fix**: `[ ]` or explain',
                  '- **Backport needed?**: `none` | `staging` | `hotfix-to-main`',
                ]);
            }

            if (isHighRisk) {
              add('<!-- spinr-expanded:risk-high -->',
                'Tier 7 · High-risk stop condition & unmerge trigger',
                [
                  '- **Stop condition** — what signal (metric, alert, log pattern) tells us to roll back and within what window: ',
                  '- **Unmerge trigger** — who decides, and how fast: ',
                  '- **Rollback command verified** (not just written down): `[ ]`',
                  '- **On-call informed before merge**: `[ ]`',
                ]);
            }

            if (sections.length === 0) {
              core.info('No new sections to append.');
              return;
            }

            const appended = '\n\n' + sections.join('\n\n') + '\n';
            const newBody = body.trimEnd() + appended;

            await github.rest.pulls.update({
              owner, repo, pull_number: pr.number, body: newBody,
            });
            core.info('Appended ' + sections.length + ' section(s) to PR body.');

  auto-summary:
    name: Auto-summary comment
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post/update PR auto-summary
        uses: actions/github-script@v9
        with:
          script: |
            // Posts a single comment that summarises:
            //   - declared type/risk/audience
            //   - surfaces touched (inferred from diff)
            //   - compliance flags that look warranted vs ticked
            //   - size bucket
            // Upserted via marker; comment body is advisory only.

            const MARKER = '<!-- spinr-auto-summary -->';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const body = pr.body || '';

            // ---- Parse declared fields ---------------------------------
            const findLine = (label) => {
              const m = body.match(new RegExp('\\*\\*' + label + '\\*\\*[^\\n]*', 'i'));
              return m ? m[0] : '';
            };
            const pickEnum = (line, re) => (line.match(re) || [])[1] || null;

            const type = pickEnum(findLine('Type'), /:\s*`?([a-z]+)`?/i);
            const risk = pickEnum(findLine('Risk'), /:\s*`?(low|medium|high)`?/i);
            const audience = pickEnum(findLine('User-visible change'), /:\s*`?(none|riders|drivers|admins|corporate)`?/i);
            const blast = pickEnum(findLine('Blast radius'), /:\s*`?(isolated|single-surface|multi-surface|cross-cutting)`?/i);

            // Compliance tick detection (same pattern used in required-fields)
            const ticked = (label) => {
              const line = body.match(new RegExp('\\[\\s*x\\s*\\]\\s*\\*\\*' + label, 'i'));
              return !!line;
            };
            const declared = {
              money: ticked('Money-touching'),
              pipeda: ticked('PIPEDA-relevant'),
              sk: ticked('SK Transportation Act'),
              authrls: ticked('Auth / RLS'),
              safety: ticked('Safety'),
              sdk: ticked('Third-party SDK added'),
              sharedBreak: ticked('Breaking change to'),
            };

            // ---- Diff-derived facts ------------------------------------
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const paths = files.map(f => f.filename);
            const touched = (re) => paths.some(p => re.test(p));

            const facts = {
              money: touched(/^backend\/(services\/(fare_|corporate_)|routes\/(payments|wallet|fares|tips|payouts|corporate)|utils\/(surge_engine|payment_retry))/),
              migration: touched(/^backend\/migrations\//),
              authrls: touched(/^backend\/(routes\/auth|routes\/admin\/auth|utils\/crypto|utils\/rate_limiter|migrations\/.*(rls|policy))/i),
              safety: touched(/^backend\/(routes\/(safety|sos)|services\/insurance_|utils\/emergency_)/),
              shared: touched(/^shared\//),
              infra: touched(/^(\.github\/workflows|scripts|Dockerfile|docker-compose|railway|render|vercel)/),
            };

            // Mismatches: diff says X but declaration didn't tick the box
            const mismatches = [];
            if (facts.money && !declared.money) mismatches.push('Diff touches money paths — tick **Money-touching**.');
            if (facts.authrls && !declared.authrls) mismatches.push('Diff touches auth/RLS paths — tick **Auth / RLS**.');
            if (facts.safety && !declared.safety) mismatches.push('Diff touches safety paths — tick **Safety**.');

            // Surface breakdown
            const surfaces = {
              backend: paths.filter(p => p.startsWith('backend/')).length,
              rider: paths.filter(p => p.startsWith('rider-app/')).length,
              driver: paths.filter(p => p.startsWith('driver-app/')).length,
              admin: paths.filter(p => p.startsWith('admin-dashboard/')).length,
              shared: paths.filter(p => p.startsWith('shared/')).length,
              migrations: paths.filter(p => p.startsWith('backend/migrations/')).length,
              infra: paths.filter(p => /^(\.github\/workflows|scripts|Dockerfile|docker-compose|railway|render|vercel)/.test(p)).length,
            };
            const surfaceLine = Object.entries(surfaces)
              .filter(([, n]) => n > 0)
              .map(([k, n]) => '`' + k + '` (' + n + ')')
              .join(' · ') || '_none detected_';

            const total = pr.additions + pr.deletions;
            const sizeBucket =
              total < 100 ? 'small' :
              total < 500 ? 'medium' :
              total < 1500 ? 'large' : 'extra-large';

            // ---- Build comment -----------------------------------------
            const lines = [
              MARKER,
              '### :mag: PR auto-summary',
              '',
              '| Field | Declared | Notes |',
              '|---|---|---|',
              '| Type | ' + (type ? '`' + type + '`' : '_missing_') + ' | |',
              '| Risk | ' + (risk ? '`' + risk + '`' : '_missing_') + ' | ' + (risk === 'high' ? ':warning: Tier 7 stop condition required' : '') + ' |',
              '| Audience | ' + (audience ? '`' + audience + '`' : '_missing_') + ' | |',
              '| Blast radius | ' + (blast ? '`' + blast + '`' : '_missing_') + ' | |',
              '| Size | `' + sizeBucket + '` | ' + pr.changed_files + ' files · ' + total + ' lines |',
              '',
              '**Surfaces touched (from diff):** ' + surfaceLine,
              '',
            ];

            if (mismatches.length) {
              lines.push('**:warning: Declaration vs diff — double-check:**');
              lines.push('');
              mismatches.forEach(m => lines.push('- ' + m));
              lines.push('');
            }

            lines.push('_Advisory — refreshed on every PR edit. Fields are parsed from the PR body; if something looks wrong, check the template._');
            const out = lines.join('\n');

            // ---- Upsert -------------------------------------------------
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              if (existing.body === out) {
                core.info('Auto-summary unchanged.');
                return;
              }
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: out });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: out });
            }

