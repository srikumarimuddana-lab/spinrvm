# Provisioning TEMPLATE: not automatically loaded into Grafana Cloud.
# Create/verify spinr-capacity-email and replace datasource UID before enabling.
# Does not replace existing contact points or the global notification policy.
apiVersion: 1
groups:
  - orgId: 1
    name: spinr-fleet-capacity
    folder: Spinr Production
    interval: 1m
    rules:
      - uid: spinr-fleet-six-machines
        title: Backend capacity warning (6+ Machines or missing telemetry)
        condition: C
        for: 0s
        noDataState: Alerting
        execErrState: Alerting
        labels:
          app: spinr-backend-yyz
          severity: P1
          domain: capacity
        annotations:
          summary: Six or more backend Machines are running, or fleet telemetry is unavailable
          description: >-
            Repeats every 15 minutes while firing. Check the query result:
            missing/error data means unknown capacity, not a confirmed six Machines.
            Inspect memory, CPU, DB readiness and burst-controller decisions.
          runbook_url: docs/runbooks/fly-mixed-fleet.md
        notification_settings:
          receiver: spinr-capacity-email
          group_by: [alertname, grafana_folder, app]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 15m
        data:
          - refId: A
            datasourceUid: <FLY_PROMETHEUS_DATASOURCE_UID>
            relativeTimeRange: {from: 180, to: 0}
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                count(max by(instance)(
                  (fly_instance_up{app="spinr-backend-yyz"} == 1)
                  and
                  (time() - timestamp(fly_instance_up{app="spinr-backend-yyz"}) < 90)
                ))
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: math
              expression: $A >= 6

      - uid: spinr-burst-controller-unhealthy
        title: Burst controller needs attention (or telemetry missing)
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          app: spinr-burst-controller-yyz
          severity: P1
          domain: capacity
        annotations:
          summary: Burst control is blocked, a start failed, or observations stopped
          description: >-
            Check credentials, leases, source telemetry, dependency readiness,
            attempt budget and the eight-Machine cap. Failed starts remain visible
            for one hour. A running controller VM alone does not prove control works.
          runbook_url: infra/burst_controller/README.md
        notification_settings:
          receiver: spinr-capacity-email
          group_by: [alertname, grafana_folder, app]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 15m
        data:
          - refId: A
            datasourceUid: <FLY_PROMETHEUS_DATASOURCE_UID>
            relativeTimeRange: {from: 180, to: 0}
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                clamp_max(
                  max(spinr_burst_action_required{app="spinr-burst-controller-yyz"})
                  + (time() - max(spinr_burst_last_observation_timestamp_seconds{app="spinr-burst-controller-yyz"}) > bool 90)
                  + ((max(spinr_burst_last_failed_start_timestamp_seconds{app="spinr-burst-controller-yyz"}) > bool 0)
                     * (time() - max(spinr_burst_last_failed_start_timestamp_seconds{app="spinr-burst-controller-yyz"}) < bool 3600)),
                  1
                )
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: math
              expression: $A > 0
