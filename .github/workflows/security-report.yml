name: Automated Security Scan Report

# Phase 2 of the 2026-09-19 security automation program
# (docs/audit/2026-09-19-security-automation-roadmap.md): turns the JSON
# artifacts security-gates.yml already produces into a Markdown posture
# report, instead of hand-writing one after each run.
#
# Only reacts to Security Gates runs on `main` (its push/schedule triggers),
# never on a PR run -- a report per PR would be noise, and PR runs don't
# necessarily reflect what's actually deployed. Runs regardless of the
# triggering run's conclusion (success or failure): a report on a red run is
# exactly when the finding counts matter most.

on:
  workflow_run:
    workflows:
      - Security Gates
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  check-trigger:
    name: Check trigger condition
    runs-on: ubuntu-latest
    # No token use here (pure string comparison) -- scoped to nothing so
    # this job is not a target even if a future edit adds a step.
    permissions: {}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      run_id: ${{ steps.check.outputs.run_id }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Evaluate trigger
        id: check
        # Semgrep (yaml.github-actions.security.run-shell-injection) flagged
        # the prior version of this step for interpolating `github.event.*`
        # values directly into the `run:` script -- exactly the fork-PR
        # attack surface this same step's own logic exists to defend
        # against (a crafted branch/repo name containing shell metacharacters
        # could otherwise execute in this runner). Fixed the same way the
        # finding recommends: every untrusted value is passed through `env:`
        # first, never interpolated with `${{ }}` inside the script body.
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Security-gates.yml also triggers on `pull_request`/`merge_group`
          # (including from forks), where `head_branch`/`head_sha` name the
          # PR's SOURCE branch/commit -- attacker-controlled on a fork PR,
          # and a fork PR whose branch happens to be named "main" would
          # otherwise pass a bare branch-name check. Require the triggering
          # run to actually be a push/schedule/manual-dispatch run of this
          # repo's own main (security-gates.yml's non-PR trigger legs),
          # never `pull_request`/`merge_group`, and head_repository must be
          # this repo, not a fork. Only then is head_sha safe to check out
          # and execute a script from.
          case "$TRIGGER_EVENT" in
            push|schedule|workflow_dispatch) TRUSTED_EVENT=true ;;
            *) TRUSTED_EVENT=false ;;
          esac
          if [ "$BRANCH" = "main" ] && [ "$TRUSTED_EVENT" = "true" ] && [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  generate-report:
    name: Generate security scan report
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ needs.check-trigger.outputs.run_id }}
      HEAD_SHA: ${{ needs.check-trigger.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.check-trigger.outputs.head_sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Each download is best-effort: a gate can fail before producing its
      # artifact, or (pip-audit, yarn-audit, gitleaks) not publish one at
      # all yet (see the roadmap doc's Phase 2 gap note). The generator
      # script itself distinguishes "no data" from "clean scan" in its
      # output, so a missing download here must never be silently treated
      # as zero findings.
      #
      # This is the FIRST cross-run (workflow_run) artifact download in this
      # repo -- every other actions/download-artifact call here downloads
      # same-run. The pinned SHA below is the same one already used for
      # same-run downloads elsewhere (ci-error-audit.yml, ci-guardrails.yml),
      # paired with the same actions/upload-artifact SHA security-gates.yml
      # already uses for bandit-report -- not a new/unproven pairing, just
      # applied cross-run for the first time via its documented `run-id` +
      # `github-token` inputs. If this ever 404s or fails to resolve the
      # artifact, check the actions/download-artifact release notes for
      # cross-run support at this exact pinned version before assuming the
      # generator script is at fault.
      - name: Download bandit report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bandit-report
          path: /tmp/artifacts
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Spinr Semgrep report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spinr-rules-report
          path: /tmp/artifacts
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download npm audit (admin-dashboard) report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-audit-admin-report
          path: /tmp/artifacts
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate report
        run: |
          python3 scripts/security/generate_security_summary.py \
            --bandit /tmp/artifacts/bandit-report.json \
            --semgrep /tmp/artifacts/spinr-rules.json \
            --npm-audit /tmp/artifacts/npm-audit-admin.json \
            --repo "${{ github.repository }}" \
            --run-id "$RUN_ID" \
            --branch main \
            --commit "$HEAD_SHA" \
            --output /tmp/security_summary.md
          cat /tmp/security_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR with the report
        run: |
          REPORT_DATE=$(date -u +"%Y-%m-%d")
          REPORT_PATH="docs/audit/${REPORT_DATE}-automated-security-scan.md"
          BRANCH="security-report-${REPORT_DATE}-${RUN_ID}"

          # Nothing to do if a report for today already opened a PR (e.g. a
          # re-run of the same day's Security Gates workflow_dispatch).
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists — skipping, avoid duplicate PRs."
            exit 0
          fi

          mkdir -p docs/audit
          cp /tmp/security_summary.md "$REPORT_PATH"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$REPORT_PATH"
          git commit -m "docs: automated security scan report ${REPORT_DATE}

          Auto-generated from Security Gates run ${RUN_ID} (commit ${HEAD_SHA:0:12}).
          See scripts/security/generate_security_summary.py."
          git push origin "$BRANCH"

          gh pr create \
            --title "docs: automated security scan report ${REPORT_DATE}" \
            --draft \
            --body "## Automated security scan report

          Generated from [Security Gates run ${RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}) on \`main\` at commit \`${HEAD_SHA:0:12}\`.

          This report summarizes SAST/dependency-audit finding counts by severity — see the full report file for details. It does not cover every gate in security-gates.yml yet (pip-audit, yarn-audit, gitleaks don't currently publish a downloadable artifact); see \`docs/audit/2026-09-19-security-automation-roadmap.md\` Phase 2 for that gap.

          No code change — docs only. Merge to keep the automated report history, or close if a HIGH/CRITICAL finding needs a real fix first (open a separate PR for that fix; this one is just the report).

          ---
          AI-assisted — spinr platform (automated report generation, Phase 2)"
