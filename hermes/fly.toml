# Hermes — Spinr Ops Agent
# Deploy: fly deploy --config hermes/fly.toml
# Secrets: fly secrets set TELEGRAM_BOT_TOKEN=... SPINR_API_KEY=... etc.

app = "hermes-spinr"
primary_region = "yyz"
kill_signal = "SIGINT"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  PORT = "8585"
  LOG_LEVEL = "info"
  HERMES_PUBLIC_URL = "https://hermes-spinr.fly.dev"

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8585
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 300

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
