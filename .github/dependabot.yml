version: 2

updates:
  # ─── Backend Python dependencies ─────────────────────────────────────────
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Regina
    open-pull-requests-limit: 5
    groups:
      fastapi-stack:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "starlette"
          - "pydantic*"
      testing:
        patterns:
          - "pytest*"
          - "httpx"
      security-critical:
        patterns:
          - "cryptography"
          - "PyJWT"
          - "bcrypt"
          - "firebase-admin"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    reviewers:
      - "srikumarimuddana-lab"
    ignore:
      # Pin major versions — bump manually with full testing
      - dependency-name: "supabase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]

  # ─── Admin Dashboard (Next.js) ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /admin-dashboard
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Regina
    open-pull-requests-limit: 5
    groups:
      next-stack:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      testing:
        patterns:
          - "vitest*"
          - "playwright*"
          - "@playwright/*"
          - "@testing-library/*"
    labels:
      - "dependencies"
      - "admin-dashboard"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint 10.x crashes `npm run lint` outright (not just warns) — see
      # #4823. eslint-plugin-react@7.37.5 (latest published) still calls the
      # deprecated context.getFilename() from its shared React-version-
      # detection utility, which eslint@10 no longer shims; its own
      # peerDependencies cap at ^9.7, so it has no ESLint 10 support yet.
      # #4774 auto-bumped this once already and PR #4898 had to pin back to
      # ^9.39.5. Lift this once eslint-plugin-react ships an ESLint
      # 10-compatible release.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # ─── Rider App ───────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /rider-app
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Regina
    open-pull-requests-limit: 5
    groups:
      expo-stack:
        patterns:
          - "expo"
          - "expo-*"
          - "react-native"
          - "@react-navigation/*"
      testing:
        patterns:
          - "jest*"
          - "jest-expo"
          - "playwright*"
    labels:
      - "dependencies"
      - "rider-app"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      # react-native minors are SDK-coupled breaking changes: Expo SDK 57
      # bundles RN 0.86.x, and 0.87 removed rn-get-polyfills, which every
      # 57.x @expo/metro-config requires — 'expo export'/'eas build' hard-fail
      # (seen on the 2026-08 expo-stack group PRs). Bump RN only together
      # with an Expo SDK upgrade.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # jest 30.4.x's runtime rewrite calls jest-mock APIs jest-expo's
      # bundled jest-29-era environments don't provide (clearMocksOnScope) —
      # every suite fails at startup. Lift this once jest-expo ships
      # jest-30.4-compatible environments.
      - dependency-name: "jest"
        update-types: ["version-update:semver-minor"]

  # ─── Driver App ──────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /driver-app
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
      timezone: America/Regina
    open-pull-requests-limit: 5
    groups:
      expo-stack:
        patterns:
          - "expo"
          - "expo-*"
          - "react-native"
          - "@react-navigation/*"
      testing:
        patterns:
          - "jest*"
          - "jest-expo"
          - "playwright*"
    labels:
      - "dependencies"
      - "driver-app"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      # react-native minors are SDK-coupled breaking changes: Expo SDK 57
      # bundles RN 0.86.x, and 0.87 removed rn-get-polyfills, which every
      # 57.x @expo/metro-config requires — 'expo export'/'eas build' hard-fail
      # (seen on the 2026-08 expo-stack group PRs). Bump RN only together
      # with an Expo SDK upgrade.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # jest 30.4.x's runtime rewrite calls jest-mock APIs jest-expo's
      # bundled jest-29-era environments don't provide (clearMocksOnScope) —
      # every suite fails at startup. Lift this once jest-expo ships
      # jest-30.4-compatible environments.
      - dependency-name: "jest"
        update-types: ["version-update:semver-minor"]

  # ─── Shared package ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: America/Regina
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "shared"
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # ─── GitHub Actions ───────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: America/Regina
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      actions-core:
        patterns:
          - "actions/*"
      docker:
        patterns:
          - "docker/*"
