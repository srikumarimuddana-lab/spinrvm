name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spinr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-locked.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # B-P1-10: install from the SHA-256 hash-pinned lockfile that ships
          # to production. --require-hashes makes pip refuse any wheel whose
          # digest doesn't match, blocking compromised mirrors / typosquats.
          # pytest-mock is now declared in requirements.in and therefore present
          # in requirements-locked.txt with a verified SHA-256 hash — no
          # separate bare `pip install pytest-mock` needed.
          pip install --require-hashes -r requirements-locked.txt

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Lint backend (ruff)
        working-directory: backend
        continue-on-error: true
        run: |
          python -m ruff --version
          python -m ruff check .
          python -m ruff format --check .

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spinr_test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_KEY: test-secret-key-for-ci
          ENV: test
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing --timeout=30 -v

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # Python dependency CVE audit.
  # Runs as its own job — NOT as a step inside backend-test — because a newly
  # published advisory against a pinned dependency must never gate the test
  # suite: between 2026-05-23 and 2026-06-12 an in-step pip-audit failure
  # silently skipped "Run backend tests" on every run of main and every PR.
  # The audit stays a loud, first-class failure (wired into notify-failure)
  # but tests, lint, and coverage report independently of it.
  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python dependency CVE scan
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-locked.txt

  # Frontend (Rider App) Tests
  # DISABLED: frontend/ was deprecated 2026-04-14 (Decision D-003/D-004).
  # It runs Expo SDK 54 / RN 0.81.5, one SDK behind rider-app and driver-app,
  # and has 42% screen parity with zero unique features.  Keeping it in the
  # required CI gate blocks every PR on a stale surface.  The rider-app-test
  # job covers the production mobile surface.  Re-enable or delete this job
  # once frontend/ is fully archived or removed from the repo.
  frontend-test:
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend
        run: yarn lint

      - name: Run frontend tests
        working-directory: frontend
        run: yarn test --ci --coverage --forceExit --reporters=default

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # Driver App Tests
  driver-app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: driver-app/node_modules
          # No restore-keys: a partial restore from an older key keeps a
          # node_modules with prior patch hunks already applied, then
          # patch-package fails to re-apply on top. Force a clean miss.
          key: ${{ runner.os }}-driver-node-${{ hashFiles('driver-app/yarn.lock', 'driver-app/patches/**') }}

      - name: Install dependencies
        working-directory: driver-app
        run: yarn install --frozen-lockfile

      - name: Check for exposed secrets in EXPO_PUBLIC vars
        run: |
          if grep -r "EXPO_PUBLIC_.*SECRET\|EXPO_PUBLIC_.*PRIVATE\|EXPO_PUBLIC_.*SERVICE_ROLE\|EXPO_PUBLIC_.*ANTHROPIC" \
            driver-app/.env* driver-app/app.config.ts; then
            echo "ERROR: Private key found in EXPO_PUBLIC_ variable"
            exit 1
          fi

      - name: TypeScript check
        working-directory: driver-app
        run: yarn tsc --noEmit

      - name: Run driver app tests
        working-directory: driver-app
        run: yarn test --ci --coverage --forceExit --reporters=default


      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          file: ./driver-app/coverage/coverage-final.json
          flags: driver-app
          name: driver-app-coverage

  # Rider App Tests (dedicated app — rider-app/)
  # Note: frontend/ is the legacy combined app, still tested by frontend-test.
  # This job covers the canonical rider-app/ going forward.
  rider-app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: rider-app/node_modules
          key: ${{ runner.os }}-rider-node-${{ hashFiles('rider-app/yarn.lock', 'rider-app/patches/**') }}

      - name: Install dependencies
        working-directory: rider-app
        run: yarn install --frozen-lockfile

      - name: Check for exposed API keys in EXPO_PUBLIC vars
        run: |
          if grep -rE "EXPO_PUBLIC_(ANTHROPIC|STRIPE_SECRET|SUPABASE_SERVICE_ROLE|JWT_SECRET)" \
            rider-app/.env* rider-app/app.config.ts 2>/dev/null; then
            echo "ERROR: Private key found in EXPO_PUBLIC_ variable — never embed server-side secrets in mobile builds"
            exit 1
          fi

      - name: TypeScript check
        working-directory: rider-app
        run: yarn tsc --noEmit

      - name: Run rider app tests
        working-directory: rider-app
        run: yarn test --ci --coverage --forceExit --reporters=default

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          file: ./rider-app/coverage/coverage-final.json
          flags: rider-app
          name: rider-app-coverage

  # Admin Dashboard Tests
  admin-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: admin-dashboard/node_modules
          key: ${{ runner.os }}-admin-node-${{ hashFiles('admin-dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-admin-node-

      - name: Install dependencies
        working-directory: admin-dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: admin-dashboard
        run: npm run lint

      - name: Run admin dashboard tests
        working-directory: admin-dashboard
        run: npm test

      - name: Build admin dashboard
        working-directory: admin-dashboard
        env:
          BACKEND_URL: https://api-spinr.spinr.ca
          NEXT_PUBLIC_API_URL: https://api-spinr.spinr.ca
        run: npm run build

  # E2E Tests — blocking on main, non-blocking on PRs while the suite stabilises ([17-1])
  e2e-test:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          BACKEND_URL: http://localhost:8000

      - name: Start Next.js and run E2E tests
        run: |
          npx next start &
          npx wait-on http://localhost:3000 --timeout 30000
          npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          BACKEND_URL: http://localhost:8000
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: admin-dashboard/playwright-report/
          retention-days: 7

  # Deploy Backend
  deploy-backend:
    runs-on: ubuntu-latest
    # python-dependency-audit gates the deploy (not the tests): before the
    # audit was split into its own job, a pip-audit failure inside
    # backend-test blocked this deploy transitively — keep that release
    # blocker intact now that tests report independently.
    needs: [backend-test, python-dependency-audit]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      # Railway is the primary backend host (CLAUDE.md). --fail-with-body
      # ensures a non-zero exit on HTTP 4xx/5xx so the Render fallback
      # step actually triggers on API errors (previously curl exited 0
      # on any HTTP response, silently skipping Render).
      - name: Deploy to Railway (primary)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli@4.40.2
          railway up --service spinr-backend

      - name: Deploy to Render (fallback)
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          curl --fail-with-body -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"

  # Deploy Frontend — DISABLED: frontend/ deprecated 2026-04-14 (see frontend-test comment).
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-test]
    if: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build for production
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: npx expo export --platform web

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          working-directory: frontend

  # Deploy Admin Dashboard
  deploy-admin:
    runs-on: ubuntu-latest
    needs: [admin-test, deploy-backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: admin-dashboard
        run: npm ci

      - name: Build for production
        working-directory: admin-dashboard
        run: npm run build

      - name: Scan build output for accidentally bundled secrets ([17-5])
        working-directory: admin-dashboard
        run: |
          GITLEAKS_VERSION=8.27.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source .next --no-git --redact --exit-code 1
          rm gitleaks

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          working-directory: admin-dashboard

  # Mobile Build (EAS)
  mobile-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [rider-app-test, driver-app-test]
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build]')

    steps:
      - uses: actions/checkout@v7

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install rider app dependencies
        working-directory: rider-app
        run: yarn install --frozen-lockfile

      - name: Build iOS (Rider)
        working-directory: rider-app
        run: eas build --platform ios --non-interactive

      - name: Build Android (Rider)
        working-directory: rider-app
        run: eas build --platform android --non-interactive

  # Security Scan — filesystem (dependency CVEs) + secrets
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history required for trufflehog --since-commit

      - name: Install trufflehog v3
        run: |
          curl -sLo trufflehog.tar.gz \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.94.3/trufflehog_3.94.3_linux_amd64.tar.gz
          tar -xzf trufflehog.tar.gz trufflehog
          chmod +x trufflehog && sudo mv trufflehog /usr/local/bin/

      - name: Secrets scan
        run: |
          # On PRs use the target branch as the scan baseline; on push to main scan HEAD~1.
          BASE_REF="${{ github.base_ref }}"
          if [ -n "$BASE_REF" ]; then
            SINCE="origin/${BASE_REF}"
          else
            SINCE="HEAD~1"
          fi
          trufflehog git file://. --since-commit "$SINCE" --fail

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Docker image security scan — blocks on CRITICAL or HIGH CVEs
  docker-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-test]

    steps:
      - uses: actions/checkout@v7

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag spinr-backend:ci-${{ github.sha }} \
            backend/

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spinr-backend:ci-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spinr-backend:ci-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload image scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image.sarif'

      # INF-006: Sign the image with cosign (keyless, OIDC-based Sigstore).
      # Only runs on main so feature-branch builds don't require GHCR push
      # permissions. The signature is written to the registry alongside the
      # image and can be verified with:
      #   cosign verify ghcr.io/${{ github.repository }}/spinr-backend:latest \
      #     --certificate-identity-regexp 'github.com/srikumarimuddana-lab/spinrvm' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag spinr-backend:ci-${{ github.sha }} \
            ghcr.io/${{ github.repository }}/spinr-backend:${{ github.sha }}
          docker tag spinr-backend:ci-${{ github.sha }} \
            ghcr.io/${{ github.repository }}/spinr-backend:latest
          docker push ghcr.io/${{ github.repository }}/spinr-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/spinr-backend:latest

      - name: Sign image with cosign (keyless OIDC)
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/spinr-backend:${{ github.sha }}

  # Post-deploy smoke test
  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: github.ref == 'refs/heads/main'
    env:
      BASE: ${{ secrets.RAILWAY_PUBLIC_URL }}
      FALLBACK: https://api-spinr.spinr.ca
    steps:
      - name: Resolve live base URL
        id: resolve
        run: |
          # Use Railway (primary); fall back to Render if unreachable.
          if curl -sf --retry 2 --retry-delay 3 "$BASE/health" > /dev/null; then
            echo "url=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "url=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi

      - name: Health check — confirm 200 + DB reachable
        # /health performs a real DB readiness ping (F1): a dead-DB deploy
        # returns 503 (curl -sf fails) or status!=healthy, turning this red.
        run: |
          BODY=$(curl -sf --retry 3 --retry-delay 5 "${{ steps.resolve.outputs.url }}/health")
          echo "$BODY"
          echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('status') in ('ok','healthy'), f'bad status: {d}'; assert d.get('db', {}).get('status') == 'ok', f'DB not ready: {d}'"

      - name: Settings endpoint — confirm 200 + JSON
        run: |
          curl -sf "${{ steps.resolve.outputs.url }}/api/v1/settings" | \
            python3 -c "import json,sys; json.load(sys.stdin)"

      - name: Vehicle types endpoint — confirm 200 + non-empty list
        run: |
          BODY=$(curl -sf "${{ steps.resolve.outputs.url }}/api/v1/vehicle-types")
          echo "$BODY"
          echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d) > 0, 'vehicle-types list is empty'"

      - name: Auth middleware — confirm 401 not 500 on protected endpoint
        # Verifies the auth middleware is wired: unauthenticated access to a
        # protected route must return 401, not 500 (misconfigured JWT secret
        # or missing middleware would return 500).
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ steps.resolve.outputs.url }}/api/v1/rides")
          echo "GET /api/v1/rides → HTTP $STATUS"
          [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || {
            echo "FAIL: expected 401/403, got $STATUS — auth middleware may be misconfigured"
            exit 1
          }

      - name: Fare service — confirm 401 not 500 on fare estimate
        # Verifies the fare service is mounted and responding (not crashed):
        # unauthenticated request must return 401, not 500 or 404.
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ steps.resolve.outputs.url }}/api/v1/fares/estimate")
          echo "GET /api/v1/fares/estimate → HTTP $STATUS"
          [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || [ "$STATUS" = "422" ] || {
            echo "FAIL: expected 401/403/422, got $STATUS — fare service may be down or unregistered"
            exit 1
          }

  # Notify on failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: [backend-test, rider-app-test, driver-app-test, admin-test, python-dependency-audit]
    if: failure()

    steps:
      - name: Send Slack notification
        # continue-on-error so a missing/invalid SLACK_WEBHOOK secret does not
        # itself count as a CI failure and obscure the real upstream failures.
        continue-on-error: true
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: 'CI/CD Pipeline Failed'

      - name: Summarise failed jobs (fallback when Slack is unconfigured)
        if: always()
        run: |
          echo "::warning::One or more CI jobs failed. Configure SLACK_WEBHOOK in repo secrets for Slack alerts."
          echo "Failed needs: backend-test, rider-app-test, driver-app-test, admin-test, or python-dependency-audit"
