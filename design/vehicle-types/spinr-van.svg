    <g><path d="M 338 250 q -22 -2 -30 12 q -2 8 8 9 l 22 -3 Z" fill="#EE2B2B" stroke="#C81E26" stroke-width="1.5"/><path d="M 312 264 l 8 7" stroke="#A3161D" stroke-width="3" stroke-linecap="round"/></g>
    <!-- front light -->
    <rect x="82" y="300" width="36" height="20" rx="5" fill="#EAF6FF"/>
    <!-- rear light -->
    <path d="M 916 300 L 884 300 L 884 364 L 912 366 C 920 360, 920 306, 916 300 Z" fill="#EE2B2B"/>
