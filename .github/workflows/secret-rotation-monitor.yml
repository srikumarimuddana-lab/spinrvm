name: Secret rotation monitor

# Monthly check over docs/runbooks/secret-rotation.md's rotation tracker.
# Flags credentials whose age exceeds their recommended cadence. Reads
# only dates/cadence metadata from the doc — never touches, logs, or
# requires any actual secret value.
#
# Pattern mirrors subprocessor-monitor.yml / renewal-calendar-monitor.yml:
# scheduled, idempotent single tracked issue, no external service required.

on:
  schedule:
    # Monthly, 1st at 14:00 UTC.
    - cron: "0 14 1 * *"
  workflow_dispatch:
    inputs:
      force_open_issue:
        description: "Open/update the tracked issue even if nothing is overdue (manual override, for testing)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  issues: write
  contents: read

env:
  ROTATION_FILE: "docs/runbooks/secret-rotation.md"
  ISSUE_LABEL: "secret-rotation-monitor"

jobs:
  check-and-notify:
    name: Secret rotation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse rotation tracker table
        id: parse
        run: |
          python3 <<'PYEOF'
          import os, datetime

          rotation_file = os.environ["ROTATION_FILE"]
          today = datetime.date.today()

          with open(rotation_file) as f:
              lines = f.readlines()

          in_table = False
          header_seen = False
          overdue = []
          tbd = []

          for line in lines:
              if line.strip() == "## Rotation tracker":
                  in_table = True
                  continue
              if in_table and line.startswith("## "):
                  break
              if not in_table or not line.strip().startswith("|"):
                  continue
              cells = [c.strip() for c in line.strip().strip("|").split("|")]
              if len(cells) < 4:
                  continue
              if cells[0] == "Credential":
                  header_seen = True
                  continue
              if not header_seen or set(cells[0]) <= {"-", " "}:
                  continue

              credential, location, last_rotated, cadence = cells[0], cells[1], cells[2], cells[3]

              if last_rotated in ("TBD", "N/A", "") or cadence.startswith("Not security-sensitive") or cadence == "—":
                  if last_rotated == "TBD":
                      tbd.append(f"{credential} ({location})")
                  continue

              parsed = None
              for fmt in ("%Y-%m-%d", "%B %d, %Y", "%b %d, %Y"):
                  try:
                      parsed = datetime.datetime.strptime(last_rotated, fmt).date()
                      break
                  except ValueError:
                      continue
              if parsed is None:
                  tbd.append(f"{credential} ({location}) — unparseable last-rotated date '{last_rotated}'")
                  continue

              cadence_days = None
              for tok in cadence.split():
                  if tok.isdigit():
                      cadence_days = int(tok)
                      break
              if cadence_days is None:
                  continue

              age_days = (today - parsed).days
              if age_days > cadence_days:
                  overdue.append((credential, location, parsed, age_days, cadence_days))

          def fmt_rows(rows):
              return "\n".join(
                  f"- **{c}** ({loc}): last rotated {d.isoformat()} — {age}d ago, exceeds the {cad}d recommended cadence"
                  for c, loc, d, age, cad in rows
              )

          findings = []
          if overdue:
              findings.append("### 🔴 Overdue for rotation\n" + fmt_rows(overdue))
          if tbd:
              findings.append("### ⚪ Not yet tracked (TBD/unparseable — audit gap, not a confirmed problem)\n" + "\n".join(f"- {t}" for t in tbd))

          summary = "\n\n".join(findings) if findings else "No tracked credentials are overdue for rotation."
          any_alert = "true" if overdue else "false"

          gh_output = os.environ["GITHUB_OUTPUT"]
          with open(gh_output, "a") as f:
              f.write("findings<<EOF\n")
              f.write(summary + "\n")
              f.write("EOF\n")
              f.write(f"any_alert={any_alert}\n")
          PYEOF

      - name: Check for existing open tracked issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "${ISSUE_LABEL}" \
            --json number \
            --jq '.[0].number // empty')
          echo "existing=${existing}" >> "$GITHUB_OUTPUT"

      - name: Open or update tracked issue
        if: steps.parse.outputs.any_alert == 'true' || github.event.inputs.force_open_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          # Secret rotation — overdue credentials

          Automated monthly check (\`.github/workflows/secret-rotation-monitor.yml\`)
          over \`docs/runbooks/secret-rotation.md\`. This issue never contains an
          actual credential value — only names, locations, and dates.

          ${{ steps.parse.outputs.findings }}

          ## Next step
          Rotate the flagged credential per its documented procedure in
          \`docs/runbooks/secret-rotation.md\`, then update its \`Last rotated\`
          date in that file. High-blast-radius credentials (JWT_SECRET,
          SUPABASE_SERVICE_ROLE_KEY) need a coordinated rollout, not an ad hoc
          swap — see the doc's per-row notes.

          ---
          *Auto-generated by \`.github/workflows/secret-rotation-monitor.yml\`.*
          EOF
          )

          existing="${{ steps.existing.outputs.existing }}"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${{ github.repository }}" --body "$body" --title "Secret rotation overdue ($(date -u +%Y-%m-%d))"
            echo "Updated existing issue #${existing}"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Secret rotation overdue ($(date -u +%Y-%m-%d))" \
              --body "$body" \
              --label "${ISSUE_LABEL}"
          fi

      - name: No-op summary
        if: steps.parse.outputs.any_alert != 'true' && github.event.inputs.force_open_issue != 'true'
        run: |
          echo "✅ No credentials overdue for rotation."
          echo "${{ steps.parse.outputs.findings }}"
