# Fly.io backend — STAGING (Toronto/yyz). Scaffolding for ACTION_ITEMS.md E1.
#
# THIS FILE IS INERT UNTIL A HUMAN WITH REAL FLY.IO ACCESS RUNS:
#   fly apps create spinr-backend-staging --org <your-org>
# No such app exists yet. `flyctl deploy --config backend/fly.staging.toml`
# will fail with "app not found" until that command has been run. This file
# does not provision anything by itself — it only describes what the app
# should look like once a human creates it.
#
# Modeled on backend/fly.toml (production, app "spinr-backend-yyz"), but:
#   - distinct placeholder app name (spinr-backend-staging) so it can NEVER
#     collide with or be deployed over the production app by accident.
#   - scaled down hard: 1 machine, auto-stop instead of auto-suspend, and
#     min_machines_running = 0 (fully scale-to-zero when idle) — staging
#     traffic is bursty/manual (E2 load tests, E4 synthetic checks, manual
#     QA), not the 24/7 rider/driver load production serves.
#   - ENV=staging so backend code paths that branch on environment (e.g.
#     OTP dev-bypass "1234" per CLAUDE.md, weak-secret startup checks) know
#     this is not production.
#   - SUPABASE_REGION stays ca-central-1: per CLAUDE.md's PIPEDA data
#     residency rule, the staging Supabase project (also not created yet —
#     see docs/runbooks/staging-environment.md) must be provisioned in a
#     Canadian region same as production, no exception for a throwaway
#     project.
#
# Secrets (SUPABASE_*, JWT_SECRET, ADMIN_PASSWORD, FIREBASE_*, REDIS_URL,
# RATE_LIMIT_REDIS_URL, WS_REDIS_URL, ALLOWED_ORIGINS, SENTRY_DSN) are NOT
# set here, same convention as production fly.toml. They must be STAGING
# values only (a throwaway Supabase project + its own JWT_SECRET, etc.) —
# never copy production secrets into this app. See
# docs/runbooks/staging-environment.md for the one-time setup a human runs.
app = "spinr-backend-staging"
primary_region = "yyz"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "staging"
  PORT = "8000"
  SUPABASE_REGION = "ca-central-1"
  UVICORN_WORKERS = "1"
  PYTHONUNBUFFERED = "1"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[http_service]
  internal_port = 8000
  force_https = true
  # Staging is allowed to fully scale to zero between uses — unlike
  # production's "suspend, never fully stop" burst-capacity design
  # (docs/runbooks/capacity-scaling.md), there is no always-on SLA here.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
