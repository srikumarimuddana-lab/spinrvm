# Grafana Alerting provisioning file (file-based provisioning format:
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/).
#
# Implements the first 2 of ADR-010 §3's alert rules, per §5 step 5 and
# issue #3295's implementation plan step 6:
#   1. Dispatch latency breach (P1)
#   2. Payment failure rate breach (P1)
#
# Rule 3 (insurance-period write failure) was added later, per ACTION_ITEMS.md
# C55 -- it is not part of ADR-010 §3's original scope. It closes the gap
# docs/runbooks/deploy-migration-64-65.md's "Alert immediately if non-zero"
# contract for spinr_insurance_period_write_failed_total described but this
# file never implemented (see docs/audit/2026-09-02-t2-dispatch-reviewer-retro.md
# §3). A dropped write is now also self-healed on its next tick by
# backend/utils/insurance_period_reconciler.py (WS-12 §3), so this alert's
# job is surfacing the underlying write failure for investigation, not
# covering an unrecoverable audit gap.
#
# NOT YET LOADED into any Grafana Cloud instance via file provisioning -- the
# rules were instead entered by hand through the Alerting UI (issue #3295
# step 6), since this repo's agent integration has no Grafana Cloud API
# token/Actions-dispatch access to provision against a live stack. This file
# stays the source of truth for the PromQL/thresholds/labels; keep it in
# sync if a rule is edited in the UI.
#
# Contact point: Email, not the webhook originally sketched here. Decided
# 2026-09-06 (issue #3295 walkthrough) -- Grafana Cloud's built-in Email
# integration only sends to addresses that are members of the Grafana Cloud
# org, which was reachable end-to-end in this session (see the org's
# Members / Administration > Users and access > Users pages), whereas
# standing up a distinct Slack workspace+webhook for this alone was judged
# more setup for the same outcome. `loop_watchdog` (backend/core/lifespan.py)
# keeps its own separate `ALERT_WEBHOOK_URL`/`ALERT_EMAIL_TO` config
# (backend/core/config.py) -- this file's contact point is Grafana
# Alerting's own, independent of that backend config.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: spinr-alert-email
    receivers:
      - uid: spinr-alert-email-1
        type: email
        settings:
          addresses: "<ALERT_EMAIL_TO>" # semicolon-separated if more than one; see backend/core/config.py's ALERT_EMAIL_TO comment on preferring a distribution list -- but see this file's header note above: Grafana Cloud's Email integration requires each address to be an accepted member of the Grafana Cloud org, so a shared inbox works only once someone with access to it accepts the org invite under that address.
          singleEmail: false

policies:
  - orgId: 1
    receiver: spinr-alert-email
    group_by: ["alertname"]
    routes: []

groups:
  - orgId: 1
    name: spinr-dispatch-and-payments
    folder: Spinr Production
    interval: 1m
    rules:
      - uid: spinr-dispatch-latency-p95-breach
        title: "Dispatch latency P95 breach (>2s, 5m)"
        condition: C
        for: 5m
        labels:
          severity: P1
          domain: dispatch
        annotations:
          summary: "Dispatch offer->accept P95 (fly) exceeded the 2s SLA for 5+ minutes"
          description: >-
            CLAUDE.md SLA: dispatch offer -> driver phone notification P95 < 2s,
            failure impact "ride abandonment". ADR-010 §3.
          runbook_url: "docs/runbooks/driver-not-receiving-rides.md"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "<GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID>"
            model:
              expr: >-
                histogram_quantile(0.95,
                  sum(rate(spinr_dispatch_offer_to_accept_duration_ms_bucket{provider="fly"}[5m])) by (le)
                )
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2000]
              refId: C

      - uid: spinr-payment-failure-rate-breach
        title: "Payment failure rate breach (>1%, 10m, >=20 samples)"
        condition: C
        for: 10m
        labels:
          severity: P1
          domain: payments
        annotations:
          summary: "Payment settlement failure rate (fly) exceeded 1% for 10+ minutes"
          description: >-
            CLAUDE.md KPI: payment success rate >= 99%. ADR-010 §3. Requires
            >=20 settlement samples in-window. Lower-volume windows evaluate
            to NoData rather than a payment-rate breach; monitor telemetry
            availability separately so a missing scrape is not mistaken for
            healthy payment data.
          runbook_url: "docs/runbooks/on-call.md"
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "<GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID>"
            model:
              expr: >-
                (sum(increase(spinr_payment_settlement_total{outcome="failed",provider="fly"}[10m]))
                /
                sum(increase(spinr_payment_settlement_total{provider="fly"}[10m])))
                and on()
                (sum(increase(spinr_payment_settlement_total{provider="fly"}[10m])) >= 20)
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.01]
              refId: C

      - uid: spinr-insurance-period-write-failed
        title: "Insurance-period write failure (write-failed metric non-zero)"
        condition: C
        for: 0m
        labels:
          severity: P1
          domain: safety
        annotations:
          summary: "spinr_insurance_period_write_failed_total incremented -- a driver insurance-period transition write failed"
          description: >-
            docs/runbooks/deploy-migration-64-65.md: "Alert immediately if
            non-zero." record_period_transition (backend/utils/insurance_periods.py)
            swallows DB/RPC failures by design so dispatch is never blocked on
            a compliance-grade audit write, but a miss here is a regulatory/SGI
            audit gap until backend/utils/insurance_period_reconciler.py's
            next 10-minute tick self-heals it (ACTION_ITEMS.md C55). This
            alert exists to surface the underlying write failure for
            investigation, not to cover an unrecoverable gap.
          runbook_url: "docs/runbooks/deploy-migration-64-65.md"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "<GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID>"
            model:
              expr: >-
                sum(increase(spinr_insurance_period_write_failed_total[5m]))
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

      # Rules 4-6 added 2026-09-23 (docs/change-log/2026-09-23-orphaned-hold-and-detection-loop.md).
      # The counters are incremented ONLY by the replica that wins
      # utils/stripe_reconcile.py's daily (02:00 UTC) leader lock, but every
      # worker pre-registers every series at 0 on import, so increase() sees
      # the first real increment (a series born already holding N would be
      # invisible to increase()). NoData therefore means the scrape pipeline
      # is broken, not "clean" -- it is surfaced as NoData, same as rule 2.
      # Reconciler liveness itself is loop_watchdog's job ("stripe_reconcile
      # (24h)" heartbeat). These rules fire on the FIRST non-zero daily tick
      # instead of waiting for a second one. A daily detect-only scan's single
      # positive is not a noisy sample: 1h grace windows already exclude
      # in-flight races, and waiting a tick would hold back a "rider is owed
      # money" alert for 24h. The 26h window keeps the alert firing until the
      # next tick has reported.
      - uid: spinr-payment-cancelled-captured-unrefunded
        title: "Cancelled ride with captured, unrefunded hold (daily reconcile)"
        condition: C
        for: 0m
        labels:
          severity: P1
          domain: payments
        annotations:
          summary: "Daily reconcile found cancelled rides whose captured hold was never refunded (or whose state could not be verified)"
          description: >-
            spinr_payment_cancelled_captured_unrefunded_total{outcome=...}
            incremented by utils/stripe_reconcile._detect_cancelled_captured
            (read-only; never refunds). Ride ids are in the
            CANCELLED_CAPTURED_UNREFUNDED Sentry events (domain:payments) and the
            stripe_reconciliation audit_logs row. Remediate by hand with
            backend/scripts/reconcile_cancelled_captured_refunds.py (dry run
            first, then --apply --ride-id <id>).
          runbook_url: "docs/change-log/2026-09-23-orphaned-hold-and-detection-loop.md"
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: "<GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID>"
            model:
              expr: >-
                sum(increase(spinr_payment_cancelled_captured_unrefunded_total[26h]))
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

      - uid: spinr-payment-stripe-orphan-hold
        title: "Uncaptured Stripe hold with no ride row (daily reconcile)"
        condition: C
        for: 0m
        labels:
          severity: P1
          domain: payments
        annotations:
          summary: "Daily reconcile found requires_capture PaymentIntents that no ride references -- rider funds held with no ride"
          description: >-
            spinr_payment_stripe_orphan_hold_total incremented by
            utils/stripe_reconcile._reconcile_orphan_holds (8-day lookback,
            detection only). PI ids are in the STRIPE_ORPHAN_HOLD Sentry events
            (domain:payments) and the stripe_reconciliation audit_logs row.
            Confirm no ride references the PI, then cancel the authorization
            in Stripe to release the hold (Stripe auto-expires it after 7 days
            otherwise).
          runbook_url: "docs/change-log/2026-09-23-orphaned-hold-and-detection-loop.md"
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: "<GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID>"
            model:
              expr: >-
                sum(increase(spinr_payment_stripe_orphan_hold_total[26h]))
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

      - uid: spinr-payment-reconcile-check-failed
        title: "Daily payment reconcile check could not complete"
        condition: C
        for: 0m
        labels:
          severity: P2
          domain: payments
        annotations:
          summary: "An orphan-hold or cancelled-captured reconcile check failed (Stripe/DB error) or hit its row ceiling -- rules 4-5 are blind until it passes"
          description: >-
            spinr_payment_reconcile_check_failed_total{check=orphan_hold|cancelled_captured}.
            Without this, a check failing every day is indistinguishable from
            a clean one. See the domain:payments Sentry error logged in the
            same tick for the cause.
          runbook_url: "docs/change-log/2026-09-23-orphaned-hold-and-detection-loop.md"
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: "<GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID>"
            model:
              expr: >-
                sum(increase(spinr_payment_reconcile_check_failed_total[26h]))
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
