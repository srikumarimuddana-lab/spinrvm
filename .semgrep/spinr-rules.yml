# Spinr-specific Semgrep rules. See docs/ci-security-gates.md for context.
#
# These rules catch patterns unique to this codebase that generic rulesets miss.
# They are executed by .github/workflows/security-gates.yml on every PR.

rules:
  # SR-01: MongoDB-style $set wrapper on Supabase update (DV-2)
  - id: spinr-supabase-no-mongo-wrappers
    patterns:
      - pattern-either:
          - pattern: '$DB.update($TABLE, {"$set": ...}, ...)'
          - pattern: '$DB.update($TABLE, {"$set": ...})'
          - pattern: 'supabase.table($TABLE).update({"$set": ...})'
    message: |
      Supabase is not MongoDB. Do not wrap update payloads in {"$set": ...}.
      The key is treated as a column name and the update silently writes nothing.
      See DV-2 in reports/remediation/driver-new-issues-2026-04-23.md.
    severity: ERROR
    languages: [python]

  # SR-02: Swallowed DB / auth / payment errors (CLAUDE.md rule)
  - id: spinr-no-warning-on-critical-errors
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except DatabaseError:
                  logger.warning(...)
                  ...
          - pattern: |
              try:
                  ...
              except $AUTHERR:
                  logger.warning(...)
                  ...
      - metavariable-regex:
          metavariable: $AUTHERR
          regex: ".*(Auth|Payment|Stripe|Webhook).*Error"
    message: |
      DB / auth / payment errors must surface loudly. Use logger.error with the
      full exception (for DatabaseError, include e.details['original']).
      See CLAUDE.md "Do not silently swallow errors".
    severity: ERROR
    languages: [python]

  # SR-03: Float arithmetic in money-handling code
  - id: spinr-no-float-in-money
    patterns:
      - pattern-either:
          - pattern: float($X)
          - pattern: $AMOUNT * 1.0
          - pattern: $AMOUNT / 1.0
      # A bare `float($X)` exclusion list, because this rule cited CLAUDE.md's
      # money convention while flagging the very helpers that convention MANDATES:
      # "Helpers _d(), _round(), _f() must be used before any DB write or API
      # response." fare_service._f() is literally `return float(v)` and _fd() is
      # `return float(_round(_d(v)))`, so the rule fired on the prescribed pattern
      # and blocking on it would have forced removing it. The risk CLAUDE.md
      # describes is float *arithmetic*, not the Decimal->float conversion at the
      # response boundary.
      - pattern-not-inside: |
          def _f(...):
              ...
      - pattern-not-inside: |
          def _fd(...):
              ...
      # float() wrapping an already-Decimal-rounded value IS the response
      # boundary. Anything that rounds first has not done float arithmetic.
      - pattern-not: float(_round(...))
      - pattern-not: float(_d(...))
      - pattern-not: float($X.quantize(...))
      - pattern-not: float(Decimal(...).quantize(...))
    paths:
      # Every path here exists and reports zero findings — verified by actually
      # running semgrep (2026-08-14; receipt_pdf.py/email_receipt.py added and
      # re-verified 2026-08-22, see below), which is why this rule is now
      # merge-blocking (see the "Money-safety gate" step in security-gates.yml).
      #
      # Worth recording how that went, because the lesson is the point: an
      # earlier pass declared this same list clean on a careful file-by-file
      # read. The tool then found three findings in services/fare_service.py
      # that the read had missed. A code review is not a substitute for running
      # the rule — re-run it before adding a path here.
      #
      # Two entries were also previously dead: "fare_split.py" has no Python
      # module anywhere (the feature is a Postgres RPC), and the corporate
      # wallet service is named corporate_wallet_service.py — so the allowlist
      # silently covered four files while reading as if it covered six.
      #
      # 2026-08-22 (ACTION_ITEMS.md A40 #26/N14 follow-up): added
      # receipt_pdf.py/email_receipt.py — both render money (7-year-retained
      # legal records) but were never in this list. Ran semgrep before adding:
      # receipt_pdf.py had zero float() calls, clean immediately.
      # email_receipt.py had 2 findings, both `round(float(coverage) * 100)` —
      # coverage_ratio is a GPS route-quality percentage, not a money value,
      # the same false-positive class already documented below for
      # drivers/_shared.py's GPS coordinates. Annotated both with an inline
      # `# nosemgrep: spinr-no-float-in-money` + reason per this rule's own
      # message, rather than leaving them to fail the newly-blocking gate.
      #
      # 2026-09-25 (ROADMAP N19, MONEY-005/-006/-008): added
      # routes/drivers/earnings.py, features.py and utils/referral_payout.py.
      # Ran semgrep before adding: 20 findings (earnings.py 7, features.py 13,
      # referral_payout.py 0). Every Decimal->float response-boundary
      # conversion was switched from float() to fare_service._f() (identical
      # value, it IS float(), but the CLAUDE.md-named helper, so no rounding
      # change). Six non-money or no-arithmetic reads in features.py (GPS
      # lat/lng, three tax-rate percentages, the configured airport_fee, the
      # area-fee echo in /area-config) carry `# nosemgrep:
      # spinr-no-float-in-money` with a reason. Result: 0 findings. This rule
      # still does not see raw float `sum()`/`+=`/`round()` over DB values
      # (the MONEY-001/-006 shapes, fixed by hand in the same change); see
      # docs/change-log/2026-09-25-float-money-writes.md.
      include:
        - "backend/routes/fares.py"
        - "backend/routes/payments.py"
        - "backend/routes/wallet.py"
        - "backend/routes/rides/payments.py"
        - "backend/services/fare_service.py"
        - "backend/services/payment_service.py"
        - "backend/services/corporate_wallet_service.py"
        - "backend/services/corporate_allowance_service.py"
        - "backend/services/corporate_subscription_service.py"
        - "backend/utils/stripe_charge.py"
        - "backend/utils/receipt_pdf.py"
        - "backend/utils/email_receipt.py"
        - "backend/routes/drivers/earnings.py"
        - "backend/features.py"
        - "backend/utils/referral_payout.py"
      # Deliberately NOT covered, with reasons — so the next person does not
      # "helpfully" add them and turn the gate red:
      #
      #   (backend/routes/drivers/earnings.py was listed here until 2026-09-25.
      #   Its boundary float() calls now go through fare_service._f(), which is
      #   the same float(), so no payout figure's rounding changed.)
      #
      #   backend/routes/drivers/_shared.py
      #     Its float() calls are GPS coordinates, not money. Adding it would
      #     generate pure noise and train people to ignore this rule.
      #
      #   backend/utils/payment_retry.py
      #     Its one float() parses a unix timestamp, not an amount.
    message: |
      Money arithmetic must use Decimal. Use _d(), _round(), _f() helpers.
      See CLAUDE.md "Money arithmetic" rule.
    severity: ERROR
    languages: [python]

  # SR-12: Bare dict/subscript arithmetic in money-handling code (#5817)
  #
  # SR-03 above only catches float(...) casts and *1.0/1.0 literals. It does
  # NOT catch the actual shape both 2026-09-25 float-money bugs took:
  # `round(subtotal + fees_result["fees_total"] + ...)` and
  # `tips += r["tip_amount"]` — arithmetic between two already-numeric values
  # pulled straight from a dict/DB row, with no literal float and no float()
  # cast anywhere in the diff. docs/change-log/2026-09-25-receipts-float-fallback.md
  # confirmed SR-03 finds 0 matches on both the old (buggy) and new (fixed)
  # code for exactly this reason.
  #
  # This rule flags: round(a + b), dict[k] +/- x, dict.get(k)/dict.get(k, default)
  # +/- x (either operand), and x += dict[k]/dict.get(k)/dict.get(k, default) —
  # the accumulator-loop shape. The two-arg .get(k, default) variants were
  # added after spinr-money-auditor review found the single-arg-only patterns
  # missed them, and two-arg .get() (avoids KeyError) is likely the more common
  # real-world form for a money field than the bare single-arg one.
  # Verified 2026-09-26 against every file below plus
  # backend/routes/rides/receipts.py and backend/routes/rides/_shared.py
  # (proposed additions to SR-03's own include list, per #5817 — not added
  # there yet: SR-03 itself has 19 pre-existing, untriaged float() findings in
  # _shared.py that need the same fix-or-annotate pass earnings.py/features.py
  # got on 2026-09-25 before that list can safely take them; tracked as a
  # separate follow-up, not rushed into this same change). **_shared.py and
  # receipts.py have SR-12 coverage only, not SR-03 coverage, until that
  # follow-up lands** — do not read "0 SR-12 findings here" as "this file is
  # fully money-safe." Result: 0 findings anywhere in this list. Reconstructed
  # both original bug shapes in isolation and confirmed this rule catches both.
  #
  # Known limitations (accepted, not fixed — same ceiling every AST-pattern
  # rule has): does not cover `*`/`/` on dict values, only `+`/`-`/`+=`/round();
  # trivially bypassed by extracting the dict access to an intermediate
  # variable first (`v = d["x"]; total += v`) since that's then plain-variable
  # arithmetic indistinguishable from correct Decimal code by syntax alone.
  - id: spinr-bare-dict-arithmetic-in-money-file
    patterns:
      - pattern-either:
          - pattern: round($A + $B)
          - pattern: round($A + $B, ...)
          - pattern: $DICT[$K] + $Y
          - pattern: $X + $DICT[$K]
          - pattern: $DICT[$K] - $Y
          - pattern: $X - $DICT[$K]
          - pattern: $DICT.get($K) + $Y
          - pattern: $X + $DICT.get($K)
          - pattern: $DICT.get($K) - $Y
          - pattern: $X - $DICT.get($K)
          - pattern: $X += $DICT[$K]
          - pattern: $X += $DICT.get($K)
          # Two-arg .get(key, default) is the more common real-world form
          # (avoids KeyError) and was missed by the single-arg patterns above
          # (found by spinr-money-auditor review before this rule was
          # committed — verified `fees_result.get("fees_total", 0) + subtotal`
          # produced 0 findings without these).
          - pattern: $DICT.get($K, $DEFAULT) + $Y
          - pattern: $X + $DICT.get($K, $DEFAULT)
          - pattern: $DICT.get($K, $DEFAULT) - $Y
          - pattern: $X - $DICT.get($K, $DEFAULT)
          - pattern: $X += $DICT.get($K, $DEFAULT)
      # Same false-positive guard as SR-03: don't flag the helpers themselves.
      - pattern-not-inside: |
          def _f(...):
              ...
      - pattern-not-inside: |
          def _fd(...):
              ...
      - pattern-not-inside: |
          def _d(...):
              ...
      - pattern-not-inside: |
          def _round(...):
              ...
    paths:
      include:
        - "backend/routes/fares.py"
        - "backend/routes/payments.py"
        - "backend/routes/wallet.py"
        - "backend/routes/rides/payments.py"
        - "backend/routes/rides/receipts.py"
        - "backend/routes/rides/_shared.py"
        - "backend/services/fare_service.py"
        - "backend/services/payment_service.py"
        - "backend/services/corporate_wallet_service.py"
        - "backend/services/corporate_allowance_service.py"
        - "backend/services/corporate_subscription_service.py"
        - "backend/utils/stripe_charge.py"
        - "backend/utils/receipt_pdf.py"
        - "backend/utils/email_receipt.py"
        - "backend/routes/drivers/earnings.py"
        - "backend/features.py"
        - "backend/utils/referral_payout.py"
    message: |
      Arithmetic directly on a dict/subscript value in money-handling code.
      Wrap operands in _d() before doing arithmetic, and _f()/_round() at the
      response/DB-write boundary. See CLAUDE.md "Money arithmetic" rule and
      #5817.
    severity: ERROR
    languages: [python]

  # SR-04: Direct ride-state update bypasses state-machine guard
  - id: spinr-ride-state-needs-guard
    patterns:
      - pattern-either:
          - pattern: '$DB.update("rides", {"status": "$STATE", ...}, ...)'
          - pattern: 'supabase.table("rides").update({"status": "$STATE", ...})'
    paths:
      exclude:
        - "backend/routes/rides.py"
        - "backend/tests/"
    message: |
      Ride state changes must go through _require_ride_in_state() in
      routes/rides.py. Direct updates bypass the guard and can create
      invalid transitions (e.g. COMPLETED from SEARCHING).
    severity: WARNING
    languages: [python]

  # SR-05: Collision-prone Stripe idempotency key (DV-4)
  - id: spinr-stripe-idempotency-static
    patterns:
      - pattern-regex: |
          idempotency_key\s*=\s*f?"intent-\{[^}]+\}-\{[^}]+\}"
    message: |
      Static idempotency key "intent-{user}-{amount}" collides on legitimate
      same-amount retries and returns the wrong PaymentIntent. Use a UUID v4
      provided by the client per request.
      See DV-4 in reports/remediation/driver-new-issues-2026-04-23.md.
    severity: ERROR
    languages: [python]

  # SR-06: OTP verify without lockout check
  - id: spinr-otp-requires-lockout-check
    patterns:
      - pattern: await verify_otp($PHONE, $CODE)
      - pattern-not-inside: |
          if await otp_lockout_active($PHONE): ...
          ...
      - pattern-not-inside: |
          if await is_locked_out($PHONE): ...
          ...
    message: |
      OTP verify must be gated by otp_lockout_active() / is_locked_out() check.
      Without it, brute-force protection is bypassed.
    severity: WARNING
    languages: [python]

  # SR-07: New background loop should use atomic claim / idempotency
  - id: spinr-background-loop-needs-idempotency
    patterns:
      - pattern: |
          while True:
              ...
              await $ACTION(...)
    paths:
      include:
        - "backend/core/lifespan.py"
    message: |
      New background loops run on every replica concurrently. Verify the
      action uses an atomic DB claim, idempotency key, or reminder_sent
      flag. See CLAUDE.md "Background task safety".
    severity: INFO
    languages: [python]

  # SR-08: JWT role trusted for non-admin (CLAUDE.md rule)
  - id: spinr-jwt-role-must-reread
    patterns:
      # $TOKEN was unconstrained, which made this rule fire on ANY `.get("role")`
      # — including `user.get("role")` on a users-table row, which is the exact
      # pattern CLAUDE.md *prescribes*. That produced 62 findings on its first
      # real run (the ruleset had never parsed; see the header of this file), all
      # of them false positives: 31 on `admin`, 18 on DB rows
      # (user/current_user/updated_user/me/u/actor/reporter), 10 on unrelated
      # objects (m/s/incident), and 3 on `payload` inside admin-audience checks.
      #
      # Constrain to token-shaped receivers so the rule expresses its actual
      # intent: reading the role claim off a decoded token rather than re-reading
      # it from the database.
      - pattern: $TOKEN.get("role")
      - metavariable-regex:
          metavariable: $TOKEN
          regex: ^(payload|claims|jwt|jwt_payload|token|token_payload|decoded|decoded_token)$
      # Admin JWTs are fully trusted by design — role, email and modules live in
      # the claims (CLAUDE.md "JWT trust model"), so reading them from an admin
      # token is correct, not a violation. Exclude scopes that have already
      # established the token is an admin one.
      - pattern-not-inside: |
          def $F(...):
              ...
              JWT_AUD_ADMIN
              ...
      - pattern-not-inside: |
          def $F(...):
              ...
              _admin_roles
              ...
      - pattern-not-inside: |
          def _verify_admin_token(...):
              ...
      - pattern-not-inside: |
          if $X.get("is_admin"):
              ...
    message: |
      Rider / driver role must always be re-read from the users table on
      every request. Never trust the JWT role claim for non-admin tokens.
      Admin JWTs are the only fully-trusted tokens.
      See CLAUDE.md "JWT trust model".
    severity: WARNING
    languages: [python]

  # SR-09: Stripe webhook without idempotency claim
  - id: spinr-stripe-webhook-needs-idempotency
    patterns:
      - pattern: |
          @$APP.$METHOD("/stripe/webhook", ...)
          async def $F(...):
              ...
      - pattern-not-inside: |
          @$APP.$METHOD(...)
          async def $F(...):
              ...
              await claim_stripe_event($EVENT_ID)
              ...
    message: |
      Stripe webhook handlers must call claim_stripe_event(event_id) in
      stripe_events table before processing. Silently skip if already
      claimed. See CLAUDE.md "Stripe idempotency".
    severity: WARNING
    languages: [python]

  # SR-11: Unwrapped builtin sum() over money values (MONEY-001/005 follow-up)
  #
  # SR-03 above only matches float(...) — it cannot see a raw sum() over
  # unwrapped DB values, which is exactly how the pre-#5792 tip-total drift
  # (MONEY-001) and the driver_daily_stats aggregation reads it, i.e.
  # sum(r.get("tip_amount", 0) or 0 for r in rows), got past it. See
  # docs/change-log/2026-09-25-float-money-writes.md §10 "Not fixed, found
  # while checking" item 3, which named this gap explicitly.
  #
  # Design: flag sum($GEN) / sum($GEN, $START) only when the summed
  # expression $GEN both (a) mentions a money-shaped field name (fare,
  # amount, tip, fee, total, ...) and (b) is not already wrapped in a
  # Decimal-producing call. (a) keeps this from firing on legitimate
  # non-money sums in the same files, e.g. earnings.py's
  # total_distance_km/total_duration_minutes sum()s, which mention neither.
  # (b) allows the two forms every current usage in these files already
  # uses: sum(_d(x) for x in rows) and sum(gen, Decimal("0")) (also
  # Decimal(str(x)), _fare_d(), _f(), and the two local Decimal-returning
  # helpers earnings.py calls sum() over, _ride_income()/_ride_tax()).
  #
  # Both conditions are expressed as metavariable-pattern blocks on $GEN
  # rather than sibling pattern-regex/pattern-not-regex entries: combining a
  # bare pattern-regex with an AST pattern in the same `patterns:` list
  # rewrites the match to the regex's own (narrower, possibly duplicated)
  # sub-range, so a pattern-not-regex sibling never sees the full $GEN text
  # and cannot exclude anything — confirmed by hand against every real sum()
  # call in the paths below (0 findings via metavariable-pattern; the sibling
  # form produced false positives/duplicates before this fix).
  - id: spinr-no-bare-sum-in-money
    patterns:
      - pattern-either:
          - pattern: sum($GEN)
          - pattern: sum($GEN, $START)
      - metavariable-pattern:
          metavariable: $GEN
          patterns:
            - pattern-regex: '(?i)(fare|price|amount|earning|payout|tip|fee|total|bonus|wallet|balance|charge|subtotal|surge|toll|tax|commission|refund|credit|debit)'
      - metavariable-pattern:
          metavariable: $GEN
          patterns:
            - pattern-not-regex: '(_d\(|_fare_d\(|_f\(|Decimal\(|_ride_income\(|_ride_tax\()'
    paths:
      # Same file list as SR-03 above (spinr-no-float-in-money) — verified
      # 0 findings on every file here (2026-09-25); see the change-log entry
      # cited above for how each was checked.
      include:
        - "backend/routes/fares.py"
        - "backend/routes/payments.py"
        - "backend/routes/wallet.py"
        - "backend/routes/rides/payments.py"
        - "backend/services/fare_service.py"
        - "backend/services/payment_service.py"
        - "backend/services/corporate_wallet_service.py"
        - "backend/services/corporate_allowance_service.py"
        - "backend/services/corporate_subscription_service.py"
        - "backend/utils/stripe_charge.py"
        - "backend/utils/receipt_pdf.py"
        - "backend/utils/email_receipt.py"
        - "backend/routes/drivers/earnings.py"
        - "backend/features.py"
        - "backend/utils/referral_payout.py"
    message: |
      Raw sum() over a money-shaped value outside Decimal. sum() on plain
      DB floats accumulates binary-float drift the same way a `+=` loop
      does (e.g. ten $0.10 tips summing to 0.9999999999999999). Wrap each
      summed value in _d()/Decimal() — sum((_d(x) for x in rows),
      Decimal("0")) — and convert to float only at the response boundary
      with _f(). See CLAUDE.md "Money arithmetic" and MONEY-001.
    severity: ERROR
    languages: [python]

  # SR-10: Raw phone / address in log statement
  - id: spinr-pii-in-logs
    patterns:
      - pattern-either:
          - pattern: logger.$LEVEL($MSG, phone=$PHONE, ...)
          - pattern: logger.$LEVEL($MSG, address=$ADDR, ...)
          - pattern: logger.$LEVEL($MSG, email=$EMAIL, ...)
          - pattern: logger.$LEVEL(f"...{phone}...")
          - pattern: logger.$LEVEL(f"...{address}...")
          - pattern: print(f"...{phone}...")
    message: |
      Do not log raw PII. Use redactor: +1***XXXX for phone, j***@domain for
      email, redact addresses entirely.
      See docs/data-classification.md "Log Fields".
    severity: ERROR
    languages: [python]
