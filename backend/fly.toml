# Fly.io backend (Toronto/yyz). Deploys in parallel with Railway from main via
# .github/workflows/deploy-fly.yml. Failover/cutover is a Cloudflare CNAME swap —
# see docs/runbooks/railway-fly-failover.md and docs/adr/007-fly-primary-railway-standby.md.
#
# Secrets (SUPABASE_*, JWT_SECRET, ADMIN_PASSWORD, FIREBASE_*, REDIS_URL,
# RATE_LIMIT_REDIS_URL, WS_REDIS_URL, ALLOWED_ORIGINS) are NOT set here — they
# come from `fly secrets set` and must be byte-identical to Railway. The Redis
# URLs point at a stable DNS alias (e.g. redis.spinr.ca) so the backend can be
# repointed without a redeploy. Only non-secret config lives in [env] below.
#
# Two warm 4 GB Machines and six 2 GB burst Machines, eight total.
# See docs/runbooks/fly-mixed-fleet.md BEFORE the first mixed-group deploy.
# Proxy handles connection demand; the external controller handles memory/CPU.
# Scale-out only during observation: disable autostop so memory-driven starts
# are retained. No automatic scale-in until trip/WS draining is verified.
# Existing 750/1000 connection limits require load testing; they are not a
# supported-user count. Both groups run the same application on the same ports.
app = "spinr-backend-yyz"
primary_region = "yyz"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  PORT = "8000"
  SUPABASE_REGION = "ca-central-1"
  UVICORN_WORKERS = "2"
  PYTHONUNBUFFERED = "1"

[processes]
  app = 'sh -c "exec uvicorn server:app --host :: --port ${PORT:-8000} --workers ${UVICORN_WORKERS:-2}"'
  burst = 'sh -c "exec uvicorn server:app --host :: --port ${PORT:-8000} --workers ${UVICORN_WORKERS:-2}"'

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 750
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Same public service as app; only the idle policy and VM size differ.
[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["burst"]
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [services.concurrency]
    type = "connections"
    soft_limit = 750
    hard_limit = 1000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-2x"
  memory = "4gb"

[[vm]]
  processes = ["burst"]
  size = "shared-cpu-1x"
  memory = "2gb"
