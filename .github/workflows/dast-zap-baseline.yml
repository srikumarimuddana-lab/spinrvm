name: DAST · ZAP Baseline Scan

# ACTION_ITEMS.md E6 ("Pre-launch DAST + third-party pentest") — scaffolding
# half of that item. SAST (Semgrep/Bandit/ESLint-security/etc.) already runs
# in .github/workflows/security-gates.yml on every PR; this workflow is the
# complementary DAST leg — it exercises the *running* application instead of
# static source. It intentionally does NOT run on pull_request: a DAST scan
# needs a live target to hit. It remains manual/weekly rather than running on
# pull requests; this avoids turning ordinary PRs into unplanned network scans.
#
# Trigger is manual (workflow_dispatch) and a weekly schedule only.
#
# STAGING_URL and STAGING_ALLOWED_ORIGIN are required variables or secrets.
# Missing or invalid configuration fails before ZAP starts; it cannot silently
# report success without scanning.
#
# The third-party penetration test referenced in E6 is a separate
# budget/procurement action for a human to book — this workflow does not
# and cannot address that half of the item.
#
# See docs/runbooks/dast-and-pentest.md for what this scan covers, its
# limitations (baseline scan only — not a full active scan), and the
# pentest procurement note.

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Monday 03:00 UTC.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: dast-zap-baseline
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate target and generate exact-origin ZAP scope
        id: preflight
        # Values go through env rather than expression interpolation in shell.
        env:
          STAGING_URL: ${{ vars.STAGING_URL || secrets.STAGING_URL }}
          STAGING_ALLOWED_ORIGIN: ${{ vars.STAGING_ALLOWED_ORIGIN || secrets.STAGING_ALLOWED_ORIGIN }}
        run: |
          python3 scripts/validate_dast.py --write-scope-context staging.context
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.STAGING_URL || secrets.STAGING_URL }}
          # Baseline scan only (passive + spidering) — no active attack
          # payloads are sent. See docs/runbooks/dast-and-pentest.md for why
          # a full active scan is not automated here.
          # The imported context scopes spider requests to this exact HTTPS
          # origin before crawling (not merely a post-scan report check).
          cmd_options: '-a -n staging.context'
          allow_issue_writing: false
          # ZAP reports alerts as WARN by default; true makes WARN/FAIL findings
          # fail the check instead of becoming a successful artifact-only scan.
          fail_action: true
          artifact_name: zap-baseline-report

      - name: Retain raw ZAP reports even when scan findings fail the job
        if: always() && steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-baseline-raw-reports
          path: |
            report_json.json
            report_md.md
            report_html.html
          if-no-files-found: warn

      - name: Validate generated JSON report target
        if: always() && steps.preflight.outputs.ready == 'true'
        env:
          STAGING_URL: ${{ vars.STAGING_URL || secrets.STAGING_URL }}
          STAGING_ALLOWED_ORIGIN: ${{ vars.STAGING_ALLOWED_ORIGIN || secrets.STAGING_ALLOWED_ORIGIN }}
        run: python3 scripts/validate_dast.py report_json.json
