name: Deploy Backend to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'railway.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Authentication setup (one-time):
#   Railway v4 requires a project-scoped token (NOT an account/personal token).
#   Steps:
#     1. Railway Dashboard → your project → Settings → Tokens → New Token
#        Token type: must be "Project Token" (not Team or Personal)
#     2. GitHub → repo → Settings → Secrets → Actions → RAILWAY_TOKEN = <token>
#
# The --ci flag was removed in Railway CLI v4. Non-interactive mode is
# automatic when RAILWAY_TOKEN is set in the environment.
#
# Alternative (no tokens needed at all):
#   Connect Railway directly to this repo via:
#   Railway Dashboard → Service → Settings → Source → Connect Repo → main
#   Railway will auto-deploy on every push to main, making this workflow
#   file unnecessary for deployments.

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify RAILWAY_TOKEN is set
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::error title=Missing secret::RAILWAY_TOKEN is not set."
            echo ""
            echo "Railway Dashboard → project → Settings → Tokens → New Token"
            echo "Token type: Project Token (not Personal or Team)"
            echo "Then: GitHub → repo → Settings → Secrets → RAILWAY_TOKEN"
            exit 1
          fi
          echo "RAILWAY_TOKEN is set (length=${#RAILWAY_TOKEN})."
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Install Railway CLI v4
        run: npm i -g @railway/cli@4.40.2

      - name: Show Railway CLI version
        run: railway --version

      # Diagnostic: print the list of services in this project.
      # Service name is assumed to be "spinr-backend" based on the test-env
      # URL (spinr-backend-test.up.railway.app). If deploy fails with
      # "Service not found", check this output for the exact name.
      - name: List Railway services (diagnostic)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "===== railway status ====="
          railway status || true
          echo ""
          echo "===== railway status --json ====="
          railway status --json || true
          echo ""
          echo "===== railway service list ====="
          railway service list || true

      - name: Deploy to Railway
        run: railway up --service spinr-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Poll /health for up to 3 minutes (18 × 10 s). If the service never
      # becomes healthy, roll back to the previous deployment and fail the job.
      # Set BACKEND_HEALTH_URL to https://<your-service>.up.railway.app in
      # repo secrets (or leave unset to skip the probe in forks/staging).
      - name: Health check
        id: health
        env:
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "BACKEND_HEALTH_URL not set — skipping health check probe."
            exit 0
          fi
          echo "Polling ${HEALTH_URL}/health …"
          for i in $(seq 1 18); do
            STATUS=$(curl -sf --max-time 5 "${HEALTH_URL}/health" \
              -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
            echo "  attempt ${i}/18 → HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check timed out after 3 minutes."
          exit 1

      - name: Rollback on health check failure
        if: failure() && steps.health.outcome == 'failure'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "::warning::Health check failed — rolling back to previous deployment."
          railway rollback --service spinr-backend || true
