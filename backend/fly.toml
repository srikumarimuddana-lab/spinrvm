# Fly.io STABLE production backend (Toronto/yyz). Once the ADR-008 pipeline is
# live, this app is deployed by the gated promote workflow
# (.github/workflows/promote-production.yml) and sits behind the Cloudflare
# Load Balancer on api-spinr.spinr.ca (~95% weight; spinr-backend-canary takes
# the rest, Railway is the auto-failover pool). Until cutover it still deploys
# from main via .github/workflows/deploy-fly.yml. See
# docs/adr/008-staging-canary-production-pipeline.md and
# docs/runbooks/railway-fly-failover.md.
#
# Secrets (SUPABASE_*, JWT_SECRET, ADMIN_PASSWORD, FIREBASE_*, REDIS_URL,
# RATE_LIMIT_REDIS_URL, WS_REDIS_URL, ALLOWED_ORIGINS) are NOT set here — they
# come from `fly secrets set` and must be byte-identical to Railway. The Redis
# URLs point at a stable DNS alias (e.g. redis.spinr.ca) so the backend can be
# repointed without a redeploy. Only non-secret config lives in [env] below.
#
# UVICORN_WORKERS stays at 2: 4 workers on shared-cpu-1x/1gb is memory-tight, and
# worker count is a capacity knob only — the 16 background loops are replay-safe
# per process (atomic DB claims / idempotency keys / Redis leader locks).
app = "spinr-backend-yyz"
primary_region = "yyz"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  PORT = "8000"
  SUPABASE_REGION = "ca-central-1"
  UVICORN_WORKERS = "2"
  PYTHONUNBUFFERED = "1"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
