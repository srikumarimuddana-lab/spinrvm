name: Security Gates

# Gates G1–G7 from docs/ci-security-gates.md (SAST, Semgrep, dep audit, secrets,
# container scan, license check).
#
# Status as of 2026-08-02 (CI gate health audit, docs/ci/gate-health-2026-08.md):
# the original "2-week baselining window" is over and enforcement already
# happened — 8 of 10 jobs (G1, G2, G3, G4a, G4b, G4c, G6, G7) are
# `continue-on-error: false` (blocking). Only G5a (gitleaks git-history) and
# G5b (gitleaks admin bundle) remain `continue-on-error: true`, each for its
# own dated, documented reason (see the gitleaks job below) — not a blanket
# window. Do not read this file's age as evidence a job is still advisory;
# check that job's own `continue-on-error` line.
#
# Runs on every PR to main and on a daily schedule for main itself.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily 02:00 UTC — catches drift in main between PRs
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write      # to post finding comments
  security-events: write    # to upload SARIF

jobs:
  # G1 — Python SAST (Bandit)
  bandit:
    name: G1 · Bandit (Python SAST)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install bandit[toml]
      - name: Run Bandit
        # BLOCKING. `|| true` was removed 2026-07-30: bandit exits non-zero when it
        # finds an issue, so the swallow made this gate report green regardless.
        # Verified clean at these thresholds when enforced (0 findings at
        # high severity / high confidence over backend/).
        run: |
          bandit -r backend/ \
            --severity-level high \
            --confidence-level high \
            -f json -o bandit-report.json
      - uses: actions/upload-artifact@v7
        # always() so the report is still available for triage on the run that
        # failed — which is the only run anyone needs it for.
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # G2 — JS SAST (ESLint with security plugin; uses each module's own config)
  eslint-security:
    name: G2 · ESLint security plugin
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      matrix:
        module: [rider-app, driver-app, admin-dashboard]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # No `cache:` here — admin-dashboard uses package-lock.json, others
          # use yarn.lock. A fixed cache-dependency-path would fail for
          # whichever module doesn't match. Cache miss cost is ~30s and
          # security-gates is not a hot-path workflow.
      - name: Install deps
        working-directory: ${{ matrix.module }}
        continue-on-error: false
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else echo "No lockfile; skipping ${{ matrix.module }}"; exit 0
          fi
      - name: Lint
        working-directory: ${{ matrix.module }}
        # Respects the repo's own lint script (e.g. admin-dashboard intentionally
        # allows --max-warnings 600). Module owners tune strictness in their own
        # package.json — this gate's job is to make sure the linter actually RAN.
        #
        # `|| true` was removed 2026-07-30. It was hiding more than findings: at that
        # point `expo lint` could not start in two of the three modules, and the
        # swallow reported both as green.
        #   rider-app  — eslint pinned ^8.57.0 but eslint.config.js requires eslint
        #                9's `eslint/config` export: ERR_PACKAGE_PATH_NOT_EXPORTED.
        #   driver-app — "expand is not a function" inside minimatch 3.x, because a
        #                blanket `brace-expansion: ^5.0.8` resolution forced every
        #                consumer onto v5 (which exports an object, not a function).
        #
        # Both were fixed the same day — see
        # docs/change-log/2026-07-30-mobile-eslint-could-not-start.md. Both apps now
        # lint, and their finding counts are known for the first time:
        #   rider-app   28 errors / 306 warnings
        #   driver-app 178 errors / 225 warnings
        # Those are NOT blocking yet, for the same reason the gitleaks history scan
        # is not: a gate flipped onto a 178-error baseline is a permanently red gate,
        # which decays into the thing `|| true` was. They are bounded instead (see
        # the budget check below) so the counts cannot grow unnoticed while they are
        # worked down.
        #
        # ESLint exit codes: 0 clean, 1 lint problems, 2+ fatal (bad config, missing
        # module, internal crash). Yarn propagates them. Distinguishing 2 from 1 is
        # the whole point — a linter that cannot start must never look like a clean
        # one.
        run: |
          rc=0
          if [ -f yarn.lock ]; then yarn lint 2>&1 | tee /tmp/lint.out; rc=${PIPESTATUS[0]}
          elif [ -f package-lock.json ]; then npm run lint 2>&1 | tee /tmp/lint.out; rc=${PIPESTATUS[0]}
          else echo "No lockfile in ${{ matrix.module }}"; exit 0
          fi

          if [ "$rc" -ge 2 ]; then
            echo "::error::${{ matrix.module }}: the linter FAILED TO RUN (exit $rc) — broken tooling, not clean code."
            exit "$rc"
          fi

          if [ "$rc" -eq 1 ]; then
            # admin-dashboard is verified enforceable: its own script already
            # thresholds at --max-warnings 600, and it currently sits at 0 errors /
            # 319 warnings, so a non-zero exit there is a real regression.
            if [ "${{ matrix.module }}" = "admin-dashboard" ]; then
              echo "::error::admin-dashboard lint failed (errors, or warnings over the 600 budget)"
              exit 1
            fi

            # rider-app / driver-app: they lint now, but on an inherited baseline of
            # 28 and 178 errors. Rather than block (permanently red) or wave through
            # (the `|| true` failure mode), hold the line with an error budget. The
            # numbers are the measured baselines as of 2026-07-30 — RATCHET THEM DOWN
            # as errors are fixed, never up to accommodate new ones.
            case "${{ matrix.module }}" in
              rider-app)  budget=28  ;;
              driver-app) budget=178 ;;
              *)          budget=0   ;;
            esac
            found=$(grep -oE '[0-9]+ error' /tmp/lint.out | tail -1 | grep -oE '[0-9]+' || echo 0)
            echo "${{ matrix.module }}: $found errors (budget $budget)"
            if [ "$found" -gt "$budget" ]; then
              echo "::error::${{ matrix.module }} lint errors rose to $found, over the $budget baseline. Fix the new ones — do not raise the budget."
              exit 1
            fi
            echo "::warning::${{ matrix.module }} lint: $found errors within the $budget baseline budget (backlog, tracked in ACTION_ITEMS.md)"
          fi

  # G3 — Semgrep with Spinr-specific ruleset + public registry rules
  semgrep:
    name: G3 · Semgrep (Spinr rules + public)
    runs-on: ubuntu-latest
    continue-on-error: false
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7

      # The Spinr ruleset silently failed to parse for its entire existence
      # (unquoted `- pattern:` scalars containing `": "`; fixed 2026-07-30). The
      # scan step's `|| true` swallowed semgrep's exit 7, so the gate reported
      # green while running none of the 10 Spinr rules. This check is a plain YAML
      # parse — no network, no registry — so it catches that exact class of
      # breakage even when semgrep.dev is unreachable.
      #
      # CR #2915: the semgrep/semgrep:latest image (Alpine-based) doesn't ship
      # PyYAML, so this validation step itself failed with ModuleNotFoundError
      # on every PR, before semgrep scan ever ran — the exact "gate silently
      # never runs" failure mode this step exists to catch, just from a
      # different cause. pip install here, not a separate step, so a failure
      # to install still fails fast with a clear error instead of a confusing
      # later ModuleNotFoundError.
      - name: Validate Spinr ruleset parses
        run: |
          # --break-system-packages: the semgrep/semgrep:latest image's
          # system Python is PEP 668 "externally managed" (Alpine), so a
          # bare `pip install` is refused outright. Safe here — this is an
          # ephemeral CI container discarded after the job, not a shared or
          # persistent environment a system-package conflict could affect.
          pip install --quiet --no-cache-dir --break-system-packages pyyaml
          python3 - <<'PY'
          import sys, yaml
          path = ".semgrep/spinr-rules.yml"
          try:
              doc = yaml.safe_load(open(path))
          except yaml.YAMLError as exc:
              print(f"::error file={path}::ruleset is not valid YAML: {exc}")
              sys.exit(1)
          rules = (doc or {}).get("rules")
          if not rules:
              print(f"::error file={path}::ruleset declares no rules")
              sys.exit(1)
          missing = [r.get("id", "<no id>") for r in rules if not r.get("severity")]
          if missing:
              print(f"::error file={path}::rules missing severity: {missing}")
              sys.exit(1)
          print(f"{path}: OK, {len(rules)} rules")
          PY

      - name: Semgrep scan
        run: |
          # Semgrep exit codes: 0 = clean, 1 = findings, 7 = invalid config,
          # other = internal error. Distinguishing them is the whole point: a
          # broken gate must never again be indistinguishable from a clean one.
          #
          # `|| rc=$?` not `; rc=$?` — GitHub's default shell is `bash -e`, which
          # exits before a semicolon-separated assignment runs (same trap the
          # yarn-audit job documents below).
          rc=0
          semgrep scan \
            --config=.semgrep/spinr-rules.yml \
            --config=p/python \
            --config=p/typescript \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --severity=WARNING \
            --sarif --output=semgrep.sarif || rc=$?

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::semgrep exited $rc — it failed to RUN (bad config, network, or internal error)."
            echo "::error::This is a broken gate, not a clean one. Do not suppress it."
            exit "$rc"
          fi

          # Findings themselves are not yet blocking. This is deliberate and
          # temporary: the first real run of the Spinr ruleset produced 74
          # findings dominated by rule defects, not code defects — e.g.
          # spinr-no-float-in-money flags fare_service._f(), the Decimal->float
          # helper CLAUDE.md *mandates* at the response boundary, and
          # spinr-jwt-role-must-reread fires on any `user.get('role')`. Blocking
          # on those would force removing the prescribed pattern.
          #
          # Tracked as its own task: tune the four over-broad rules, then delete
          # this block so findings fail the job. Findings are uploaded to the
          # GitHub Security tab below either way, so they are visible now.
          if [ "$rc" -eq 1 ]; then
            echo "::warning::semgrep reported findings — visible in the Security tab (not yet merge-blocking; rule tuning pending)"
          fi

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # G4 — Dependency audit (Python + JS)
  pip-audit:
    name: G4a · pip-audit (Python deps)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      # BLOCKING. `|| true` was removed 2026-07-30. Verified clean against the
      # PyPI advisory service (`--vulnerability-service pypi`) — the OSV service
      # used here is a superset, so a first enforced run could surface an advisory
      # PyPI does not carry. If that happens, fix or pin the dependency; do not
      # restore the swallow.
      - run: pip-audit -r backend/requirements-locked.txt --vulnerability-service osv

  yarn-audit:
    name: G4b · yarn audit (JS deps)
    runs-on: ubuntu-latest
    # Blocking on HIGH+ CVEs — baseline was clean when this was enabled (2026-04-27).
    continue-on-error: false
    strategy:
      # Without this, one failing module cancels the others mid-run and their
      # audit status is never reported. `shared` failed on every PR from
      # 2026-07-29 onward, so the rider-app / driver-app / admin-dashboard legs
      # were cancelled rather than run — their audit state was unknown for the
      # entire period, masked by a leg that was failing for an unrelated reason.
      fail-fast: false
      matrix:
        module: [rider-app, driver-app, admin-dashboard, shared]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Audit
        working-directory: ${{ matrix.module }}
        run: |
          if [ -f yarn.lock ]; then
            # yarn 1.x exit codes are a bitmask: 4=moderate, 8=high, 16=critical.
            # --level high controls display only; the exit code still reflects all
            # severities found. We only want to fail on HIGH(8) or CRITICAL(16).
            # Use `|| rc=$?` not `; rc=$?` — bash -e (GitHub's default shell) exits
            # immediately on non-zero before the semicolon-separated assignment runs.
            rc=0; yarn audit --level high || rc=$?
            if [ $((rc & 24)) -ne 0 ]; then exit 1; fi
          elif [ -f package-lock.json ]; then npm audit --audit-level=high
          else echo "No lockfile in ${{ matrix.module }}"
          fi

  # G4c — Blocking npm audit for admin-dashboard ([17-3])
  # Separated from the yarn-audit matrix so it can be enforced independently.
  # Baselining window is over once [19-1]/[19-2] CVE overrides are merged.
  npm-audit-admin:
    name: G4c · npm audit (admin-dashboard, HIGH blocking)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json
      - name: Install dependencies
        working-directory: admin-dashboard
        run: npm ci
      - name: Audit for HIGH+ CVEs
        working-directory: admin-dashboard
        run: npm audit --audit-level=high

  # G5 — Secret scanning (git history)
  gitleaks:
    name: G5a · Gitleaks (git history)
    runs-on: ubuntu-latest
    # NOT blocking yet — and the reason is important, so do not "clean this up".
    #
    # This was briefly flipped to false on the strength of a full-history scan
    # reporting "no leaks found". That result was worthless: .gitleaks.toml had no
    # [extend] stanza, so passing --config REPLACED gitleaks' ruleset with zero
    # rules and the scan could not report anything (fixed 2026-07-30 — see the
    # comment at the top of .gitleaks.toml). Re-running with rules actually loaded
    # returned 44,492 findings, so enforcing here would simply have made the
    # default branch permanently red.
    #
    # 44,487 of those are gitleaks' `generic-api-key` entropy heuristic firing on
    # the committed frontend/.metro-cache build cache, now excluded. The remaining
    # handful are triaged in
    # docs/change-log/2026-07-30-secret-scanning-gate-was-vacuous.md — and one of
    # them is a real, still-valid Supabase service_role key in git history, which
    # needs rotation before this gate can be honestly enforced.
    #
    # Flip to false once the baseline is genuinely clean; do not flip it to make
    # the gate look enforced.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # G5b — Scan compiled Next.js bundle for leaked NEXT_PUBLIC_* secrets.
  # A build-time env var that should have been server-only can slip into
  # the bundle (e.g. NEXT_PUBLIC_API_KEY) and pass git-history scanning
  # while still being present in the shipped artefact.
  bundle-secrets:
    name: G5b · Gitleaks (admin bundle)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build admin dashboard
        working-directory: admin-dashboard
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Scan bundle for secrets
        # Scan only static/ — that is what browsers receive. The server/
        # directory holds source maps (.map) and server-rendered code; real
        # secrets there are a server-side concern covered by G5a + G3, not a
        # client-bundle-leakage concern. Scanning the full .next/ directory
        # with gitleaks causes source-map false positives on placeholder
        # strings (pk_test_..., sk_test_...) from the settings form.
        # gitleaks-action@v2 does not support the `args` input.
        # Use a direct invocation via the gitleaks binary for non-git directory scans.
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin/ gitleaks
          gitleaks detect \
            --source admin-dashboard/.next/static \
            --no-git \
            --redact \
            --config .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # G6 — Trivy container image scan (OS packages + Python libraries)
  # Runs a standalone docker build so this workflow has no cross-workflow
  # dependency on ci.yml. Blocks on HIGH or CRITICAL unfixed CVEs.
  container-scan:
    name: G6 · Trivy container scan
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag spinr-backend:sec-${{ github.sha }} \
            backend/
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spinr-backend:sec-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          # CR-2026-002 / #3048: excludes pip's own embedded CycloneDX SBOM
          # (pip/_vendor/bom.cdx.json, describing pip's internally vendored
          # msgpack/setuptools copies — never imported by the app). Trivy
          # auto-detects any *.cdx.json in the image and, per its own "Third-
          # party SBOM may lead to inaccurate vulnerability detection"
          # warning, prefers that file's component list over its live
          # filesystem scan — which is why msgpack 1.1.2/setuptools 70.3.0
          # (pip's vendored versions) were reported HIGH while the real
          # top-level packages (msgpack 1.2.1, setuptools 83.0.0) were
          # already clean per Trivy's own per-file inventory. Root cause
          # confirmed by reproducing this image's exact pip version (26.2,
          # per ci.yml's build logs) in an isolated venv and inspecting its
          # vendor.txt + bom.cdx.json directly — see ci.yml's docker-image-
          # scan job for the live diagnostic against the actual image.
          skip-files: '**/pip/_vendor/bom.cdx.json'
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spinr-backend:sec-${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: HIGH,CRITICAL
          skip-files: '**/pip/_vendor/bom.cdx.json'
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-container.sarif

  # G7 — pip-licenses: block strong copyleft / proprietary licences in Python deps.
  # Strategy: denylist (block GPL, AGPL, SSPL, Elastic, Commons Clause) rather than
  # allowlist, because allowlists produce false positives when packages report
  # valid permissive licences with slightly different name strings (HPND, PSF, etc.).
  # Add a new denied pattern here if a problematic licence family is introduced.
  license-check:
    name: G7 · pip-licenses (Python deps)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps + pip-licenses
        working-directory: backend
        run: pip install -r requirements.txt pip-licenses --quiet
      - name: Print full licence report
        working-directory: backend
        run: pip-licenses --format=markdown --order=license
      - name: Block copyleft / proprietary licences
        working-directory: backend
        run: |
          pip-licenses --format=json | python3 -c "
          import json, sys
          DENIED = [
              'GNU General Public License',
              'GNU Affero General Public License',
              'Server Side Public License',
              'Elastic License',
              'Commons Clause',
              'Business Source License',
          ]
          data = json.load(sys.stdin)
          bad = [(p['Name'], p['License']) for p in data
                 if any(d in p['License'] for d in DENIED)]
          if bad:
              for name, lic in bad:
                  print(f'DENIED: {name}: {lic}')
              sys.exit(1)
          print(f'OK — {len(data)} packages, no copyleft/proprietary licences detected.')
          "

  # Summary job — required check for branch protection once gates are enforced
  summary:
    name: Security gates summary
    needs: [bandit, eslint-security, semgrep, pip-audit, yarn-audit, npm-audit-admin, gitleaks, bundle-secrets, container-scan, license-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          echo "## Security Gates Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "G1 (bandit), G2 (eslint-security), G3 (semgrep), G4a-c" >> $GITHUB_STEP_SUMMARY
          echo "(pip-audit/yarn-audit/npm-audit), G6 (container-scan), and G7" >> $GITHUB_STEP_SUMMARY
          echo "(license-check) are **blocking** (OI-003-OI-006 resolved," >> $GITHUB_STEP_SUMMARY
          echo "pre-production enforcement). G5a/G5b (gitleaks) remain" >> $GITHUB_STEP_SUMMARY
          echo "**advisory** pending a clean secrets baseline — see that job's" >> $GITHUB_STEP_SUMMARY
          echo "own comment for why." >> $GITHUB_STEP_SUMMARY
          echo "Review findings in individual job outputs; file P1 items for" >> $GITHUB_STEP_SUMMARY
          echo "any new HIGH/CRITICAL results in \`OPEN-ITEMS-TRACKER.md\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch-protection rule requiring this workflow on PRs must be" >> $GITHUB_STEP_SUMMARY
          echo "configured in GitHub repo settings to enforce these gates." >> $GITHUB_STEP_SUMMARY
