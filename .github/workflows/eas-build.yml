name: EAS Mobile Update

# ─── What this does ────────────────────────────────────────────────────────
# On every push to main that touches rider-app / driver-app / shared:
#   → Publishes an OTA JS-only update to the `production` channel for the
#     affected app. Phones on that channel pick it up on next launch.
#
# OTA updates are JS-only. Native changes (new deps with native side, plugin
# changes, Info.plist, permission additions, runtimeVersion bumps) still
# require a full EAS build run separately.

on:
  push:
    branches: [main]
    paths:
      - "rider-app/**"
      - "driver-app/**"
      - "shared/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to update"
        required: true
        default: "both"
        type: choice
        options: [rider-app, driver-app, both]
      profile:
        description: "OTA channel"
        required: true
        default: "preview"
        type: choice
        options: [test, preview, production]

# Detect which app(s) changed so push-triggered runs only process the affected
# app. Shared changes hit both.
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      rider: ${{ steps.filter.outputs.rider }}
      driver: ${{ steps.filter.outputs.driver }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rider:
              - 'rider-app/**'
              - 'shared/**'
            driver:
              - 'driver-app/**'
              - 'shared/**'

  rider:
    needs: detect
    if: |
      (github.event_name == 'push' && needs.detect.outputs.rider == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'rider-app' || github.event.inputs.app == 'both'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rider-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: yarn install --frozen-lockfile

      - name: Publish OTA update
        env:
          CHANNEL: ${{ github.event.inputs.profile || 'preview' }}
          MSG: ${{ github.event.head_commit.message }}
          # `eas update` computes a project fingerprint before publishing, even
          # though this app pins a literal runtimeVersion (not the 'fingerprint'
          # policy — app.config.ts's own comment says EAS CLI rejects that
          # policy for bare workflow), so the computed fingerprint is unused
          # dead weight here. It also currently crashes: @expo/fingerprint's
          # bundled minimatch@10.2.5 needs brace-expansion@^5.0.5, has no
          # nested copy, and Node resolution walks up to the wrongly-hoisted
          # top-level brace-expansion@1.1.18 instead — "(0 , brace_expansion_1
          # .expand) is not a function". That's a yarn.lock resolution bug
          # (ACTION_ITEMS.md C19), not an eas-cli or app bug; EAS_SKIP_AUTO_
          # FINGERPRINT=1 is the CLI's own documented bypass for a step this
          # app's OTA compatibility model doesn't use anyway. Remove once C19's
          # durable fix (correct the brace-expansion resolution) lands.
          EAS_SKIP_AUTO_FINGERPRINT: "1"
        run: |
          MESSAGE="${MSG:-manual update}"
          # eas update truncates at 1024 chars; keep just the first line.
          MESSAGE=$(echo "$MESSAGE" | head -1 | cut -c1-1000)
          # Publish to the branch of the same name as the channel (branch
          # `preview`/`production`/`test`). `eas update --channel` requires the
          # channel to already be linked to exactly one branch and fails with
          # "Channel has no branches associated with it" otherwise; publishing
          # by --branch is unambiguous. The same-named channel routes builds to
          # this branch (one-time `eas channel:edit <name> --branch <name>`).
          eas update --branch "$CHANNEL" --non-interactive --message "$MESSAGE"

  driver:
    needs: detect
    if: |
      (github.event_name == 'push' && needs.detect.outputs.driver == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'driver-app' || github.event.inputs.app == 'both'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: yarn install --frozen-lockfile

      - name: Publish OTA update
        env:
          CHANNEL: ${{ github.event.inputs.profile || 'preview' }}
          MSG: ${{ github.event.head_commit.message }}
          # See rider job above — same crash, same bundled @expo/fingerprint /
          # minimatch@10.2.5 / brace-expansion mismatch (ACTION_ITEMS.md C19).
          EAS_SKIP_AUTO_FINGERPRINT: "1"
        run: |
          MESSAGE="${MSG:-manual update}"
          MESSAGE=$(echo "$MESSAGE" | head -1 | cut -c1-1000)
          # See rider job above — publish by branch, not channel.
          eas update --branch "$CHANNEL" --non-interactive --message "$MESSAGE"
