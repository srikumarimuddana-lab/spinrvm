name: Claude PR review

# Runs the Claude Code GitHub Action against every new/updated PR or when an
# authorised reviewer comments "/claude review". Findings are posted as a PR
# review comment. Never merges; never pushes code back.
#
# Required repo secret (one of):
#   ANTHROPIC_API_KEY — Spinr org-scoped, with billing alerts enabled.
#   CLAUDE_CODE_OAUTH_TOKEN — alternative OAuth-token auth, if preferred.
#
# Optional (recommended):
#   SUPABASE_READONLY_TOKEN, CONTEXT7_API_KEY — mirror of .claude/mcp.example.json
#
# COST CONTROL (ACTION_ITEMS.md C7, E12 of docs/audit/2026-09-25-contributor-
# governance-baseline.md): this repo is pre-launch and the ANTHROPIC_API_KEY
# has intentionally been left unset since 2026-08-01 on cost grounds — see
# C7's decision record. Re-enabling this workflow is a trial, not a permanent
# switch-on: whoever sets the secret should also set a hard spend cap +
# billing alert in the Anthropic Console first (this workflow cannot enforce
# a dollar cap itself, only bound per-run cost). Three levers now keep that
# per-run cost predictable and bound run *volume* to the highest-risk paths:
#   --model claude-sonnet-5 — the cheaper, faster model this repo already
#     uses for its own Claude Code sessions (see this file's own commit
#     trailers), not the more expensive default.
#   --max-turns 30 — caps the agentic loop so one run cannot runway on a
#     large or confusing diff. If reviews start truncating mid-audit on
#     legitimately large PRs, raise this number in its own commit with a
#     citation of which PR needed it — don't raise it speculatively.
#   `paths:` below (added 2026-09-25, E12) — the automatic per-push trigger
#     now only fires on the same money/auth/dispatch/schema/safety paths
#     CODEOWNERS already treats as sensitive, instead of every non-doc PR.
#     A PR outside those paths gets no automatic AI review, but any PR can
#     still get one on demand via a `/claude review` comment (unfiltered,
#     see the issue_comment trigger below) — so this narrows *automatic*
#     cost, not reviewer access.
#
# The `--model` string above could not be verified end-to-end against a
# live Anthropic API call from this session (network-restricted sandbox).
# It's internally consistent with this repo's own `.claude/settings.json`
# convention, but the FIRST live run after the secret is actually set
# should be watched manually for a model-not-found error, not assumed
# correct from this comment alone.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    # Skip drafts to avoid burning tokens on work-in-progress branches.
    #
    # `synchronize` is deliberately absent. It fires on every push to an open
    # PR, so an agent-driven branch with 4 pushes paid for 4 full three-agent
    # audits to review one final state. Re-review a pushed branch on demand
    # with a `/claude review` comment (see the issue_comment trigger below,
    # which is not path-filtered and works on any PR).
    #
    # Path allowlist (E12, 2026-09-25): mirrors .github/CODEOWNERS' own
    # money/schema/auth/dispatch/safety domain list, so the automatic trigger
    # only fires where an unreviewed regression is most expensive. Keep this
    # list in sync with CODEOWNERS by hand — GitHub Actions can't include
    # another file's path list, and letting the two drift defeats the point
    # (a path CODEOWNERS calls sensitive but this list omits gets no
    # automatic AI review either). A PR outside this list can still be
    # reviewed on demand — see the issue_comment trigger below.
    paths:
      - 'backend/routes/payments*'
      - 'backend/services/fare_service.py'
      - 'backend/services/corporate_*'
      - 'backend/routes/corporate_*'
      - 'backend/routes/wallet*'
      - 'backend/utils/payment_retry.py'
      - 'backend/utils/surge_engine.py'
      - 'backend/migrations/**'
      - 'backend/routes/auth*'
      - 'backend/core/config.py'
      - 'backend/core/middleware.py'
      - 'backend/utils/crypto.py'
      - 'backend/utils/rate_limiter.py'
      - '.github/workflows/security-gates.yml'
      - 'backend/services/dispatch_service.py'
      - 'backend/routes/rides/**'
      - 'backend/routes/safety*'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  # Coalesce rapid pushes to the same PR — only latest review matters
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Run on PRs (non-draft) or on comments that explicitly ask for a review
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/claude review') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Review is advisory — a missing/invalid ANTHROPIC_API_KEY or model error
    # should never block merging. Add the key in repo Settings → Secrets to
    # enable full AI review; until then PRs proceed without it.
    #
    # `continue-on-error` keeps a failed run from blocking the merge, but it
    # does NOT stop the check from reporting `failure` in the PR checks list.
    # A permanently-red advisory check trains reviewers to ignore red, so the
    # keyless case is now detected up front and the run is skipped cleanly
    # instead of failing. continue-on-error is retained for the case where the
    # key IS set and the model call errors mid-run.
    continue-on-error: true
    env:
      # `secrets` is available in job-level `env` but not in job-level `if`,
      # so the presence check is threaded through to the steps this way.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      - name: Report that AI review is disabled
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          echo "::notice title=Claude PR review skipped::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set, so the AI review did not run. This is a supported configuration — the review is advisory and never blocks merging. Set one of the secrets in Settings → Secrets to enable it."

      - name: Checkout PR code
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Claude review
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-action@9c41ed18ca8b2b2a17eaef4723d5092ccdebc814 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cost control (ACTION_ITEMS.md C7) -- passed straight to the
          # Claude Code CLI. `--model` pins the cheaper model instead of
          # this action's default; `--max-turns` bounds the agentic loop so
          # one run cannot runaway on a large diff. See this file's header
          # comment for the full rationale and how to change either value.
          claude_args: "--model claude-sonnet-5 --max-turns 30"
          # Inline prompt — keeps review behaviour under source control
          prompt: |
            You are reviewing a Spinr pull request. Load CLAUDE.md and the
            relevant .claude/context/domain-*.md files for the files in this
            diff.

            The PR body follows the tiered template at
            .github/pull_request_template.md. Other jobs in
            .github/workflows/pr-checks.yml already handle:
              - path-based labels (auto-label)
              - PR size advisory (size-advisory)
              - required Tier 1–4 fields (required-fields, blocking)
              - merge-commit detection (merge-conflict-detect)
              - Tier 5–7 subsection expansion (expand-sections)
              - declared-vs-diff summary table (auto-summary)
            Do NOT duplicate any of that. Your job is the deep code-level
            audit plus the per-agent IMPACT MISMATCHES cross-check the
            existing summary cannot perform.

            Pass the full PR body (`$PR_BODY` is exposed via the action) to
            each agent so its "Impact cross-check" section can run. If the
            body is empty, note "no PR body supplied" once and proceed with
            the regular audit.

            Run these agents in order, surfacing each report — including its
            IMPACT MISMATCHES block — under its own heading:
              1. spinr-security-auditor   (always)
              2. spinr-money-auditor      (only if diff touches payments,
                                           fares, wallets, corporate, Stripe)
              3. spinr-migration-reviewer (only if diff adds or edits
                                           backend/migrations/*.sql)

            Then provide an overall verdict on a single line:
              SAFE TO MERGE / FIX BLOCKERS / NEEDS HUMAN REVIEW (security|finance|dba|legal)

            Be terse. Quote file:line for every code-level finding. Do NOT
            suggest code edits inline — reviewers will ask for fixes
            separately. Do NOT restate the auto-summary table or the size
            advisory.
