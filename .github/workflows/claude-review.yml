name: Claude PR review

# Runs the Claude Code GitHub Action against every new/updated PR or when an
# authorised reviewer comments "/claude review". Findings are posted as a PR
# review comment. Never merges; never pushes code back.
#
# Required repo secret:
#   ANTHROPIC_API_KEY — Spinr org-scoped, with billing alerts enabled.
#
# Optional (recommended):
#   SUPABASE_READONLY_TOKEN, CONTEXT7_API_KEY — mirror of .claude/mcp.example.json

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    # Skip drafts to avoid burning tokens on work-in-progress branches.
    #
    # `synchronize` is deliberately absent. It fires on every push to an open
    # PR, so an agent-driven branch with 4 pushes paid for 4 full three-agent
    # audits to review one final state. Re-review a pushed branch on demand
    # with a `/claude review` comment (see the issue_comment trigger below,
    # which is not path-filtered and works on any PR).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  # Coalesce rapid pushes to the same PR — only latest review matters
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Run on PRs (non-draft) or on comments that explicitly ask for a review
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/claude review') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Review is advisory — a missing/invalid ANTHROPIC_API_KEY or model error
    # should never block merging. Add the key in repo Settings → Secrets to
    # enable full AI review; until then PRs proceed without it.
    #
    # `continue-on-error` keeps a failed run from blocking the merge, but it
    # does NOT stop the check from reporting `failure` in the PR checks list.
    # A permanently-red advisory check trains reviewers to ignore red, so the
    # keyless case is now detected up front and the run is skipped cleanly
    # instead of failing. continue-on-error is retained for the case where the
    # key IS set and the model call errors mid-run.
    continue-on-error: true
    env:
      # `secrets` is available in job-level `env` but not in job-level `if`,
      # so the presence check is threaded through to the steps this way.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Report that AI review is disabled
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          echo "::notice title=Claude PR review skipped::ANTHROPIC_API_KEY is not set, so the AI review did not run. This is a supported configuration — the review is advisory and never blocks merging. Set the secret in Settings → Secrets to enable it."

      - name: Checkout PR code
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude review
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Inline prompt — keeps review behaviour under source control
          prompt: |
            You are reviewing a Spinr pull request. Load CLAUDE.md and the
            relevant .claude/context/domain-*.md files for the files in this
            diff.

            The PR body follows the tiered template at
            .github/pull_request_template.md. Other jobs in
            .github/workflows/pr-checks.yml already handle:
              - path-based labels (auto-label)
              - PR size advisory (size-advisory)
              - required Tier 1–4 fields (required-fields, blocking)
              - merge-commit detection (merge-conflict-detect)
              - Tier 5–7 subsection expansion (expand-sections)
              - declared-vs-diff summary table (auto-summary)
            Do NOT duplicate any of that. Your job is the deep code-level
            audit plus the per-agent IMPACT MISMATCHES cross-check the
            existing summary cannot perform.

            Pass the full PR body (`$PR_BODY` is exposed via the action) to
            each agent so its "Impact cross-check" section can run. If the
            body is empty, note "no PR body supplied" once and proceed with
            the regular audit.

            Run these agents in order, surfacing each report — including its
            IMPACT MISMATCHES block — under its own heading:
              1. spinr-security-auditor   (always)
              2. spinr-money-auditor      (only if diff touches payments,
                                           fares, wallets, corporate, Stripe)
              3. spinr-migration-reviewer (only if diff adds or edits
                                           backend/migrations/*.sql)

            Then provide an overall verdict on a single line:
              SAFE TO MERGE / FIX BLOCKERS / NEEDS HUMAN REVIEW (security|finance|dba|legal)

            Be terse. Quote file:line for every code-level finding. Do NOT
            suggest code edits inline — reviewers will ask for fixes
            separately. Do NOT restate the auto-summary table or the size
            advisory.
          # max_turns removed — not a valid input for claude-code-action@v1
