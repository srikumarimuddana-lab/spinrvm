name: EAS Mobile Update

# ─── What this does ────────────────────────────────────────────────────────
# On every push to main that touches rider-app / driver-app / shared:
#   → Publishes an OTA JS-only update to the `production` channel for the
#     affected app. Phones on that channel pick it up on next launch.
#
# OTA updates are JS-only. Native changes (new deps with native side, plugin
# changes, Info.plist, permission additions, runtimeVersion bumps) still
# require a full EAS build run separately.

on:
  push:
    branches: [main]
    paths:
      - "rider-app/**"
      - "driver-app/**"
      - "shared/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to update"
        required: true
        default: "both"
        type: choice
        options: [rider-app, driver-app, both]
      profile:
        description: "OTA channel"
        required: true
        default: "preview"
        type: choice
        options: [test, preview, production]

# Detect which app(s) changed so push-triggered runs only process the affected
# app. Shared changes hit both.
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      rider: ${{ steps.filter.outputs.rider }}
      driver: ${{ steps.filter.outputs.driver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rider:
              - 'rider-app/**'
              - 'shared/**'
            driver:
              - 'driver-app/**'
              - 'shared/**'

  rider:
    needs: detect
    if: |
      (github.event_name == 'push' && needs.detect.outputs.rider == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'rider-app' || github.event.inputs.app == 'both'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rider-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 22, not 20: eas-version: latest below always pulls eas-cli's
      # current dependency tree, and @oclif/plugin-autocomplete bumped its own
      # engines.node to >=22.0.0 in 3.3.0 (2026-08-2x) independent of eas-cli's
      # own (unchanged) >=20.0.0 requirement. yarn classic hard-fails the
      # install on that mismatch (not just a warning), which is why every run
      # of this workflow failed from that release onward. Before this change,
      # confirmed rider-app's and driver-app's own yarn install
      # --frozen-lockfile (below) succeed under Node 22 in a local sandbox —
      # that's evidence the app toolchain tolerates Node 22, NOT evidence the
      # "Setup EAS" step's own eas-cli install succeeds on a real GitHub
      # Actions runner under Node 22; that remains unverified until this
      # workflow actually runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: yarn install --frozen-lockfile

      - name: Publish OTA update
        env:
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          EVENT_NAME: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # `github.event.inputs.*` is only populated for workflow_dispatch —
          # on the ordinary `push` trigger it is always empty, so
          # `github.event.inputs.profile || 'preview'` silently fell through to
          # 'preview' on every push, even though this workflow's own header
          # comment documents "publishes ... to the `production` channel" on
          # push to main. Confirmed via a real run's log (CHANNEL: preview on
          # a push-triggered run) — every push-triggered OTA update since this
          # workflow existed went to `preview`, never `production`.
          #
          # That fix alone is still wrong for Android: the real Expo build
          # history (checked against the dashboard, not assumed) shows every
          # actual Android Play Store submission for both apps — rider-app's
          # own production-track builds and driver-app's `android-auto`
          # profile alike — was cut with a build profile whose `channel` is
          # `preview` in eas.json, never `production`. Only iOS's real App
          # Store submissions use the `production` profile/channel. So a
          # single CHANNEL for both platforms would either strand Android on
          # `preview` (fine) while wrongly assuming `production` (if uniform
          # production), or fail to route iOS to where its real installs
          # actually are (if uniform preview). Each platform now gets the
          # channel its real store builds are actually on; workflow_dispatch
          # keeps the operator's explicit choice uniform across platforms,
          # since that's a deliberate manual override, not the push default
          # this bug is about.
          # Update 2026-09-09: android now publishes to BOTH channels on push.
          # The paragraph above is still accurate about history, but its
          # premise ("Android store builds are always channel preview") stopped
          # holding the moment the first Play production AAB was cut from the
          # `production` build profile, whose eas.json channel is `production`.
          # Two live Android populations now exist and they read different
          # branches:
          #   • preview    — every internal-distribution APK handed to live
          #                  testers (all Android store builds before this).
          #   • production — Play production installs.
          # Publishing android only to `preview` would leave every
          # Play-installed user with no reachable OTA update at all: branch
          # `production` receives only --platform ios publishes, so an Android
          # device on that channel finds nothing applicable and the OTA hotfix
          # path silently does not exist for it. Additive on purpose — preview
          # keeps receiving exactly what it received before.
          if [ -n "$INPUT_PROFILE" ]; then
            PAIRS="ios:$INPUT_PROFILE android:$INPUT_PROFILE"
          elif [ "$EVENT_NAME" = "push" ]; then
            PAIRS="ios:production android:preview android:production"
          else
            PAIRS="ios:preview android:preview"
          fi
          MESSAGE="${MSG:-manual update}"
          # eas update truncates at 1024 chars; keep just the first line.
          MESSAGE=$(echo "$MESSAGE" | head -1 | cut -c1-1000)
          # Publish to the branch of the same name as the channel (branch
          # `preview`/`production`/`test`). `eas update --channel` requires the
          # channel to already be linked to exactly one branch and fails with
          # "Channel has no branches associated with it" otherwise; publishing
          # by --branch is unambiguous. The same-named channel routes builds to
          # this branch (one-time `eas channel:edit <name> --branch <name>`).
          #
          # --environment is REQUIRED, not optional. EXPO_PUBLIC_* vars are
          # inlined into the JS bundle when it is built, and `eas update`
          # rebuilds the bundle. Without an environment it loads none of the EAS
          # environment variables, so every EXPO_PUBLIC_* value ships as an
          # empty string and the OTA silently strips config the binary had.
          # This is the "known EAS / OTA hazard" already documented at
          # driver-app/hooks/useDriverDashboard.ts:89, which cost a crash when
          # EXPO_PUBLIC_BACKEND_URL went empty. `test` has no matching EAS
          # environment (they are development/preview/production), so it maps to
          # preview alongside the preview channel.
          #
          # One --platform-scoped publish per entry in $PAIRS (not a single
          # unscoped call): the platforms legitimately target different
          # channels, and android deliberately appears twice on push so both
          # the preview and production channels are served (see above).
          for pair in $PAIRS; do
            platform="${pair%%:*}"
            channel="${pair#*:}"
            case "$channel" in
              production) env=production ;;
              *)          env=preview ;;
            esac
            eas update --platform "$platform" --branch "$channel" \
              --environment "$env" --non-interactive --message "$MESSAGE"
          done

  driver:
    needs: detect
    if: |
      (github.event_name == 'push' && needs.detect.outputs.driver == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'driver-app' || github.event.inputs.app == 'both'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 22 — see the rider job's comment above for why.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: yarn install --frozen-lockfile

      - name: Publish OTA update
        env:
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          EVENT_NAME: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # See rider job above for why this can't be `inputs.profile || 'preview'`,
          # and why iOS and Android need different channels on push (real
          # Android Play Store submissions — driver-app's own `android-auto`
          # profile included — have so far always used channel `preview`,
          # never `production`).
          # Update 2026-09-09: android now publishes to BOTH channels on push.
          # The paragraph above is still accurate about history, but its
          # premise ("Android store builds are always channel preview") stopped
          # holding the moment the first Play production AAB was cut from the
          # `production` build profile, whose eas.json channel is `production`.
          # Two live Android populations now exist and they read different
          # branches:
          #   • preview    — every internal-distribution APK handed to live
          #                  testers (all Android store builds before this).
          #   • production — Play production installs.
          # Publishing android only to `preview` would leave every
          # Play-installed user with no reachable OTA update at all: branch
          # `production` receives only --platform ios publishes, so an Android
          # device on that channel finds nothing applicable and the OTA hotfix
          # path silently does not exist for it. Additive on purpose — preview
          # keeps receiving exactly what it received before.
          if [ -n "$INPUT_PROFILE" ]; then
            PAIRS="ios:$INPUT_PROFILE android:$INPUT_PROFILE"
          elif [ "$EVENT_NAME" = "push" ]; then
            PAIRS="ios:production android:preview android:production"
          else
            PAIRS="ios:preview android:preview"
          fi
          MESSAGE="${MSG:-manual update}"
          MESSAGE=$(echo "$MESSAGE" | head -1 | cut -c1-1000)
          # See rider job above — publish by branch, always with an explicit
          # --environment, and one --platform-scoped call per platform since
          # the two channels can now differ.
          for pair in $PAIRS; do
            platform="${pair%%:*}"
            channel="${pair#*:}"
            case "$channel" in
              production) env=production ;;
              *)          env=preview ;;
            esac
            eas update --platform "$platform" --branch "$channel" \
              --environment "$env" --non-interactive --message "$MESSAGE"
          done
