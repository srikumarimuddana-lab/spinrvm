name: Migration Safety Check

on:
  pull_request:
    paths:
      - 'backend/migrations/*.sql'
  # This is the specific gap this trigger closes: CHECK B (below) only
  # evaluates a PR's own diff against its own merge-base, so it cannot see a
  # true cross-PR race where two PRs both branch before either merges. A
  # merge_group run sees the actual would-be post-merge state instead. See
  # docs/audit/2026-08-19-decision-writeups.md section 5 and ACTION_ITEMS.md
  # C36. Fires once GitHub's native merge queue is enabled on this repo.
  merge_group:
    paths:
      - 'backend/migrations/*.sql'

concurrency:
  group: migration-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  migration-safety:
    name: Migration Safety Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Detect changed migration files
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # On merge_group (no pull_request context), both resolve to empty
          # strings -- `git merge-base "" ""` then aborts the step outright
          # (`fatal: Not a valid object name`, exit 128) rather than degrading
          # gracefully, since this job has `set -e` on by default and no
          # existing fallback covered this case at all. This workflow has no
          # workflow_dispatch trigger (confirmed: only pull_request/merge_group),
          # so unlike ci-guardrails.yml's equivalent fix (CR-2026-085, PR #5399,
          # which has a configurable base_branch input to prefer) the only
          # applicable fallback here is the literal default branch. CR-2026-086.
          if [ -z "$BASE" ]; then
            BASE="origin/main"
          fi
          if [ -z "$HEAD" ]; then
            HEAD="HEAD"
          fi
          # Diff from the actual merge-base, not raw BASE. `pull_request.base.sha`
          # is the base branch's CURRENT tip, which keeps moving as main advances —
          # a PR branch that falls behind (hasn't merged/rebased main in a while)
          # would otherwise show every migration main gained since the PR's fork
          # point as "deleted by this PR" (present in a two-dot diff's BASE side,
          # absent on HEAD), tripping the append-only check below for migrations
          # the PR never touched. Found 2026-08-10 on PR #3497: 11 false-positive
          # append-only failures, all on migrations identical between the PR
          # branch's fork point and main, just added to main after the branch
          # diverged.
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD")
          # List all SQL files touched in this PR (added, modified, deleted)
          git diff --name-only --diff-filter=ACDMRT "$MERGE_BASE" "$HEAD" -- 'backend/migrations/*.sql' \
            > /tmp/changed_migrations.txt
          echo "Changed files:"
          cat /tmp/changed_migrations.txt
          echo "base_sha=$MERGE_BASE" >> "$GITHUB_OUTPUT"

      - name: Run migration safety checks
        id: check
        run: |
          python3 - << 'PYEOF'
          import os
          import re
          import sys

          MIGRATIONS_DIR = "backend/migrations"
          CHANGED_FILE = "/tmp/changed_migrations.txt"

          # ── ANSI colours for GitHub Actions log readability ──────────────────
          GREEN  = "\033[32m"
          YELLOW = "\033[33m"
          RED    = "\033[31m"
          RESET  = "\033[0m"

          STATUS_OK   = "✅"
          STATUS_WARN = "⚠️ "
          STATUS_FAIL = "❌"

          errors   = []   # hard failures → exit 1
          warnings = []   # soft warnings → exit 0

          # ── Load changed files ───────────────────────────────────────────────
          with open(CHANGED_FILE) as fh:
              changed = [l.strip() for l in fh if l.strip()]

          if not changed:
              print("No migration files changed. Nothing to check.")
              sys.exit(0)

          # ── Discover all migrations already in the repo (on HEAD) ────────────
          all_migrations = sorted(
              f for f in os.listdir(MIGRATIONS_DIR) if f.endswith(".sql")
          )

          def seq_num(filename):
              """Return the leading integer prefix, or None if not parseable."""
              m = re.match(r'^(\d+)_', os.path.basename(filename))
              return int(m.group(1)) if m else None

          existing_nums = sorted(
              n for n in (seq_num(f) for f in all_migrations) if n is not None
          )

          # ── Determine files that were NEW vs already existed on base branch ──
          import subprocess
          base_sha = os.environ.get("BASE_SHA", "")
          if not base_sha:
              # fall back: read from the output written by the previous step
              base_sha = subprocess.check_output(
                  ["git", "rev-parse", "origin/" + os.environ.get("GITHUB_BASE_REF", "main")],
                  text=True,
              ).strip()

          def file_existed_on_base(rel_path):
              result = subprocess.run(
                  ["git", "cat-file", "-e", f"{base_sha}:{rel_path}"],
                  capture_output=True,
              )
              return result.returncode == 0

          # ── Pre-classify: which changed files are genuinely NEW ───────────────
          # CHECK B below must validate a new file's number only against
          # PRE-EXISTING migrations plus its correct position among this PR's
          # own batch of new files — not against every file currently in the
          # working tree (`existing_nums`), which also includes this PR's
          # *other* new migrations. Without this, a PR adding two properly
          # sequential new migrations (e.g. 358 then 359) flags the
          # lower-numbered one as "colliding with" the higher-numbered one it
          # sits right before, since `existing_nums` already contains 359 by
          # the time 358 is checked. Found 2026-08-21 on a PR that did exactly
          # this — a real false positive, not a numbering mistake.
          #
          # Filtered by FILENAME identity, not by number value: a true
          # cross-PR collision (two different files sharing the same prefix,
          # the exact CR #4187 case this check exists to catch) must still
          # fail. Filtering `existing_nums` by number would also strip out a
          # *pre-existing* file's contribution whenever a new file happens to
          # reuse its number — silently defeating collision detection instead
          # of just fixing the multi-new-file false positive.
          new_files_set = {
              os.path.basename(rel_path) for rel_path in changed if not file_existed_on_base(rel_path)
          }
          base_files = [f for f in all_migrations if f not in new_files_set]
          base_only_nums = [n for n in (seq_num(f) for f in base_files) if n is not None]
          base_max = max(base_only_nums) if base_only_nums else 0
          new_file_nums = sorted(n for f in new_files_set for n in [seq_num(f)] if n is not None)

          # Same-PR sibling collision: two of THIS PR's own new files sharing
          # one numeric prefix. `new_file_nums.index(file_num)` below returns
          # only the first occurrence's rank, so without this both siblings
          # independently compute the same "expected" position and both read
          # as OK — a same-PR duplicate never trips the rank check at all.
          # Found 2026-08-23: commit fea60e4 landed two new files each at 328,
          # 349, and 354 in one PR and this check passed every one of them.
          new_files_by_num: dict[int, list[str]] = {}
          for f in new_files_set:
              n = seq_num(f)
              if n is not None:
                  new_files_by_num.setdefault(n, []).append(f)

          # ── Summary table header ─────────────────────────────────────────────
          rows = []   # (filename, check_name, status_icon, message)

          def record(filename, check, icon, msg):
              rows.append((filename, check, icon, msg))

          # ── Comment stripper (ported verbatim from ci-guardrails.yml's
          # migration-safety-gate, CR-2026-034 Phase 1) ─────────────────────────
          # Stricter than this file's own comment_lines helper below (which
          # only drops whole comment-only LINES, built for CHECK D's
          # rollback-comment detection): this one also strips a trailing
          # `-- comment` after real code on the same line, and is
          # string-literal-aware so a `--` inside a quoted string doesn't
          # falsely start a comment. Used only by CHECK E (dangerous
          # operations), which is now hard-fail and needs the lower
          # false-positive rate ci-guardrails.yml's version already proved in
          # production (traced to the #4791/migration 376 false-positive fix).
          def strip_sql_comments(text):
              text = re.sub(r'/\*.*?\*/', '', text, flags=re.DOTALL)
              out_lines = []
              for line in text.split('\n'):
                  result = []
                  in_string = False
                  i = 0
                  while i < len(line):
                      ch = line[i]
                      if ch == "'":
                          in_string = not in_string
                          result.append(ch)
                          i += 1
                          continue
                      if not in_string and ch == '-' and i + 1 < len(line) and line[i + 1] == '-':
                          break
                      result.append(ch)
                      i += 1
                  out_lines.append(''.join(result))
              return '\n'.join(out_lines)

          # ── Per-file checks ──────────────────────────────────────────────────
          for rel_path in changed:
              filename = os.path.basename(rel_path)
              short    = filename

              # ── CHECK F: append-only (no edits to existing migrations) ───────
              if file_existed_on_base(rel_path):
                  msg = "Append-only: never edit a merged migration"
                  record(short, "append-only", STATUS_FAIL, msg)
                  errors.append(f"{short}: {msg}")
                  # Skip further checks for this file — it shouldn't exist as a change
                  continue

              # ── CHECK A: naming convention ────────────────────────────────────
              naming_ok = bool(re.match(r'^\d{2,}_[a-z0-9_]+\.sql$', filename))
              if naming_ok:
                  record(short, "naming", STATUS_OK, "matches NN_description.sql")
              else:
                  msg = f"filename '{filename}' does not match ^\\d{{2,}}_[a-z0-9_]+\\.sql$"
                  record(short, "naming", STATUS_FAIL, msg)
                  errors.append(f"{short}: {msg}")

              # ── CHECK B: sequence gap / collision ────────────────────────────
              file_num = seq_num(filename)
              siblings = new_files_by_num.get(file_num, []) if file_num is not None else []
              if len(siblings) > 1:
                  others = sorted(f for f in siblings if f != filename)
                  msg = f"prefix {file_num} is also used by {', '.join(others)} in this same PR"
                  record(short, "sequence", STATUS_FAIL, msg)
                  errors.append(f"{short}: {msg}")
              elif file_num is not None and file_num in new_file_nums:
                  # This file's expected position accounts for pre-existing
                  # migrations (base_max) plus its own rank among this PR's
                  # other new migrations — NOT the raw working-tree max, which
                  # would include this PR's own later files (see the
                  # new_file_nums/base_max comment above for why).
                  rank = new_file_nums.index(file_num) + 1
                  expected = base_max + rank
                  if file_num == expected:
                      record(short, "sequence", STATUS_OK, f"prefix {file_num} is next after {expected - 1}")
                  elif file_num < expected:
                      # True collision: this prefix already belongs to (or precedes)
                      # a migration that exists elsewhere in the repo. This is a hard
                      # failure, not a warning — CR #4187: two unrelated PRs (#4126,
                      # #4129) both landed migration 327_*.sql on main because this
                      # branch only ever appended to `warnings`, so it could never
                      # actually block a merge even on a same-PR-visible collision.
                      # The sequence-*gap* case below (missing numbers, no collision)
                      # deliberately stays a warning — gaps are cosmetic and this repo
                      # already carries accepted historical duplicates (319, 321, 327).
                      msg = f"prefix {file_num} collides with or precedes existing max {expected - 1} (expected {expected})"
                      record(short, "sequence", STATUS_FAIL, msg)
                      errors.append(f"{short}: {msg}")
                  else:
                      msg = f"sequence gap — expected {expected}, got {file_num} (missing numbers in between)"
                      record(short, "sequence", STATUS_WARN, msg)
                      warnings.append(f"{short}: {msg}")

              # ── Read file content ─────────────────────────────────────────────
              try:
                  with open(rel_path) as fh:
                      content = fh.read()
              except FileNotFoundError:
                  record(short, "readable", STATUS_FAIL, "file not found in working tree")
                  errors.append(f"{short}: file not found (deleted in PR?)")
                  continue

              content_upper = content.upper()

              # Comment-only view of the file, for checks that must ignore
              # anything inside a string/executable statement and only look at
              # what's documented. Strips `--` line comments and `/* ... */`
              # block comments' DELIMITERS but keeps their text, so a rollback
              # note phrased as "/* Rollback: ... */" still reads as prose.
              # Deliberately simple (line/block stripping, no dollar-quote or
              # string-literal awareness like run_migrations.py's
              # _split_sql_statements) — this
              # script only ever reads comment TEXT, never re-executes SQL, so
              # the failure mode of a naive scan is at most a missed or
              # over-eager warning, not a broken migration apply.
              comment_lines = []
              in_block_comment = False
              for line in content.splitlines():
                  stripped = line.strip()
                  if in_block_comment:
                      comment_lines.append(line)
                      if "*/" in stripped:
                          in_block_comment = False
                      continue
                  if stripped.startswith("--"):
                      comment_lines.append(line)
                  elif stripped.startswith("/*"):
                      comment_lines.append(line)
                      if "*/" not in stripped:
                          in_block_comment = True
              comment_text = "\n".join(comment_lines)

              # ── CHECK C: RLS on new tables ────────────────────────────────────
              # Two shapes both pass: (1) RLS enabled + at least one CREATE POLICY
              # (the normal case), or (2) RLS enabled + zero policies + an explicit
              # "service-role-only" marker comment — the deliberately more
              # restrictive pattern for tables only the backend service role
              # touches (which bypasses RLS by design; anon/authenticated are
              # meant to be locked out entirely). That pattern is precedented in
              # this repo (migrations 190, 319, 320) and was previously a false
              # positive here — see CR #4051. A CREATE TABLE with RLS enabled,
              # no policies, and NO marker comment still fails: the marker is
              # what proves the missing policy is intentional, not forgotten.
              has_create_table = bool(re.search(r'\bCREATE\s+TABLE\b', content, re.IGNORECASE))
              if has_create_table:
                  has_rls          = bool(re.search(r'\bROW\s+LEVEL\s+SECURITY\b', content, re.IGNORECASE))
                  has_policy       = bool(re.search(r'\bCREATE\s+POLICY\b',         content, re.IGNORECASE))
                  has_service_only = bool(re.search(r'(?:--|/\*).*service-role-only', content, re.IGNORECASE))
                  if has_rls and has_policy:
                      record(short, "RLS", STATUS_OK, "CREATE TABLE has ROW LEVEL SECURITY + CREATE POLICY")
                  elif has_rls and not has_policy and has_service_only:
                      record(short, "RLS", STATUS_OK, "CREATE TABLE has ROW LEVEL SECURITY, zero policies, marked service-role-only")
                  else:
                      missing = []
                      if not has_rls:
                          missing.append("ROW LEVEL SECURITY")
                      if not has_policy:
                          missing.append("CREATE POLICY (or a 'service-role-only' marker comment if this is intentionally policy-less)")
                      msg = f"CREATE TABLE without {' and '.join(missing)}"
                      record(short, "RLS", STATUS_FAIL, msg)
                      errors.append(f"{short}: {msg}")
              else:
                  record(short, "RLS", STATUS_OK, "no CREATE TABLE — RLS check skipped")

              # ── CHECK D: rollback comment ─────────────────────────────────────
              # Was `^--\s+[Rr]ollback:` — required an exact "Rollback:"/"rollback:"
              # immediately after `-- `. Real usage across this repo's own migrations
              # varies a lot ("Rollback plan:", "-- ROLLBACK (on paper):", "/* Rollback:
              # ... */", all-caps "-- ROLLBACK" section headers) and the strict form
              # missed most of it — confirmed 2026-08-10 (PR #3497, migration 289) and
              # by grepping the existing migrations directory. Loosened to: the word
              # "rollback" (any case) appearing at the start of a `--` or `/* */`
              # comment, anywhere in the file — matches backend/migrations/CLAUDE.md's
              # actual requirement ("put the rollback plan in a top comment"), which
              # names no specific phrasing.
              has_rollback = bool(re.search(r'(?:--|/\*)\s*rollback\b', comment_text, re.IGNORECASE))
              if has_rollback:
                  record(short, "rollback-comment", STATUS_OK, "rollback comment found")
              else:
                  msg = "missing a '-- rollback' (or '/* rollback */') comment"
                  record(short, "rollback-comment", STATUS_FAIL, msg)
                  errors.append(f"{short}: {msg}")

              # ── CHECK E: dangerous operations ─────────────────────────────────
              # Hard-fail as of CR-2026-034 Phase 1 (was warn-only). Before this
              # change, ci-guardrails.yml's separate migration-safety-gate job
              # already hard-failed the overlapping patterns here (DROP TABLE,
              # TRUNCATE, DROP COLUMN) while this check only warned on them —
              # a contradictory pass/warn-here-fail-there signal on the same
              # file. Any PR with these patterns was ALREADY blocked by that
              # other gate; this change removes the misleading warn-only echo,
              # it does not newly block anything that wasn't already blocked.
              # Pattern list and code-scanning approach below are ported
              # verbatim from ci-guardrails.yml's migration-safety-gate (not
              # re-derived) so both scanners agree while they still run as two
              # independent jobs — full consolidation into one job is
              # CR-2026-034 Phase 2, deliberately deferred (see that CR: a
              # job's `name:` is what branch-protection required-status-checks
              # matches against, and nobody has audited main's required-checks
              # list yet — C21 — so removing/renaming either job's name here
              # would risk silently breaking merge-blocking for a check that
              # can never report under its old name again).
              #
              # No inline-comment override for this check, matching
              # ci-guardrails.yml's own no-override design for this pattern
              # class: an intentional exception (e.g. CR-2026-033's DELETE FROM
              # inside a SECURITY DEFINER function body, safe because nothing
              # executes at migration-apply time) goes through a documented
              # GitHub CR + admin merge-override, not a drive-by code
              # annotation. That's a deliberately higher bar than the
              # CREATE OR REPLACE conflict check below, since this pattern
              # class is the actual data-loss risk.
              code_only_strict = strip_sql_comments(content)
              dangerous = []
              if re.search(r'\bDROP\s+TABLE\b',                    code_only_strict, re.IGNORECASE): dangerous.append("DROP TABLE — data loss risk")
              if re.search(r'\bDROP\s+COLUMN\b',                   code_only_strict, re.IGNORECASE): dangerous.append("DROP COLUMN — data loss risk")
              # TRUNCATE is handled separately below, not in this loop — see
              # the privilege-list masking right after it.
              if re.search(r'\bDELETE\s+FROM\b',                   code_only_strict, re.IGNORECASE): dangerous.append("DELETE FROM in migration — unintended data loss")
              if re.search(r'\bALTER\s+TABLE.*NOT\s+NULL\b',       code_only_strict, re.IGNORECASE): dangerous.append("Adding NOT NULL without default — locks table")
              if re.search(r'WITHOUT\s+ROWID',                     code_only_strict, re.IGNORECASE): dangerous.append("WITHOUT ROWID — irreversible schema change")
              if re.search(r'\bDROP\s+INDEX\b',                    code_only_strict, re.IGNORECASE): dangerous.append("DROP INDEX — query performance regression risk")

              # TRUNCATE gets its own check: it's the one keyword above that is
              # also a valid GRANT/REVOKE privilege name, e.g. this repo's own
              # `REVOKE INSERT, UPDATE, DELETE, TRUNCATE ON x FROM authenticated;`
              # RLS-lockdown idiom (migrations 51, 142, 151, 286, 290, 416).
              # Masking every GRANT/REVOKE ... ON clause first — a GRANT/REVOKE
              # statement always has exactly one ON separating its privilege
              # list from its target, so a non-greedy match to the first ON
              # covers the whole list regardless of TRUNCATE's position in it —
              # then scanning what's left for a bare TRUNCATE catches only an
              # actual TRUNCATE statement. Ported verbatim from
              # ci-guardrails.yml's migration-safety-gate (CR-2026-036/#5309;
              # this file's first port of CHECK E, done before that fix landed
              # there, missed this step entirely and would have hard-blocked
              # any future migration reusing the idiom above — caught by
              # spinr-cicd-infra-reviewer before this reached CI).
              code_sans_privilege_lists = re.sub(
                  r'\b(?:GRANT|REVOKE)\b.*?\bON\b', ' ',
                  code_only_strict, flags=re.IGNORECASE | re.DOTALL,
              )
              if re.search(r'\bTRUNCATE\b', code_sans_privilege_lists, re.IGNORECASE):
                  dangerous.append("TRUNCATE — data loss risk")

              if dangerous:
                  msg = f"contains destructive operation(s): {'; '.join(dangerous)} — if intentional, open a Change Request (see CR-2026-033 for the precedent) rather than editing this file to dodge the pattern"
                  record(short, "dangerous-ops", STATUS_FAIL, msg)
                  errors.append(f"{short}: {msg}")
              else:
                  record(short, "dangerous-ops", STATUS_OK, "no destructive operations")

          # ── CHECK G: CREATE OR REPLACE conflicts across migrations ────────────
          # Ported verbatim from ci-guardrails.yml's migration-safety-gate
          # (CR-2026-034 Phase 1), including its override mechanism — the only
          # one of the three checks originally unique to ci-guardrails.yml that
          # already had a built-in bypass. Only scans this PR's genuinely NEW
          # migrations (new_files_set) against every existing migration on
          # disk, same scope ci-guardrails.yml's version used (--diff-filter=A).
          COR = re.compile(
              r'CREATE\s+OR\s+REPLACE\s+(?:FUNCTION|VIEW|TRIGGER|PROCEDURE)\s+([\w.]+)',
              re.IGNORECASE,
          )
          OVERRIDE = re.compile(r'--\s*migration-override-ok\s*:', re.IGNORECASE)

          def target_name(raw: str) -> str:
              # public.foo and foo are the same object when search_path
              # includes public, so they must compare equal.
              return raw.rsplit('.', 1)[-1].lower()

          new_migration_paths = [rp for rp in changed if os.path.basename(rp) in new_files_set]

          pr_targets: dict[str, list[str]] = {}    # target_name -> [pr files defining it]
          file_targets: dict[str, list[str]] = {}  # pr file -> [target names it defines]
          overridden: set[str] = set()

          for fpath in new_migration_paths:
              try:
                  cor_content = open(fpath).read()
              except OSError:
                  continue
              # OVERRIDE checked against raw content — the annotation itself
              # lives in a comment.
              if OVERRIDE.search(cor_content):
                  overridden.add(fpath)
                  continue
              targets = COR.findall(strip_sql_comments(cor_content))
              if targets:
                  file_targets[fpath] = [target_name(t) for t in targets]
                  for t in targets:
                      pr_targets.setdefault(target_name(t), []).append(fpath)

          conflicts_by_file: dict[str, list[str]] = {}
          if pr_targets:
              new_path_set = {os.path.normpath(p) for p in new_migration_paths}
              for fname in all_migrations:
                  epath = os.path.normpath(os.path.join(MIGRATIONS_DIR, fname))
                  if epath in new_path_set:
                      continue
                  try:
                      existing_content = open(epath).read()
                  except OSError:
                      continue
                  for name in COR.findall(strip_sql_comments(existing_content)):
                      tname = target_name(name)
                      if tname in pr_targets:
                          for pf in pr_targets[tname]:
                              conflicts_by_file.setdefault(pf, []).append(f"{name} already defined in {epath}")

          for fpath in new_migration_paths:
              short = os.path.basename(fpath)
              if fpath in overridden:
                  record(short, "create-or-replace", STATUS_OK, "migration-override-ok annotation present — conflict check skipped")
              elif fpath in conflicts_by_file:
                  msg = "; ".join(conflicts_by_file[fpath]) + " — add '-- migration-override-ok: <reason>' if intentional, or rename the target"
                  record(short, "create-or-replace", STATUS_FAIL, msg)
                  errors.append(f"{short}: {msg}")
              elif fpath in file_targets:
                  record(short, "create-or-replace", STATUS_OK, f"no conflict for target(s): {', '.join(sorted(set(file_targets[fpath])))}")
              else:
                  record(short, "create-or-replace", STATUS_OK, "no CREATE OR REPLACE target")

          # ── Print summary table ───────────────────────────────────────────────
          print()
          print("=" * 72)
          print("  MIGRATION SAFETY CHECK SUMMARY")
          print("=" * 72)
          print(f"  {'File':<40} {'Check':<22} {'Result'}")
          print("-" * 72)
          for fname, check, icon, msg in rows:
              # truncate long filenames for table display
              display = fname[:38] + ".." if len(fname) > 40 else fname
              print(f"  {display:<40} {check:<22} {icon}  {msg}")
          print("=" * 72)

          if warnings:
              print()
              print(f"{YELLOW}WARNINGS ({len(warnings)}):{RESET}")
              for w in warnings:
                  print(f"  {STATUS_WARN} {w}")

          if errors:
              print()
              print(f"{RED}FAILURES ({len(errors)}) — workflow will exit 1:{RESET}")
              for e in errors:
                  print(f"  {STATUS_FAIL} {e}")
              print()
              print(f"{RED}Fix the above before merging.{RESET}")
              sys.exit(1)
          else:
              print()
              print(f"{GREEN}All hard checks passed.{RESET}")
              if warnings:
                  print(f"{YELLOW}Review warnings above before merging.{RESET}")
              sys.exit(0)

          PYEOF
        env:
          BASE_SHA: ${{ steps.changed.outputs.base_sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
