name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spinr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-locked.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # B-P1-10: install from the SHA-256 hash-pinned lockfile that ships
          # to production. --require-hashes makes pip refuse any wheel whose
          # digest doesn't match, blocking compromised mirrors / typosquats.
          # pytest-mock is now declared in requirements.in and therefore present
          # in requirements-locked.txt with a verified SHA-256 hash — no
          # separate bare `pip install pytest-mock` needed.
          pip install --require-hashes -r requirements-locked.txt

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Lint backend (ruff)
        working-directory: backend
        continue-on-error: true
        run: |
          python -m ruff --version
          python -m ruff check .
          python -m ruff format --check .

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spinr_test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_KEY: test-secret-key-for-ci
          ENV: test
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing --timeout=30 -v

      - name: Upload coverage to Codecov
        id: codecov_upload
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v6
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

      # C12 (ACTION_ITEMS.md): continue-on-error above means a rejected
      # upload (e.g. tokenless mode on a push-triggered run, no
      # CODECOV_TOKEN secret configured) still reports this job as green
      # with nothing telling you Codecov has no data for this run. This
      # step doesn't fix the underlying cause — that needs a human to add
      # CODECOV_TOKEN as a repo secret — it only stops the failure from
      # being silent. `steps.*.outcome` reflects the step's real result
      # before continue-on-error rewrites `conclusion` to success.
      - name: Flag Codecov upload failure (was previously silent)
        if: always() && steps.codecov_upload.outcome == 'failure'
        run: |
          echo "::warning title=Codecov upload failed::Coverage for this run was not recorded on Codecov (upload step failed but continue-on-error keeps this job green). See ACTION_ITEMS.md C12 — most likely cause is a missing CODECOV_TOKEN repository secret on a push-triggered run (tokenless uploads are rejected outside same-repo PRs)."
          {
            echo "### ⚠️ Codecov upload failed"
            echo ""
            echo "Coverage for this run was **not** recorded on Codecov, even though this job is green (\`continue-on-error\` masks it from the check conclusion). See \`ACTION_ITEMS.md\` **C12**."
          } >> "$GITHUB_STEP_SUMMARY"

  # Python dependency CVE audit.
  # Runs as its own job — NOT as a step inside backend-test — because a newly
  # published advisory against a pinned dependency must never gate the test
  # suite: between 2026-05-23 and 2026-06-12 an in-step pip-audit failure
  # silently skipped "Run backend tests" on every run of main and every PR.
  # The audit stays a loud, first-class failure (wired into notify-failure)
  # but tests, lint, and coverage report independently of it.
  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python dependency CVE scan
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-locked.txt

  # Frontend (Rider App) Tests
  # DISABLED: frontend/ was deprecated 2026-04-14 (Decision D-003/D-004).
  # It runs Expo SDK 54 / RN 0.81.5, one SDK behind rider-app and driver-app,
  # and has 42% screen parity with zero unique features.  Keeping it in the
  # required CI gate blocks every PR on a stale surface.  The rider-app-test
  # job covers the production mobile surface.  Re-enable or delete this job
  # once frontend/ is fully archived or removed from the repo.
  frontend-test:
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend
        run: yarn lint

      - name: Run frontend tests
        working-directory: frontend
        run: yarn test --ci --coverage --forceExit --reporters=default

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v6
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # Driver App Tests
  driver-app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: driver-app/node_modules
          # No restore-keys: a partial restore from an older key keeps a
          # node_modules with prior patch hunks already applied, then
          # patch-package fails to re-apply on top. Force a clean miss.
          key: ${{ runner.os }}-driver-node-${{ hashFiles('driver-app/yarn.lock', 'driver-app/patches/**') }}

      - name: Install dependencies
        working-directory: driver-app
        run: yarn install --frozen-lockfile

      - name: Check for exposed secrets in EXPO_PUBLIC vars
        run: |
          if grep -r "EXPO_PUBLIC_.*SECRET\|EXPO_PUBLIC_.*PRIVATE\|EXPO_PUBLIC_.*SERVICE_ROLE\|EXPO_PUBLIC_.*ANTHROPIC" \
            driver-app/.env* driver-app/app.config.ts; then
            echo "ERROR: Private key found in EXPO_PUBLIC_ variable"
            exit 1
          fi

      - name: TypeScript check
        working-directory: driver-app
        run: yarn tsc --noEmit

      - name: Run driver app tests
        working-directory: driver-app
        run: yarn test --ci --coverage --forceExit --reporters=default


      - name: Upload coverage
        id: codecov_upload
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v6
        with:
          file: ./driver-app/coverage/coverage-final.json
          flags: driver-app
          name: driver-app-coverage

      # C12 (ACTION_ITEMS.md): see backend-test's identical step above for
      # the full rationale — surfaces a silently-swallowed upload failure
      # without changing this job's overall (green) conclusion.
      - name: Flag Codecov upload failure (was previously silent)
        if: always() && steps.codecov_upload.outcome == 'failure'
        run: |
          echo "::warning title=Codecov upload failed::Coverage for this run was not recorded on Codecov (upload step failed but continue-on-error keeps this job green). See ACTION_ITEMS.md C12 — most likely cause is a missing CODECOV_TOKEN repository secret on a push-triggered run (tokenless uploads are rejected outside same-repo PRs)."
          {
            echo "### ⚠️ Codecov upload failed"
            echo ""
            echo "Coverage for this run was **not** recorded on Codecov, even though this job is green (\`continue-on-error\` masks it from the check conclusion). See \`ACTION_ITEMS.md\` **C12**."
          } >> "$GITHUB_STEP_SUMMARY"

  # Rider App Tests (dedicated app — rider-app/)
  # Note: frontend/ is the legacy combined app, still tested by frontend-test.
  # This job covers the canonical rider-app/ going forward.
  rider-app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: rider-app/node_modules
          key: ${{ runner.os }}-rider-node-${{ hashFiles('rider-app/yarn.lock', 'rider-app/patches/**') }}

      - name: Install dependencies
        working-directory: rider-app
        run: yarn install --frozen-lockfile

      - name: Check for exposed API keys in EXPO_PUBLIC vars
        run: |
          if grep -rE "EXPO_PUBLIC_(ANTHROPIC|STRIPE_SECRET|SUPABASE_SERVICE_ROLE|JWT_SECRET)" \
            rider-app/.env* rider-app/app.config.ts 2>/dev/null; then
            echo "ERROR: Private key found in EXPO_PUBLIC_ variable — never embed server-side secrets in mobile builds"
            exit 1
          fi

      - name: TypeScript check
        working-directory: rider-app
        run: yarn tsc --noEmit

      - name: Run rider app tests
        working-directory: rider-app
        run: yarn test --ci --coverage --forceExit --reporters=default

      - name: Upload coverage
        id: codecov_upload
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v6
        with:
          file: ./rider-app/coverage/coverage-final.json
          flags: rider-app
          name: rider-app-coverage

      # C12 (ACTION_ITEMS.md): see backend-test's identical step above for
      # the full rationale — surfaces a silently-swallowed upload failure
      # without changing this job's overall (green) conclusion.
      - name: Flag Codecov upload failure (was previously silent)
        if: always() && steps.codecov_upload.outcome == 'failure'
        run: |
          echo "::warning title=Codecov upload failed::Coverage for this run was not recorded on Codecov (upload step failed but continue-on-error keeps this job green). See ACTION_ITEMS.md C12 — most likely cause is a missing CODECOV_TOKEN repository secret on a push-triggered run (tokenless uploads are rejected outside same-repo PRs)."
          {
            echo "### ⚠️ Codecov upload failed"
            echo ""
            echo "Coverage for this run was **not** recorded on Codecov, even though this job is green (\`continue-on-error\` masks it from the check conclusion). See \`ACTION_ITEMS.md\` **C12**."
          } >> "$GITHUB_STEP_SUMMARY"

  # Admin Dashboard Tests
  admin-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: admin-dashboard/node_modules
          # No restore-keys: a partial restore from an older key (e.g. before
          # a dependency version bump) risks a stale node_modules that `npm
          # ci` doesn't reliably reconcile. Force a clean miss on any
          # package-lock.json change instead, matching driver-app-test's
          # existing cache convention (see its comment above).
          key: ${{ runner.os }}-admin-node-${{ hashFiles('admin-dashboard/package-lock.json') }}

      - name: Install dependencies
        working-directory: admin-dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: admin-dashboard
        run: npm run lint

      - name: Verify auth middleware is wired up
        working-directory: admin-dashboard
        run: npm run check:middleware

      - name: Run admin dashboard tests
        working-directory: admin-dashboard
        run: npm test

      - name: Build admin dashboard
        working-directory: admin-dashboard
        env:
          BACKEND_URL: https://api-spinr.spinr.ca
          NEXT_PUBLIC_API_URL: https://api-spinr.spinr.ca
        run: npm run build

  # E2E Tests — blocking on main, non-blocking on PRs while the suite stabilises ([17-1])
  e2e-test:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          BACKEND_URL: http://localhost:8000

      - name: Start Next.js and run E2E tests
        run: |
          npx next start &
          npx wait-on http://localhost:3000 --timeout 30000
          npx playwright test --project=setup --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          BACKEND_URL: http://localhost:8000
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: admin-dashboard/playwright-report/
          retention-days: 7

  # Visual regression — separate from e2e-test above and always
  # continue-on-error: no baselines are committed yet (see
  # .github/workflows/update-visual-baselines.yml), so every run currently
  # fails "no baseline found" by design. Flip continue-on-error off once
  # baselines are seeded and this should start actually gating. Runs the
  # `visual-regression` Playwright project only — explicitly excluded from
  # the e2e-test job above via playwright.config.ts's testIgnore, so it
  # can't accidentally start failing that already-meaningful job.
  visual-regression-test:
    name: Visual regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    continue-on-error: true
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `continue-on-error: true` above stops a baseline-less run blocking a
      # merge, but it does NOT stop the check reporting `failure` — so this
      # gate has been permanently red since it was added, for a reason the job
      # comment itself documents as expected. A check that is always red stops
      # being read, and then a real failure arrives looking like the noise.
      #
      # Detect the missing baselines up front and skip cleanly instead. This
      # also avoids `npm ci` + a Chromium download + a full Next.js production
      # build on every PR purely to fail at the last step.
      #
      # Seed baselines with .github/workflows/update-visual-baselines.yml; the
      # moment any `*-snapshots/*.png` is committed, every step below runs
      # exactly as before with no further change here.
      - name: Check for committed visual baselines
        id: baselines
        run: |
          COUNT=$(find e2e -type f -name '*.png' -path '*-snapshots*' 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Found $COUNT committed baseline screenshot(s) — running visual regression."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Visual regression skipped::No Playwright snapshot baselines are committed under admin-dashboard/e2e/**-snapshots/, so there is nothing to compare against. Seed them via the update-visual-baselines workflow to enable this gate."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.baselines.outputs.present == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        if: steps.baselines.outputs.present == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.baselines.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        if: steps.baselines.outputs.present == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          BACKEND_URL: http://localhost:8000

      - name: Start Next.js and run visual regression tests
        if: steps.baselines.outputs.present == 'true'
        run: |
          npx next start &
          npx wait-on http://localhost:3000 --timeout 30000
          npx playwright test --project=setup --project=visual-regression
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          BACKEND_URL: http://localhost:8000
          CI: true

      - name: Upload Playwright report
        # `always()` would also fire on the skip path, where no report exists —
        # producing the "No files were found with the provided path" warning
        # that made this job look like it ran and found nothing, rather than
        # like it never ran at all.
        if: always() && steps.baselines.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-report
          path: admin-dashboard/playwright-report/
          retention-days: 7

  # Rider App E2E — specs already existed (rider-app/e2e/*.spec.ts) but no job
  # ever ran them; blocking on main, non-blocking on PRs while it stabilises,
  # matching the admin e2e-test convention. Fully self-contained: the app is
  # exported to static web and every backend/Maps/Firebase call is mocked via
  # page.route() in the specs (see rider-app/e2e/fixtures.ts) — no live
  # backend or database needed.
  rider-app-e2e:
    name: Rider app E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [rider-app-test]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: rider-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: rider-app/node_modules
          key: ${{ runner.os }}-rider-node-${{ hashFiles('rider-app/yarn.lock', 'rider-app/patches/**') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Export Expo web build
        run: npx expo export --platform web

      - name: Run E2E tests
        # playwright.config.ts starts `npx serve dist` itself and waits for
        # it to be healthy when PLAYWRIGHT_START_SERVER is set — no manual
        # background + wait-on needed here.
        run: yarn test:e2e
        env:
          PLAYWRIGHT_START_SERVER: '1'
          PLAYWRIGHT_PORT: '3002'
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rider-app-playwright-report
          path: rider-app/playwright-report/
          retention-days: 7

  # Driver App E2E — same rationale as rider-app-e2e above.
  driver-app-e2e:
    name: Driver app E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [driver-app-test]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: driver-app/node_modules
          key: ${{ runner.os }}-driver-node-${{ hashFiles('driver-app/yarn.lock', 'driver-app/patches/**') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Export Expo web build
        run: npx expo export --platform web

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          PLAYWRIGHT_START_SERVER: '1'
          PLAYWRIGHT_PORT: '3003'
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: driver-app-playwright-report
          path: driver-app/playwright-report/
          retention-days: 7

  # Deploy Frontend — DISABLED: frontend/ deprecated 2026-04-14 (see frontend-test comment).
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-test]
    if: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build for production
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: npx expo export --platform web

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          working-directory: frontend

  # Deploy Admin Dashboard
  deploy-admin:
    runs-on: ubuntu-latest
    needs: [admin-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: admin-dashboard
        run: npm ci

      - name: Build for production
        working-directory: admin-dashboard
        run: npm run build

      - name: Scan build output for accidentally bundled secrets ([17-5])
        working-directory: admin-dashboard
        # Allowlists live in admin-dashboard/.gitleaks.toml — every entry is a
        # value Next.js generates at build time or third-party library source.
        # Read the comments there before adding to it.
        #
        # On failure, print the redacted findings. Without this the log said only
        # "leaks found: 13", which is unactionable: you cannot tell a real leak
        # from a build artefact, so the gate gets ignored or blanket-disabled.
        run: |
          GITLEAKS_VERSION=8.27.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          set +e
          ./gitleaks detect --source .next --no-git --redact \
            --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json \
            --exit-code 1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::gitleaks found secrets in the admin build output."
            python3 - <<'PY'
          import json
          for f in json.load(open("gitleaks-report.json")):
              print("  %-24s %s:%s  %s" % (f["RuleID"], f["File"], f["StartLine"], f["Match"][:100]))
          PY
          fi
          rm -f gitleaks gitleaks-report.json
          exit $RC

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          working-directory: admin-dashboard

  # Mobile Build (EAS)
  mobile-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [rider-app-test, driver-app-test]
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build]')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install rider app dependencies
        working-directory: rider-app
        run: yarn install --frozen-lockfile

      - name: Build iOS (Rider)
        working-directory: rider-app
        run: eas build --platform ios --non-interactive

      - name: Build Android (Rider)
        working-directory: rider-app
        run: eas build --platform android --non-interactive

  # Security Scan — filesystem (dependency CVEs) + secrets
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # full history required for trufflehog --since-commit

      - name: Install trufflehog v3
        run: |
          curl -sLo trufflehog.tar.gz \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.94.3/trufflehog_3.94.3_linux_amd64.tar.gz
          tar -xzf trufflehog.tar.gz trufflehog
          chmod +x trufflehog && sudo mv trufflehog /usr/local/bin/

      - name: Secrets scan
        run: |
          # On PRs use the target branch as the scan baseline; on push to main scan HEAD~1.
          BASE_REF="${{ github.base_ref }}"
          if [ -n "$BASE_REF" ]; then
            SINCE="origin/${BASE_REF}"
          else
            SINCE="HEAD~1"
          fi
          trufflehog git file://. --since-commit "$SINCE" --fail

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Docker image security scan — blocks on CRITICAL or HIGH CVEs
  docker-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-test]
    permissions:
      contents: read
      security-events: write
      packages: write    # GHCR push (main only, see "Push image to GHCR" step)
      id-token: write    # cosign keyless OIDC signing (main only)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag spinr-backend:ci-${{ github.sha }} \
            backend/

      # ── DIAGNOSTIC — CR-2026-002 / issue #3048 ──────────────────────────
      # Root cause confirmed outside CI (reproduced pip 26.2 — the exact
      # version this Dockerfile's unpinned `pip install --upgrade pip
      # setuptools` installs, per this job's own past logs — in an isolated
      # venv): pip vendors msgpack==1.1.2 and setuptools==70.3.0 internally
      # (pip/_vendor/vendor.txt) and ships its own CycloneDX SBOM describing
      # them, pip/_vendor/bom.cdx.json, listing exactly those two versions
      # with proper pkg:pypi/... purls. Trivy auto-detects any *.cdx.json/
      # *.spdx.json file inside a scanned image and — per its own printed
      # warning, "Third-party SBOM may lead to inaccurate vulnerability
      # detection" — prefers that file's component list over its own live
      # filesystem scan for vulnerability matching, even though the live
      # scan (used for the per-file inventory table) correctly shows the
      # real top-level msgpack==1.2.1 / setuptools==83.0.0 as clean. Fixed
      # below via `skip-files` on both trivy-action steps, targeting that
      # one file. This diagnostic step is kept, not removed, to prove the
      # fix on this very run: after the fix, its bom.cdx.json group should
      # still show the file exists (skip-files doesn't touch the image,
      # only what Trivy reads), while the scan below should no longer flag
      # it. If the finding persists after this PR, the printed groups below
      # are the first thing to check. Never fails the job — diagnostic only.
      - name: "DIAGNOSTIC (CR-2026-002): confirm pip's vendored CycloneDX SBOM"
        continue-on-error: true
        run: |
          IMG=spinr-backend:ci-${{ github.sha }}

          echo "::group::pip list — authoritative installed versions"
          docker run --rm --entrypoint sh "$IMG" -c \
            "pip list 2>/dev/null | grep -Ei '^(msgpack|setuptools|pip)[[:space:]]'" || true
          echo "::endgroup::"

          echo "::group::every msgpack/setuptools metadata dir on the filesystem"
          docker run --rm --entrypoint sh "$IMG" -c \
            "find / -xdev \( -iname 'msgpack*' -o -iname 'setuptools*' \) \
               \( -name '*.dist-info' -o -name '*.egg-info' \) -print 2>/dev/null" || true
          echo "::endgroup::"

          echo "::group::pip's vendored packages — pip bundles its own msgpack/setuptools"
          docker run --rm --entrypoint sh "$IMG" -c \
            "cat /usr/local/lib/python3.12/site-packages/pip/_vendor/vendor.txt 2>/dev/null" || true
          echo "::endgroup::"

          echo "::group::pip's embedded CycloneDX SBOM — the actual finding source"
          docker run --rm --entrypoint sh "$IMG" -c \
            "find / -xdev -iname '*.cdx.json' -o -iname '*.spdx.json' 2>/dev/null" || true
          docker run --rm --entrypoint sh "$IMG" -c \
            "cat /usr/local/lib/python3.12/site-packages/pip/_vendor/bom.cdx.json 2>/dev/null | \
             python3 -c 'import json,sys; d=json.load(sys.stdin); [print(c[\"name\"], c[\"version\"]) for c in d.get(\"components\",[]) if c[\"name\"] in (\"msgpack\",\"setuptools\")]' 2>/dev/null" || true
          echo "::endgroup::"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: spinr-backend:ci-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          # CR-2026-002 / #3048: excludes pip's own embedded CycloneDX SBOM
          # (describes pip's internally vendored msgpack/setuptools copies,
          # never imported by the app) — see diagnostic step above for the
          # confirmed root cause. Trivy's per-file inventory of the real
          # top-level packages is unaffected; this only stops it from also
          # trusting this one third-party SBOM's component list.
          skip-files: '**/pip/_vendor/bom.cdx.json'

      - name: Upload SARIF report
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: spinr-backend:ci-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          ignore-unfixed: true
          skip-files: '**/pip/_vendor/bom.cdx.json'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload image scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: 'trivy-image.sarif'

      # INF-006: Sign the image with cosign (keyless, OIDC-based Sigstore).
      # Only runs on main so feature-branch builds don't require GHCR push
      # permissions. The signature is written to the registry alongside the
      # image and can be verified with:
      #   cosign verify ghcr.io/${{ github.repository }}/spinr-backend:latest \
      #     --certificate-identity-regexp 'github.com/srikumarimuddana-lab/spinrvm' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag spinr-backend:ci-${{ github.sha }} \
            ghcr.io/${{ github.repository }}/spinr-backend:${{ github.sha }}
          docker tag spinr-backend:ci-${{ github.sha }} \
            ghcr.io/${{ github.repository }}/spinr-backend:latest
          docker push ghcr.io/${{ github.repository }}/spinr-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/spinr-backend:latest

      - name: Sign image with cosign (keyless OIDC)
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/spinr-backend:${{ github.sha }}

  # Post-deploy smoke test
  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    # Previously `needs: [deploy-backend]`. That job deployed to Railway with a
    # Render fallback and had been failing since at least 2026-07-28, so this
    # smoke test — the only thing that verifies production is actually healthy
    # after a merge — was SKIPPED on every push to main for that whole period.
    # The real deploy happens in deploy-fly.yml (green throughout), so nothing
    # was broken; nothing was being checked either.
    #
    # Ordering caveat, stated plainly: `needs: [backend-test]` does not mean
    # "after the Fly deploy finished". Fly deploys from a separate workflow, so
    # this job can start before that rollout completes and would then be
    # checking the PREVIOUS revision. It is therefore a production-health
    # canary, not proof that this specific commit is live. Making it the latter
    # requires moving it into deploy-fly.yml or triggering it via `workflow_run`
    # — a deliberate change to the production deploy path, deliberately not
    # bundled into this cleanup.
    needs: [backend-test]
    if: github.ref == 'refs/heads/main'
    env:
      # api-spinr.spinr.ca is the Cloudflare CNAME users actually hit
      # (CLAUDE.md Deployment, ADR-007), so it is what a health check should
      # target. It was previously the *fallback*, behind RAILWAY_PUBLIC_URL —
      # which is wrong now that Railway is the deliberately-paused standby
      # (ACTION_ITEMS C5): hitting it directly would have health-checked a
      # stale build and reported it as production.
      BASE: https://api-spinr.spinr.ca
      LEGACY: ${{ secrets.RAILWAY_PUBLIC_URL }}
    steps:
      - name: Resolve live base URL
        id: resolve
        run: |
          # Public CNAME first — that is the surface users reach. Only fall
          # back to the legacy Railway URL if the CNAME is unreachable, so a
          # DNS/routing failure still gets *some* signal rather than none.
          if curl -sf --retry 3 --retry-delay 5 "$BASE/health" > /dev/null; then
            echo "url=$BASE" >> "$GITHUB_OUTPUT"
          elif [ -n "$LEGACY" ] && curl -sf --retry 2 --retry-delay 3 "$LEGACY/health" > /dev/null; then
            echo "::warning::Public CNAME $BASE did not respond; falling back to the legacy Railway URL. Routing may be degraded."
            echo "url=$LEGACY" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither $BASE nor the legacy URL responded to /health."
            exit 1
          fi

      - name: Health check — confirm 200 + DB reachable
        # /health performs a real DB readiness ping (F1): a dead-DB deploy
        # returns 503 (curl -sf fails) or status!=healthy, turning this red.
        run: |
          BODY=$(curl -sf --retry 3 --retry-delay 5 "${{ steps.resolve.outputs.url }}/health")
          echo "$BODY"
          echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('status') in ('ok','healthy'), f'bad status: {d}'; assert d.get('db', {}).get('status') == 'ok', f'DB not ready: {d}'"

      - name: Settings endpoint — confirm 200 + JSON
        run: |
          curl -sf "${{ steps.resolve.outputs.url }}/api/v1/settings" | \
            python3 -c "import json,sys; json.load(sys.stdin)"

      - name: Vehicle types endpoint — confirm 200 + non-empty list
        run: |
          BODY=$(curl -sf "${{ steps.resolve.outputs.url }}/api/v1/vehicle-types")
          echo "$BODY"
          echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d) > 0, 'vehicle-types list is empty'"

      - name: Auth middleware — confirm 401 not 500 on protected endpoint
        # Verifies the auth middleware is wired: unauthenticated access to a
        # protected route must return 401, not 500 (misconfigured JWT secret
        # or missing middleware would return 500).
        #
        # GET /api/v1/rides/active — not bare /api/v1/rides, which is POST-only
        # (booking). FastAPI answers a method mismatch with 405 from the routing
        # layer *before* dependencies run, so probing it tested nothing about
        # auth. 404/405 are called out separately below: they mean this probe's
        # path drifted from the router, not that auth broke.
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ steps.resolve.outputs.url }}/api/v1/rides/active")
          echo "GET /api/v1/rides/active → HTTP $STATUS"
          case "$STATUS" in
            401|403) ;;
            404|405)
              echo "FAIL: got $STATUS — the probe path no longer matches a protected GET route."
              echo "      Auth was NOT exercised. Re-point this probe, don't relax the assertion."
              exit 1 ;;
            *)
              echo "FAIL: expected 401/403, got $STATUS — auth middleware may be misconfigured"
              exit 1 ;;
          esac

      - name: Fare service — confirm 401 not 500 on fare estimate
        # Verifies the fare service is mounted and responding (not crashed):
        # unauthenticated request must return 401, not 500 or 404.
        #
        # POST /api/v1/rides/estimate — the real fare-estimate route. The old
        # probe used GET /api/v1/fares/estimate, which has never existed
        # (fares.py exposes GET /fares and GET /vehicle-types); it only stayed
        # green because the step above it failed first and skipped this one.
        # 422 is accepted because the empty body is invalid, but auth resolves
        # first so 401 is the expected answer.
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "${{ steps.resolve.outputs.url }}/api/v1/rides/estimate")
          echo "POST /api/v1/rides/estimate → HTTP $STATUS"
          case "$STATUS" in
            401|403|422) ;;
            404|405)
              echo "FAIL: got $STATUS — the fare-estimate route is unregistered or the path drifted."
              exit 1 ;;
            *)
              echo "FAIL: expected 401/403/422, got $STATUS — fare service may be down"
              exit 1 ;;
          esac

  # Notify on failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: [backend-test, rider-app-test, driver-app-test, admin-test, python-dependency-audit]
    if: failure()

    steps:
      - name: Send Slack notification
        # continue-on-error so a missing/invalid SLACK_WEBHOOK secret does not
        # itself count as a CI failure and obscure the real upstream failures.
        continue-on-error: true
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: 'CI/CD Pipeline Failed'

      - name: Summarise failed jobs (fallback when Slack is unconfigured)
        if: always()
        run: |
          echo "::warning::One or more CI jobs failed. Configure SLACK_WEBHOOK in repo secrets for Slack alerts."
          echo "Failed needs: backend-test, rider-app-test, driver-app-test, admin-test, or python-dependency-audit"
