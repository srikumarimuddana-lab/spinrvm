# Standalone Fly app for ADR-010's metrics-aggregation MVP (Option B).
# Deliberately NOT colocated with backend/fly.toml — see
# metrics-agent/README.md for the Option A vs. B tradeoff (issue #3295).
#
# Grafana (port 3000) is exposed publicly via [http_service] below — a
# deliberate choice made 2026-09-25 so it's reachable from any browser
# without a Fly account or `fly proxy` (see README "Logs & Grafana" /
# "Open Grafana" for the tradeoff and what it's gated by). Alloy's own
# UI/health port (:12345) and Loki (127.0.0.1:3100 only, no auth of its
# own) are NOT exposed — [http_service] forwards only to Grafana's port,
# and Grafana is the only process here with its own login (admin/password;
# anonymous access and sign-up are both disabled in entrypoint.sh).
app = "spinr-metrics-agent-yyz"
primary_region = "yyz"
kill_signal = "SIGTERM"
kill_timeout = "15s"
# Backstop for the 1 GB VM below: a memory spike slows the machine down
# instead of OOM-killing it (and Alloy/metrics with it). The Go processes
# also have soft GOMEMLIMIT caps set in entrypoint.sh.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  # Name of the backend Fly app to discover/scrape. Matches
  # backend/fly.toml's `app = "spinr-backend-yyz"`.
  BACKEND_APP_NAME = "spinr-backend-yyz"
  DISCOVERY_INTERVAL_SECONDS = "30"
  # Log stack (README "Logs & Grafana"). Kill switch: set to "false" (here, or
  # `fly secrets set LOGS_STACK_ENABLED=false`, which overrides [env]) to run
  # metrics only — no code revert needed.
  LOGS_STACK_ENABLED = "true"
  # Fly org slug whose log stream Vector reads. Taken from
  # infra/burst_controller/fly.toml's FLY_ORG; confirm with `fly orgs list`.
  LOG_STREAM_ORG = "spinr_backend"

# Public entrypoint for Grafana only (see header comment). auto_stop/start
# are both pinned off/false — this machine must keep scraping and ingesting
# logs continuously regardless of HTTP traffic to Grafana, unlike a normal
# request-driven service.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

# Secrets (set via `fly secrets set -a spinr-metrics-agent-yyz`, never in
# this file): METRICS_AUTH_TOKEN, GRAFANA_REMOTE_WRITE_URL,
# GRAFANA_REMOTE_WRITE_USERNAME, GRAFANA_REMOTE_WRITE_API_KEY.
# Log stack secrets: LOG_STREAM_ACCESS_TOKEN, GRAFANA_ADMIN_PASSWORD, and
# optionally GRAFANA_CLOUD_METRICS_READ_TOKEN (see README "Logs & Grafana").
# Server-metrics secret: FLY_METRICS_READ_TOKEN (optional; see README
# "Server metrics (Fly Prometheus)") -- Fly's own hosted Prometheus, not a
# new exporter.
# See metrics-agent/README.md for the exact commands and where each value
# comes from.

# 7 days of Fly logs (Loki) + Grafana's own database. The volume must exist
# BEFORE this config is deployed — see README "Logs & Grafana" for the
# one-time create/replace-machine steps. Alloy does not use /data, so a full
# log volume cannot stop metrics.
[mounts]
  source = "fly_logs"
  destination = "/data"

[[vm]]
  # Smallest available size — this process only scrapes and forwards, no
  # request handling, no DB connections. Revisit if Alloy's own memory
  # footprint (WAL buffering for remote_write) proves tight at this
  # metric volume; not measured yet (see PR body "What was NOT verified").
  #
  # Raised 512mb -> 1gb when Loki, Vector and Grafana were added alongside
  # Alloy on this machine. Typical idle total is ~400-600MB (estimate, not
  # measured); per-process GOMEMLIMIT caps are in entrypoint.sh. If
  # `fly logs` shows OOM restarts, raise to 2gb.
  size = "shared-cpu-1x"
  memory = "1gb"

[[restart]]
  policy = "always"
