name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - main

# Serialize deploys: rapid successive merges otherwise launch overlapping
# `flyctl deploy` runs against the same app. A run whose SHA stops being main
# while its gate is waiting is superseded: the gate job exits cleanly with
# deploy=false, the deploy job is skipped (no secrets staged, no release), and
# the run for the newer main commit owns the deploy (newest wins). A newer
# commit landing after the gate has passed does not stop this deploy; the
# newer run is queued behind it and redeploys next (redundant, never out of
# order: the group holds at most one queued run, always the newest push).
# Every main push triggers this workflow: a docs-only push can advance main
# while an older backend deploy waits for CI, and must start a fresh exact-SHA
# deploy.
concurrency:
  group: deploy-fly-spinr-backend-yyz
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

# Fly.io runs the backend in yyz (Toronto) alongside Railway. Both providers
# deploy from main in parallel so the Fly app never drifts behind the primary.
# See docs/runbooks/railway-fly-failover.md and docs/adr/007-fly-primary-railway-standby.md.
#
# Authentication setup (one-time):
#   1. Install flyctl locally, then: fly tokens create deploy -a spinr-backend-yyz
#      (a deploy-scoped token, NOT a personal/org-wide token).
#   2. GitHub → repo → Settings → Secrets → Actions → FLY_API_TOKEN = <token>
#   3. GitHub → repo → Settings → Secrets → Actions → SENTRY_DSN = <Sentry DSN>
#      (important: DSN, not DNS). The workflow stages it into Fly secrets before
#      deploying so the backend can initialize Sentry at startup.
#
# Production secrets required: FLY_HEALTH_URL must be exactly
# https://spinr-backend-yyz.fly.dev, METRICS_AUTH_TOKEN must authorize /deploy-info,
# FLY_API_TOKEN must deploy this Fly app, and SENTRY_DSN must initialize Sentry.
# Missing probe configuration blocks the job before any Fly secret is staged.

jobs:
  # Exit 0 + deploy=true: exact-SHA evidence passed and this SHA is still main.
  # Exit 0 + deploy=false: superseded by a newer main commit (not a failure).
  # Exit 1: denied (required workflow/job failed while this SHA is main,
  # evidence mismatch, timeout, or API error).
  gate:
    name: Exact-SHA deploy gate
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Wait for exact-SHA backend and security gates
        id: gate
        run: python3 scripts/fly_deploy_gate.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Fly.io
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      FLY_APP: spinr-backend-yyz
      FLY_HEALTH_URL: ${{ secrets.FLY_HEALTH_URL }}
      METRICS_AUTH_TOKEN: ${{ secrets.METRICS_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A re-run of only this job reuses the cached gate output without
      # re-running the gate; on attempt 2+ confirm this SHA is still main.
      - name: Confirm a re-run is still the newest main commit
        run: python3 scripts/fly_deploy_gate.py --check-still-main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production probe configuration
        run: python3 scripts/fly_deploy_gate.py --check-probes
        env:
          FLY_HEALTH_URL: ${{ secrets.FLY_HEALTH_URL }}
          METRICS_AUTH_TOKEN: ${{ secrets.METRICS_AUTH_TOKEN }}

      - name: Verify FLY_API_TOKEN is set
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::error title=Missing secret::FLY_API_TOKEN is not set."
            echo ""
            echo "Create one with: fly tokens create deploy -a spinr-backend-yyz"
            echo "Then: GitHub → repo → Settings → Secrets → FLY_API_TOKEN"
            exit 1
          fi
          echo "FLY_API_TOKEN is set (length=${#FLY_API_TOKEN})."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (2026-08-18)

      - name: Show flyctl version
        run: flyctl version

      # Check before staging secrets or deploying; legacy app=8 needs migration.
      - name: Validate mixed fleet inventory
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_fly_fleet_preflight.py
          flyctl machine list -a "${FLY_APP}" --json | python3 scripts/fly_fleet_preflight.py
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify SENTRY_DSN is set
        run: |
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::error title=Missing secret::SENTRY_DSN is not set."
            echo ""
            echo "Create it in GitHub with the Sentry project DSN:"
            echo "GitHub → repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: SENTRY_DSN (not SENTRY_DNS)"
            exit 1
          fi
          echo "SENTRY_DSN is set (length=${#SENTRY_DSN})."
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Keep the Sentry DSN out of git and fly.toml. Stage it as a Fly runtime
      # secret immediately before deploy; `flyctl deploy` will create the release
      # that exposes SENTRY_DSN to the backend process.
      - name: Stage Sentry DSN in Fly secrets
        run: flyctl secrets set SENTRY_DSN="${SENTRY_DSN}" --stage -a "${FLY_APP}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Stamp the commit into the image so the running replica can report it
      # (backend/utils/build_info.py → GET /deploy-info). The standby-parity
      # monitor compares this against Railway's to detect standby drift
      # (ACTION_ITEMS.md C5). Written into backend/ = the Docker build context.
      - name: Stamp build info
        run: |
          printf '{"sha":"%s","ref":"%s","built_at":"%s","provider":"fly"}\n' \
            "${GITHUB_SHA}" "${GITHUB_REF}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > backend/build_info.json
          cat backend/build_info.json

      # Rolling deploy (strategy=rolling, max_unavailable=1 in fly.toml). New
      # machines must pass the /health check before old ones are replaced, so a
      # bad deploy cannot take the app down — flyctl exits non-zero and the job
      # fails with the previous release still serving.
      #
      # Run from backend/ so the Docker build context is backend/ — fly deploy
      # uses the working directory as the build context, and the root Dockerfile
      # COPYs a root requirements.txt that does not exist (only backend/ has one).
      - name: Deploy to Fly.io
        working-directory: backend
        run: flyctl deploy --remote-only --config fly.toml --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Explicit group counts preserve VM sizes across deployments. Preflight
      # rules out excess capacity so this step only fills missing Machines.
      - name: Ensure mixed pool (2 warm 4 GB + 6 burst 2 GB)
        run: flyctl scale count app=2 burst=6 --region yyz -a "${FLY_APP}" --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Poll /ready for up to 3 minutes (18 × 10 s) on the Fly app domain.
      #
      # /ready, NOT /health: this is a deploy gate, so it must fail when the new
      # build cannot reach Supabase (F1's original protection). /health is now
      # liveness only and returns 200 with db.status=degraded in that case, so
      # polling it here would happily promote a dead-DB build. See the probe
      # block comment in backend/server.py.
      - name: Readiness check
        id: health
        run: |
          echo "Polling ${FLY_HEALTH_URL}/ready …"
          for i in $(seq 1 18); do
            STATUS=$(curl -sf --max-time 5 "${FLY_HEALTH_URL}/ready" \
              -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
            echo "  attempt ${i}/18 → HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Readiness check timed out after 3 minutes."
          echo "Fly keeps the previous release in traffic on a failed rolling deploy."
          echo "Inspect with: flyctl status -a spinr-backend-yyz && flyctl logs -a spinr-backend-yyz"
          exit 1

      # A green /ready only proves *something* is serving. This proves it is
      # THIS commit: /deploy-info returns the build stamp written above.
      - name: Verify the deployed build SHA is serving
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            running=$(curl -sf --max-time 5 -H "Authorization: Bearer ${METRICS_AUTH_TOKEN}" \
              "${FLY_HEALTH_URL}/deploy-info" | jq -r '.build.sha // empty' 2>/dev/null || true)
            echo "  attempt ${i}/12 → running sha: ${running:-<none>}"
            if [ "${running}" = "${GITHUB_SHA}" ]; then
              echo "Fly is serving ${GITHUB_SHA}."
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Stale build serving::Fly /deploy-info reports sha '${running:-<none>}', expected ${GITHUB_SHA}. Inspect with: flyctl releases -a ${FLY_APP}"
          exit 1
