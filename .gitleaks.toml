# .gitleaks.toml — Spinr secret-scanning allowlist
# Purpose: suppress false positives during device testing without disabling the scanner.
# Review before pre-production hardening phase — tighten or remove entries that no longer apply.

title = "Spinr Gitleaks Config"

# CRITICAL — do not remove. Passing --config makes gitleaks REPLACE its built-in
# ruleset, it does not merge. Without this stanza the file below defines an
# allowlist and *no rules at all*, so every scan using it loads zero detectors and
# reports "no leaks found" for anything — including a plaintext AWS key or an
# sk_live_ Stripe key. That was the state until 2026-07-30, which made both the
# G5a history scan and the G5b bundle scan in security-gates.yml vacuous while
# reporting green. Verified with a canary file: without this, 0 findings; with it,
# the same file reports 2.
[extend]
useDefault = true

# NOT the only gitleaks config in the repo. `admin-dashboard/.gitleaks.toml`
# covers the ci.yml `deploy-admin` build-output scan, which needs
# `[[allowlists]]` blocks that cannot be added here: gitleaks rejects a config
# mixing `[allowlist]` (used below) with `[[allowlists]]`, and 8.18.4 — pinned
# by G5b — silently ignores `[[allowlists]]` entirely, so converting this file
# would fail open and disarm every suppression below. See that file's header
# for the verification. Revisit once G5a/G5b are on a pinned >= 8.19.
[allowlist]
description = "Dev testing false-positive suppressions"

# Never scan local env files.
#
# Build-artefact directories were removed from this list on 2026-07-30. They
# protected nothing — `git log --diff-filter=A` shows zero files under .next/,
# node_modules/, dist/, build/ or coverage/ have ever been committed, and each is
# gitignored (e.g. admin-dashboard/.gitignore:17 for /.next/) — while '''\.next/'''
# actively defeated the G5b gate, whose entire job is scanning
# admin-dashboard/.next/static for NEXT_PUBLIC_* secrets baked into the shipped
# bundle. With that entry present, G5b could not report a finding by construction.
# Re-add a path here only with evidence it suppresses a real false positive.
paths = [
  '''.env\.local''',
  '''.env\.\w+\.local''',
  # Committed Metro bundler cache from the retired `frontend/` surface. These are
  # binary-ish build-cache blobs full of high-entropy hashes: they account for
  # 44,487 of the 44,492 findings on a full-history scan, every one of them
  # gitleaks' `generic-api-key` entropy heuristic firing on a cache key. Excluding
  # them is what makes a history scan readable at all. (The directory should not
  # be in git; removing it is tracked separately.)
  '''\.metro-cache/''',
]

# Placeholder / test-fixture key patterns used in settings forms and test files
regexes = [
  # Stripe publishable test keys used in admin settings form fixtures (safe — intentionally client-exposed)
  '''pk_test_[A-Za-z0-9]{10,}''',
  # Stripe secret test keys in test fixtures ONLY — real sk_live_ are never allowed
  '''sk_test_[A-Za-z0-9]{10,}''',
  # Generic placeholder values in comments or example configs
  '''(YOUR_|REPLACE_ME|example_|placeholder_|test_key_|dummy_)[A-Za-z0-9_-]{4,}''',
  # Expo public env vars (safe — intentionally client-exposed by design)
  '''EXPO_PUBLIC_[A-Z_]+=.+''',
]

# aws-access-token override — the upstream rule (id/description/regex/keywords
# copied verbatim from the embedded default config, `strings` on the gitleaks
# binary) has no entropy floor, so it fires on any 20-char run starting with
# AKIA/ASIA/ABIA/ACCA/A3T[0-9A-Z] regardless of randomness. G5b (admin-dashboard
# bundle scan) hit this on minified webpack chunks that embed base64-ish binary
# tables (font/icon data) — low-entropy repeating byte patterns coincidentally
# start with the `ABIA` prefix. Confirmed false positive by reproducing locally
# against admin-dashboard/.next/static with the real gitleaks binary: both
# matches scored entropy 2.1–2.5, well below a real random AWS key ID's ~4+.
# `entropy = 3.5` matches gitleaks' own default for generic-api-key, a rule with
# the same false-positive-prone shape. This does not touch detection of real,
# random AWS credentials anywhere else in the repo (source, env files, git
# history) — only the coincidental low-entropy shape.
[[rules]]
id = "aws-access-token"
description = "Identified a pattern that may indicate AWS credentials, risking unauthorized cloud resource access and data breaches on AWS platforms."
regex = '''(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}'''
entropy = 3.5
keywords = [
    "akia", "asia", "abia", "acca",
]

# Canadian SIN / bank-account PII detector — added following the P0 incident (#4547):
# driver_bank_sin_migration.sql / driver_csv_migration.sql were committed at the repo root
# with real, plaintext SIN, bank account/transit/institution numbers, DOBs, and home
# addresses for 157 drivers, live on `main` for 11 days before discovery. gitleaks' built-in
# ruleset (extended via [extend] above) targets API-key/secret *shapes* — it has no
# government-ID/PII detector, so this class of leak was invisible to it. This rule is the
# CI backstop for that gap; see backend/migrations/CLAUDE.md's "One-off data-migration
# scripts" section for the corresponding process fix (never commit real PII in the first
# place — this is a safety net, not a substitute for that).
#
# A bare 9-digit number alone is too common to flag on its own (postal codes, truncated
# timestamps, arbitrary IDs) — that would be noise, not signal. Gitleaks only runs a rule's
# regex against a file that contains at least one of its `keywords` (case-insensitive
# substring, anywhere in the file), so this only fires in files that also name one of the
# actual PII column identifiers the incident file used. A file naming a SIN/bank column
# *and* carrying bare 9-digit literals is exactly the shape of the incident file — worth a
# human's 30-second look even on an occasional false positive (e.g. a 9-digit test ID in a
# file that separately mentions `account_number` in an unrelated comment). No real false
# positives observed yet since this is new — tune keywords/regex if any show up in practice.
[[rules]]
id = "spinr-sin-bank-pii"
description = "Possible Canadian SIN or bank account/transit/institution number literal alongside a PII column identifier — verify this isn't real driver/rider data before merging."
regex = '''['"]?\b\d{9}\b['"]?'''
keywords = [
    "sin_raw", "sin_number", "social_insurance_number", "social_insurance_no",
    "account_number", "institute_number", "institution_number", "transit_number",
]

# Driver-migration CSV-dump PII detector — widening the #4547 backstop above to
# cover the incident's *second* file (#4596, driver_csv_migration.sql, 189
# drivers). That file's PII column shape (name/email/phone/license_number/
# latitude/longitude) has no SIN/bank/institution keyword, so spinr-sin-bank-pii
# never matched it — it went undetected from 2026-08-16 until a later manual
# audit found it (see docs/audit/breach-record.md Incident 1). The signal this
# rule keys on isn't the column names alone (too common — "email"/"phone" would
# gate almost every file in the repo and provide no real filtering), it's an
# *email-address literal* appearing inside a `INSERT INTO ...driver...` SQL
# statement — application code never embeds a literal PII email in a committed
# SQL string; only a hand-authored one-off data-migration dump does. `[\s\S]`
# (not `(?s)`) lets the match span the newlines inside a multi-line INSERT/
# VALUES statement without needing a Go regex mode flag. As with
# spinr-sin-bank-pii, an occasional false positive (a fixture/seed file with a
# literal test email inside a driver-table INSERT) is an accepted trade-off —
# worth a human's 30-second look, per backend/migrations/CLAUDE.md's "One-off
# data-migration scripts" section.
#
# {0,800} not {0,4000}: gitleaks compiles rules with Go's RE2 engine, which
# caps repetition counts at 1000 by default — {0,4000} fails the whole
# binary at startup ("invalid repetition size"), taking every other rule
# down with it, not just this one. Caught via CI's G5a run on this rule's
# own PR (#4735). 800 chars comfortably covers the real incident file (322
# chars from `INSERT INTO driver_csv_import (...)` to its first embedded
# email literal, measured directly against the breach-start commit) while
# staying well under RE2's limit.
[[rules]]
id = "spinr-driver-csv-pii"
description = "Possible driver PII data dump (literal email address inside an INSERT INTO ...driver... statement) — verify this isn't a real committed migration export before merging."
regex = '''(?i)insert\s+into\s+\w*driver\w*[\s\S]{0,800}?['"][^'",]*@[^'",]*\.[^'",]{2,}['"]'''
keywords = [
    "insert into", "license_number", "driver_csv_import", "driver_bank_sin_migration",
]
