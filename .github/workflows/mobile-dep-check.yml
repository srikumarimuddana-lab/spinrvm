name: Mobile Dependency Health

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'rider-app/package.json'
      - 'rider-app/yarn.lock'
      - 'driver-app/package.json'
      - 'driver-app/yarn.lock'
  push:
    branches: [main]
    paths:
      - 'rider-app/package.json'
      - 'driver-app/package.json'

env:
  # Node >=22: engines floor of @supabase/supabase-js@2.112.x and react-native@0.87 (CR #4551)
  NODE_VERSION: '22'

jobs:
  rider-app-dep-check:
    name: rider-app — Expo dep audit + TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # restore/save are split (2026-08-28) instead of the single cache action:
      # the combined action saves node_modules in a POST step, i.e. after every
      # later step has run — and `expo install --check` below can mutate
      # node_modules (it runs the package manager when it applies SDK version
      # fixes; `jest` is in expo.install.exclude but its dependents are not).
      # One such post-mutation save is how the shared rider-node cache was
      # poisoned with a mixed jest 30.4.x/30.3.0 tree that broke every
      # rider-app-test run repo-wide, main included (2026-08-28; fixed in the
      # PR that pinned jest to exact 30.3.0). Saving explicitly right after the
      # clean frozen install captures only a lockfile-faithful tree.
      - name: Restore rider-app node_modules cache
        id: rider-node-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: rider-app/node_modules
          # Include patches/** in the key so changes to patch-package files
          # invalidate the cache (otherwise stale node_modules retains
          # already-applied hunks → patch-package fails to re-apply on top).
          #
          # v2- bump (2026-09-05, CR-2026-031): orphans a stale/poisoned entry
          # under this same key (missing @sentry/replay sub-packages despite
          # yarn.lock being correct since PR #4921) that was still failing
          # mobile-bundle-smoke.yml and both Playwright E2E jobs, which share
          # this exact key. Drop the prefix once confirmed stable.
          key: ${{ runner.os }}-v2-rider-node-${{ hashFiles('rider-app/yarn.lock', 'rider-app/patches/**') }}
          # No restore-keys: a partial restore from an older key gives us a
          # node_modules that already has prior patch hunks applied, then
          # patch-package fails to re-apply on top. Force a clean miss when
          # the key changes — slow once, correct always.

      - name: Install dependencies
        working-directory: rider-app
        run: yarn install --frozen-lockfile

      - name: Save rider-app node_modules cache (pre-mutation)
        if: steps.rider-node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: rider-app/node_modules
          key: ${{ runner.os }}-v2-rider-node-${{ hashFiles('rider-app/yarn.lock', 'rider-app/patches/**') }}

      - name: Expo dependency version audit
        working-directory: rider-app
        # Fails if any installed package version drifts from the SDK-expected version.
        # expo.install.exclude in package.json protects intentionally-pinned packages.
        # continue-on-error: expo install --check requires Expo API access (EXPO_TOKEN);
        # without it the CLI returns non-JSON and exits 1. We degrade gracefully so the
        # TypeScript check below always runs regardless.
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo install --check

      - name: TypeScript check
        working-directory: rider-app
        run: yarn tsc --noEmit

  driver-app-dep-check:
    name: driver-app — Expo dep audit + TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Same restore/save split as the rider job above — never let the
      # post-`expo install --check` tree be what gets cached.
      - name: Restore driver-app node_modules cache
        id: driver-node-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: driver-app/node_modules
          # v2- bump (2026-09-05, CR-2026-031): same stale/poisoned-cache fix
          # as the rider-app key above — see that comment for the full story.
          key: ${{ runner.os }}-v2-driver-node-${{ hashFiles('driver-app/yarn.lock', 'driver-app/patches/**') }}

      - name: Install dependencies
        working-directory: driver-app
        run: yarn install --frozen-lockfile

      - name: Save driver-app node_modules cache (pre-mutation)
        if: steps.driver-node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: driver-app/node_modules
          key: ${{ runner.os }}-v2-driver-node-${{ hashFiles('driver-app/yarn.lock', 'driver-app/patches/**') }}

      - name: Expo dependency version audit
        working-directory: driver-app
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo install --check

      - name: TypeScript check
        working-directory: driver-app
        run: yarn tsc --noEmit

  os-target-check:
    name: iOS/Android minimum target audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify iOS minimum target is explicitly set (rider-app)
        run: |
          if ! grep -q "minimumOsVersion" rider-app/app.config.ts; then
            echo "ERROR: rider-app/app.config.ts is missing minimumOsVersion."
            echo "SDK upgrades silently change the iOS floor — pin it explicitly."
            exit 1
          fi

      - name: Verify iOS minimum target is explicitly set (driver-app)
        run: |
          if ! grep -q "minimumOsVersion" driver-app/app.config.ts; then
            echo "ERROR: driver-app/app.config.ts is missing minimumOsVersion."
            exit 1
          fi

      - name: Verify no package-lock.json in mobile apps (project uses yarn)
        run: |
          if [ -f rider-app/package-lock.json ] || [ -f driver-app/package-lock.json ]; then
            echo "ERROR: package-lock.json found in a yarn-managed app."
            echo "Delete it and commit the removal — having both lockfiles causes split installs."
            exit 1
          fi
