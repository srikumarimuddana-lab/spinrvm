name: Test Environment CI/CD

# Triggers on push to develop branch and PRs to develop
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  PYTHON_VERSION: '3.12'
  # 22, not 20: build-mobile-test/ota-update-test below both run "Setup EAS"
  # (expo/expo-github-action, eas-version: latest), which always pulls
  # eas-cli's current dependency tree — @oclif/plugin-autocomplete bumped its
  # own engines.node to >=22.0.0 in 3.3.0, independent of eas-cli's own
  # (unchanged) >=20.0.0 requirement, and yarn classic hard-fails that
  # install under any older Node. Same root cause as
  # eas-build.yml/eas-native-build.yml/deploy-driver-play-testing.yml/
  # ci.yml's mobile-build/maestro-e2e.yml — see eas-build.yml's comment for
  # the full writeup. rider-app-check/driver-app-check (plain tsc --noEmit,
  # no EAS step) also read this var; both already verified fine under Node
  # 22 this session (their tsc --noEmit ran under Node 22.22.2 in the
  # sandbox that authored this fix, repeatedly, cleanly).
  NODE_VERSION: '22'

jobs:
  # ─── 1. Backend: Lint + Test ───
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
          JWT_SECRET: test-secret-ci
          ENV: test
        # continue-on-error is intentional: TEST_SUPABASE_URL / TEST_SUPABASE_KEY
        # may be absent on forks or in environments without a test DB, making
        # integration tests fail for infrastructure reasons rather than code bugs.
        # Unit tests (pytest -m unit) pass without secrets; full suite needs them.
        # Remove continue-on-error once TEST_SUPABASE_URL is set on all runners.
        continue-on-error: true
        run: pytest --cov --tb=short -q

  # ─── 2. Rider App: TypeScript Check ───
  rider-app-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: rider-app/node_modules
          key: rider-${{ runner.os }}-${{ hashFiles('rider-app/package-lock.json', 'rider-app/yarn.lock', 'rider-app/patches/**') }}

      - name: Install
        working-directory: rider-app
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm install --legacy-peer-deps
          fi

      - name: TypeScript check
        working-directory: rider-app
        run: npx tsc --noEmit

  # ─── 3. Driver App: TypeScript Check ───
  driver-app-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: driver-app/node_modules
          key: driver-${{ runner.os }}-${{ hashFiles('driver-app/package-lock.json', 'driver-app/yarn.lock', 'driver-app/patches/**') }}

      - name: Install
        working-directory: driver-app
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm install --legacy-peer-deps
          fi

      - name: TypeScript check
        working-directory: driver-app
        run: npx tsc --noEmit

  # ─── 4. Deploy Backend to Test ───
  deploy-backend-test:
    runs-on: ubuntu-latest
    needs: [backend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Railway auto-deploys on push to develop. Poll /health until healthy
      # (up to 3 min) rather than sleeping a fixed 30s and eating the error.
      - name: Wait for test backend to become healthy
        env:
          HEALTH_URL: https://spinr-backend-test.up.railway.app/api/v1
        run: |
          echo "Polling ${HEALTH_URL}/health …"
          for i in $(seq 1 18); do
            STATUS=$(curl -sf --max-time 5 "${HEALTH_URL}/health" \
              -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
            echo "  attempt ${i}/18 → HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "Test backend is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Test backend health check timed out."
          exit 1

  # ─── 5. Build Mobile Apps (Test/Preview) ───
  build-mobile-test:
    runs-on: ubuntu-latest
    needs: [rider-app-check, driver-app-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # setup-node MUST run before "Setup EAS": expo-github-action installs
      # eas-cli using whatever Node is on PATH at that point, so running it
      # first (as this job previously did) meant it always ran under the
      # runner's default Node regardless of NODE_VERSION below — the same
      # failure this env var change is meant to fix. See the top-level
      # NODE_VERSION comment for the underlying eas-cli/Node story.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Rider App — development build
      - name: Install rider-app deps
        working-directory: rider-app
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm install --legacy-peer-deps
          fi

      - name: Build rider-app (preview)
        working-directory: rider-app
        run: eas build --platform all --profile preview --non-interactive

      # Driver App — development build
      - name: Install driver-app deps
        working-directory: driver-app
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm install --legacy-peer-deps
          fi

      - name: Build driver-app (preview)
        working-directory: driver-app
        run: eas build --platform all --profile preview --non-interactive

  # ─── 6. OTA Update (fast — no rebuild needed) ───
  ota-update-test:
    runs-on: ubuntu-latest
    needs: [rider-app-check, driver-app-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && !contains(github.event.head_commit.message, '[build]')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # setup-node MUST run before "Setup EAS" — see build-mobile-test's
      # identical comment above.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install rider-app deps
        working-directory: rider-app
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm install --legacy-peer-deps
          fi

      - name: Publish OTA update (rider)
        working-directory: rider-app
        run: eas update --branch test --message "Test env update - $(git log -1 --pretty=%B)"

      - name: Install driver-app deps
        working-directory: driver-app
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm install --legacy-peer-deps
          fi

      - name: Publish OTA update (driver)
        working-directory: driver-app
        run: eas update --branch test --message "Test env update - $(git log -1 --pretty=%B)"
