    <line x1="96" y1="322" x2="904" y2="322" stroke="#EE2B2B" stroke-width="17" stroke-linecap="round"/><line x1="104" y1="332.5" x2="896" y2="332.5" stroke="#A3161D" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="150" y1="404" x2="850" y2="404" stroke="#EE2B2B" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M 120 300 C 200 250, 320 196, 340 192 L 320 200 C 250 220, 150 282, 120 312 Z"
