name: Deploy Backend to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'railway.json'
      - '.github/workflows/deploy-backend.yml'
  # Allow manual re-runs from the Actions tab without pushing a new commit.
  workflow_dispatch:

# One-time setup required (do this once, never touch again):
#   1. Railway Dashboard → your project → Settings → Deploy Hooks
#   2. Click "Create Deploy Hook" → copy the URL
#   3. GitHub repo → Settings → Secrets → Actions → New secret:
#        Name:  RAILWAY_DEPLOY_HOOK_URL
#        Value: <the URL from step 2>
#
# Why a deploy hook instead of `railway up`:
#   - No CLI to install — zero version-drift risk
#   - The URL is self-authenticating (no RAILWAY_TOKEN format issues)
#   - Immune to Railway CLI breaking changes (happened Apr 2026 v3→v4)

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy hook secret is configured
        run: |
          if [ -z "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}" ]; then
            echo "::error title=Missing secret::RAILWAY_DEPLOY_HOOK_URL is not set."
            echo ""
            echo "One-time setup:"
            echo "  1. Railway Dashboard → project → Settings → Deploy Hooks → Create"
            echo "  2. GitHub → repo → Settings → Secrets → Actions → New secret"
            echo "     Name:  RAILWAY_DEPLOY_HOOK_URL"
            echo "     Value: <hook URL from step 1>"
            exit 1
          fi
          echo "RAILWAY_DEPLOY_HOOK_URL is configured."

      - name: Trigger Railway deploy
        run: |
          http_status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}")
          echo "Railway responded with HTTP $http_status"
          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error::Deploy hook returned HTTP $http_status — check the hook URL in secrets."
            exit 1
          fi
          echo "Deploy triggered. Track progress at https://railway.app/dashboard"
