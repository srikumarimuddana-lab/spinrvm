name: CI Guard Rails

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

  # Allow manual check against any branch
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch to compare against"
        required: false
        default: "main"

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

# Cancel in-flight runs for the same PR
concurrency:
  group: guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Coverage regression gate ─────────────────────────────────────────
  coverage-regression-gate:
    name: Coverage regression check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        # continue-on-error so a transient wheel-download or hash-mismatch
        # failure during the coverage guardrail run does NOT mark the whole job
        # as failed. The coverage regression gate is advisory (continue-on-error
        # at the job level); a pip install failure is already surfaced by the
        # blocking backend-test job in ci.yml.
        continue-on-error: true
        run: |
          # B-P1-10: install from the SHA-256 hash-pinned lockfile (pytest,
          # pytest-asyncio, pytest-cov are floor-pinned in requirements.txt
          # and therefore included in the locked file).
          pip install --require-hashes -r requirements-locked.txt --quiet \
            || pip install -r requirements-locked.txt --quiet || true

      - name: Run coverage on PR branch
        working-directory: backend
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test_key
          JWT_SECRET: ci-only-not-a-real-secret-000000000000
          ADMIN_PASSWORD: ci-placeholder-password
          ENV: test
        run: |
          pytest --cov=. --cov-report=json:../pr-coverage.json -q --no-header 2>/dev/null || true
          python3 -c "
          import json, sys
          try:
              data = json.load(open('../pr-coverage.json'))
              pct = data['totals']['percent_covered']
              print(f'PR branch coverage: {pct:.1f}%')
              with open('../.coverage-pr', 'w') as f:
                  f.write(str(pct))
          except Exception as e:
              print(f'Coverage read failed: {e}')
              with open('../.coverage-pr', 'w') as f:
                  f.write('0')
          "

      - name: Fetch base branch coverage from Codecov
        id: base_coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          BASE_BRANCH: ${{ github.base_ref || inputs.base_branch }}
          REPO: ${{ github.repository }}
        run: |
          # Attempt to fetch last known coverage for base branch from Codecov API
          BASE_PCT=$(curl -s \
            "https://codecov.io/api/v2/github/${REPO%%/*}/repos/${REPO##*/}/branches/${BASE_BRANCH}/coverage" \
            -H "Authorization: Bearer ${CODECOV_TOKEN}" 2>/dev/null | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('totals',{}).get('coverage','0'))" 2>/dev/null || echo "0")
          echo "base_pct=$BASE_PCT" >> "$GITHUB_OUTPUT"
          echo "Base branch coverage: $BASE_PCT%"

      - name: Assert no regression
        run: |
          PR_PCT=$(cat .coverage-pr)
          BASE_PCT="${{ steps.base_coverage.outputs.base_pct }}"
          export BASE_PCT
          python3 - <<'PYEOF'
          import sys, os
          pr_pct   = float(open('.coverage-pr').read().strip() or 0)
          base_pct = float(os.environ.get('BASE_PCT', '0') or 0)
          # Allow up to 2% regression before blocking (accounts for flaky mocks)
          TOLERANCE = 2.0
          delta = pr_pct - base_pct
          print(f"Base coverage : {base_pct:.1f}%")
          print(f"PR coverage   : {pr_pct:.1f}%")
          print(f"Delta         : {delta:+.1f}%")
          if base_pct > 0 and delta < -TOLERANCE:
              print(f"FAIL: Coverage regressed by {abs(delta):.1f}% (tolerance: {TOLERANCE}%)")
              print("Open a Change Request via .github/ISSUE_TEMPLATE/ci_change_request.yml if")
              print("the regression is intentional (e.g., removed dead code).")
              sys.exit(1)
          else:
              print("PASS: Coverage within tolerance.")
          PYEOF

  # ─── 2. Lint warning count gate ───────────────────────────────────────────
  lint-trend-gate:
    name: Lint warning trend check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.12 --quiet

      - name: Count ruff warnings on PR branch
        working-directory: backend
        run: |
          python -m ruff check . --output-format=json 2>/dev/null | \
            python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              errors   = [d for d in data if d.get('message','').startswith('E')]
              warnings = [d for d in data if not d.get('message','').startswith('E')]
              total    = len(data)
              print(f'Total issues: {total} (errors: {len(errors)}, warnings: {len(warnings)})')
              with open('/tmp/lint_pr_count', 'w') as f:
                  f.write(str(total))
          except Exception:
              with open('/tmp/lint_pr_count', 'w') as f:
                  f.write('0')
          " || echo "0" > /tmp/lint_pr_count

      - name: Set up Node (for admin lint)
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Count admin ESLint issues
        working-directory: admin-dashboard
        run: |
          npm ci --quiet 2>/dev/null
          WARN_COUNT=$(npm run lint -- --format=json 2>/dev/null | \
            python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              total = sum(f.get('warningCount', 0) + f.get('errorCount', 0) for f in data)
              print(total)
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "$WARN_COUNT" > /tmp/lint_admin_count

          # GUARDRAIL: admin dashboard currently tolerates 600 warnings.
          # This gate enforces the count does NOT grow beyond current baseline.
          # See Change Request CR-2026-001 for the proposal to reduce this threshold.
          CURRENT=$(cat /tmp/lint_admin_count)
          BASELINE=600
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "FAIL: Admin ESLint warning count ($CURRENT) exceeds baseline ($BASELINE)"
            echo "Do not introduce new lint issues. Fix existing ones first."
            exit 1
          fi

      - name: Summary
        run: |
          echo "Backend ruff issues: $(cat /tmp/lint_pr_count)"
          echo "Admin ESLint issues: $(cat /tmp/lint_admin_count)"

  # ─── 3. Security posture gate ─────────────────────────────────────────────
  security-posture-gate:
    name: Security posture check
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # B-P1-10: refuse to merge a PR that ships an unhashed (or missing)
      # lockfile. Without this gate someone could regenerate the lockfile
      # without --generate-hashes and the Dockerfile's --require-hashes
      # check would silently degrade to "no enforcement".
      - name: Verify requirements-locked.txt has SHA-256 hashes
        run: |
          LOCK=backend/requirements-locked.txt
          if [ ! -f "$LOCK" ]; then
            echo "FAIL: $LOCK is missing. Regenerate via:"
            echo "  cd backend && pip-compile --generate-hashes --resolver=backtracking \\"
            echo "      --output-file=requirements-locked.txt requirements.txt"
            exit 1
          fi
          HASH_COUNT=$(grep -c -- '--hash=sha256:' "$LOCK" || true)
          if [ "$HASH_COUNT" -lt 100 ]; then
            echo "FAIL: $LOCK contains only $HASH_COUNT SHA-256 hashes (expected 100+)."
            echo "It looks like the file was regenerated without --generate-hashes."
            echo "See docs/runbooks/dependency-update.md."
            exit 1
          fi
          echo "PASS: $LOCK has $HASH_COUNT SHA-256 hashes."

      - name: Run pip-audit (Python CVE scan)
        # Non-blocking: CVE enforcement lives in security-gates.yml (G4a) which
        # runs on its own schedule and posts SARIF results. This step reports
        # findings to the step summary so authors are aware, but never exits 1
        # so the guardrail job passes even when patched versions are available.
        # Fail-fast only on CRITICAL aliases that pip-audit marks as such
        # (requires --strict-versions once available; tracked in CR-2026-009).
        working-directory: backend
        run: |
          pip install pip-audit --quiet
          pip-audit -r requirements-locked.txt --format=json \
            --output=/tmp/pip_audit.json --skip-editable 2>/dev/null || true
          python3 - <<'PYEOF'
          import json, os, sys
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          try:
              data = json.load(open('/tmp/pip_audit.json'))
              vulns = [
                  (pkg.get('name','?'), pkg.get('version','?'), v)
                  for pkg in data.get('dependencies', [])
                  for v in pkg.get('vulns', [])
              ]
              with open(summary_file, 'a') as sf:
                  sf.write("### pip-audit results\n\n")
                  if not vulns:
                      sf.write("✅ No Python CVEs found.\n")
                      print("PASS: No Python CVEs detected.")
                  else:
                      fixable = [(n, ver, v) for n, ver, v in vulns if v.get('fix_versions')]
                      sf.write(f"⚠️ {len(vulns)} CVE(s) found ({len(fixable)} fixable):\n\n")
                      sf.write("| Package | CVE | Fix versions |\n|---|---|---|\n")
                      for pkg_name, pkg_ver, v in vulns[:10]:
                          fixes = ', '.join(v.get('fix_versions', ['none']))
                          sf.write(f"| {pkg_name}=={pkg_ver} | {v.get('id','?')} | {fixes} |\n")
                      print(f"WARN: {len(vulns)} CVE(s) found ({len(fixable)} fixable).")
                      print("Review above in step summary; update requirements-locked.txt via")
                      print("  cd backend && pip-compile --generate-hashes ...")
          except Exception as e:
              print(f"pip-audit output could not be parsed: {e}")
          # Always exit 0 — blocking enforcement is in security-gates.yml G4a.
          PYEOF

      - name: Check for new secrets in diff
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Check EXPO_PUBLIC_ variable exposure
        run: |
          python3 - <<'PYEOF'
          import subprocess, re, sys

          # Scan changed files in PR for accidental private key exposure via EXPO_PUBLIC_
          result = subprocess.run(
              ['git', 'diff', '--name-only',
               '${{ github.event.pull_request.base.sha }}',
               '${{ github.event.pull_request.head.sha }}'],
              capture_output=True, text=True
          )
          changed = [f for f in result.stdout.strip().split('\n')
                     if f.endswith(('.ts', '.tsx', '.js', '.jsx', '.env', '.json'))]

          PRIVATE_PATTERNS = [
              r'EXPO_PUBLIC_.*(?:SECRET|PRIVATE|PASSWORD|KEY|TOKEN)',
              r'EXPO_PUBLIC_SUPABASE_SERVICE',
              r'EXPO_PUBLIC_JWT',
              r'EXPO_PUBLIC_ADMIN',
          ]
          issues = []
          for filepath in changed:
              try:
                  content = open(filepath).read()
                  for pat in PRIVATE_PATTERNS:
                      if re.search(pat, content, re.IGNORECASE):
                          issues.append(f"{filepath}: matches {pat}")
              except (OSError, UnicodeDecodeError):
                  pass

          if issues:
              print("FAIL: Potential private key in EXPO_PUBLIC_ variable:")
              for i in issues:
                  print(f"  {i}")
              sys.exit(1)
          else:
              print("PASS: No EXPO_PUBLIC_ key exposure detected.")
          PYEOF

  # ─── 4. DB migration safety gate ──────────────────────────────────────────
  migration-safety-gate:
    name: Migration safety check
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for dangerous migration patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, re, sys

          result = subprocess.run(
              ['git', 'diff', '--name-only', '$BASE_SHA', '$HEAD_SHA'],
              capture_output=True, text=True
          )
          migration_files = [f for f in result.stdout.strip().split('\n')
                             if 'migration' in f.lower() and f.endswith('.sql')]

          if not migration_files:
              print("PASS: No migration files changed.")
              sys.exit(0)

          print(f"Changed migration files: {migration_files}")

          DANGEROUS = [
              (r'\bDROP\s+TABLE\b',         "DROP TABLE — data loss risk"),
              (r'\bDROP\s+COLUMN\b',        "DROP COLUMN — data loss risk"),
              (r'\bTRUNCATE\b',             "TRUNCATE — data loss risk"),
              (r'\bDELETE\s+FROM\b',        "DELETE FROM in migration — unintended data loss"),
              (r'\bALTER\s+TABLE.*NOT\s+NULL\b', "Adding NOT NULL without default — locks table"),
              (r'WITHOUT\s+ROWID',          "WITHOUT ROWID — irreversible schema change"),
              (r'\bDROP\s+INDEX\b',         "DROP INDEX — query performance regression risk"),
          ]

          issues = []
          for filepath in migration_files:
              try:
                  content = open(filepath).read().upper()
                  for pattern, description in DANGEROUS:
                      if re.search(pattern, content, re.IGNORECASE):
                          issues.append(f"{filepath}: {description}")
              except OSError:
                  pass

          if issues:
              print("\nFAIL: Dangerous migration patterns detected:")
              for issue in issues:
                  print(f"  ⚠  {issue}")
              print("\nAction required:")
              print("  1. Review whether this is intentional.")
              print("  2. If intentional, open a Change Request using .github/ISSUE_TEMPLATE/ci_change_request.yml")
              print("     with full rollback plan before merging.")
              sys.exit(1)
          else:
              print("PASS: No dangerous migration patterns found.")
          PYEOF

      - name: Check for CREATE OR REPLACE conflicts across migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, sys

          BASE_SHA = os.environ.get('BASE_SHA', '')
          HEAD_SHA = os.environ.get('HEAD_SHA', '')

          # Only added migration files in this PR
          result = subprocess.run(
              ['git', 'diff', '--name-only', '--diff-filter=A', BASE_SHA, HEAD_SHA],
              capture_output=True, text=True,
          )
          new_migrations = [
              f for f in result.stdout.strip().split('\n')
              if f.startswith('backend/migrations/') and f.endswith('.sql')
          ]

          if not new_migrations:
              print("PASS: No new migration files added in this PR.")
              sys.exit(0)

          print(f"New migration files: {new_migrations}")

          COR = re.compile(
              r'CREATE\s+OR\s+REPLACE\s+(?:FUNCTION|VIEW|TRIGGER|PROCEDURE)\s+(\w+)',
              re.IGNORECASE,
          )
          OVERRIDE = re.compile(r'--\s*migration-override-ok\s*:', re.IGNORECASE)

          # Collect targets defined by this PR's new migrations
          pr_targets: dict[str, list[str]] = {}
          for fpath in new_migrations:
              try:
                  content = open(fpath).read()
              except OSError:
                  continue
              if OVERRIDE.search(content):
                  print(f"  Skipping {fpath}: migration-override-ok annotation found.")
                  continue
              for name in COR.findall(content):
                  pr_targets.setdefault(name.lower(), []).append(fpath)

          if not pr_targets:
              print("PASS: No CREATE OR REPLACE targets in new migrations.")
              sys.exit(0)

          print(f"CREATE OR REPLACE targets in this PR: {sorted(pr_targets)}")

          # Walk all existing migrations not in this PR
          new_set = {os.path.normpath(f) for f in new_migrations}
          conflicts: list[dict] = []
          for root, _dirs, files in os.walk('backend/migrations'):
              for fname in sorted(files):
                  if not fname.endswith('.sql'):
                      continue
                  fpath = os.path.normpath(os.path.join(root, fname))
                  if fpath in new_set:
                      continue
                  try:
                      content = open(fpath).read()
                  except OSError:
                      continue
                  for name in COR.findall(content):
                      if name.lower() in pr_targets:
                          conflicts.append({
                              'target': name,
                              'existing': fpath,
                              'pr_files': pr_targets[name.lower()],
                          })

          if conflicts:
              seen: set[tuple] = set()
              print(f"\nFAIL: {len(conflicts)} CREATE OR REPLACE conflict(s):")
              for c in conflicts:
                  key = (c['target'].lower(), c['existing'])
                  if key in seen:
                      continue
                  seen.add(key)
                  print(f"  Target : {c['target']}")
                  print(f"  Already in : {c['existing']}")
                  print(f"  PR file(s) : {', '.join(c['pr_files'])}")
              print("\nTwo migrations redefine the same Postgres object.")
              print("Options:")
              print("  1. Add '-- migration-override-ok: <reason>' to the new migration to suppress.")
              print("  2. Rename one target if the conflict is accidental.")
              sys.exit(1)
          else:
              print(f"\nPASS: No CREATE OR REPLACE conflicts ({len(pr_targets)} target(s) checked).")
          PYEOF

      - name: Check for duplicate migration prefix numbers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, sys

          BASE_SHA = os.environ.get('BASE_SHA', '')
          HEAD_SHA = os.environ.get('HEAD_SHA', '')

          # New migration files added by this PR only
          result = subprocess.run(
              ['git', 'diff', '--name-only', '--diff-filter=A', BASE_SHA, HEAD_SHA],
              capture_output=True, text=True,
          )
          new_migrations = [
              f for f in result.stdout.strip().split('\n')
              if f.startswith('backend/migrations/') and f.endswith('.sql')
          ]

          if not new_migrations:
              print("PASS: No new migration files added in this PR.")
              sys.exit(0)

          PREFIX = re.compile(r'backend/migrations/(\d+)_')

          # Build prefix -> filenames map from all existing migrations on disk
          existing: dict[str, list[str]] = {}
          for fname in os.listdir('backend/migrations'):
              if not fname.endswith('.sql'):
                  continue
              m = PREFIX.match(f'backend/migrations/{fname}')
              if m:
                  existing.setdefault(m.group(1), []).append(fname)

          collisions = []
          for new_file in new_migrations:
              m = PREFIX.match(new_file)
              if not m:
                  continue
              prefix = m.group(1)
              others = [f for f in existing.get(prefix, [])
                        if f'backend/migrations/{f}' != new_file]
              if others:
                  collisions.append((new_file, prefix, others))

          if collisions:
              print("FAIL: New migration(s) reuse an existing numeric prefix:")
              for new_file, prefix, others in collisions:
                  print(f"  New file  : {new_file}")
                  print(f"  Prefix    : {prefix}_")
                  print(f"  Conflicts : {', '.join(others)}")
              print("\nRename the new file to the next free numeric slot.")
              print("Current highest slot and next free slot are documented in CLAUDE.md.")
              sys.exit(1)
          else:
              print(f"PASS: No duplicate migration prefix numbers ({len(new_migrations)} new file(s) checked).")
          PYEOF

  # ─── 5. Breaking change detection ─────────────────────────────────────────
  breaking-change-gate:
    name: Breaking change detection
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for breaking API changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, re, sys

          # Detect changes to backend route signatures and DB schema
          result = subprocess.run(
              ['git', 'diff', '$BASE_SHA', '$HEAD_SHA', '--', 'backend/routes/', 'backend/db_supabase.py'],
              capture_output=True, text=True
          )
          diff = result.stdout

          BREAKING_PATTERNS = [
              (r'^\-.*@.*router\.(get|post|put|delete|patch)\(["\']',
               "Removed API route — existing clients will 404"),
              (r'^\-.*def (get_|create_|update_|delete_)\w+\(.*\)',
               "Removed public DB helper function"),
              (r'^\+.*def \w+\(.*\)\s*->\s*None:',
               "Function now returns None (potential type contract break)"),
          ]

          issues = []
          for pattern, description in BREAKING_PATTERNS:
              matches = re.findall(pattern, diff, re.MULTILINE)
              if matches:
                  issues.append(f"{description} ({len(matches)} instance(s))")

          if issues:
              print("WARN: Potential breaking changes detected:")
              for issue in issues:
                  print(f"  ⚠  {issue}")
              print("\nIf intentional, document the breaking change in your PR description")
              print("and open a Change Request if client apps need updating.")
              # Warning only — does not block PR
          else:
              print("PASS: No obvious breaking API changes detected.")
          PYEOF

  # ─── 6. Mobile test-placement gate ────────────────────────────────────────
  # Blocks a test file (*.test.*, *.spec.*, __tests__/) from landing inside an
  # Expo Router app/ tree, where require.context eagerly bundles it into the
  # production JS bundle and breaks the iOS/Android EAS build at the
  # "Bundle JavaScript" phase (Node built-in imports like fs fail to resolve).
  mobile-test-placement-gate:
    name: Mobile test placement check
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6

      - name: Ensure no test files under an Expo Router app/ tree
        run: python3 scripts/check_mobile_test_placement.py

  # ─── 7. Change Impact & Risk Log gate ─────────────────────────────────────
  # CLAUDE.md: any PR touching a live-tested surface (rides, dispatch,
  # payments, auth, corporate, safety) must include a filled Change Impact
  # & Risk Log — either pasted into the PR description or added under
  # docs/change-log/. This gate only checks presence/shape of the required
  # sections, not their content quality — that's still a human reviewer's job.
  change-impact-log-gate:
    name: Change Impact & Risk Log check
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Change Impact Log present for sensitive-surface PRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, sys

          BASE_SHA = os.environ.get('BASE_SHA', '')
          HEAD_SHA = os.environ.get('HEAD_SHA', '')
          PR_BODY = os.environ.get('PR_BODY') or ''

          result = subprocess.run(
              ['git', 'diff', '--name-only', BASE_SHA, HEAD_SHA],
              capture_output=True, text=True,
          )
          changed = [f for f in result.stdout.strip().split('\n') if f]

          # Path substrings that mark a "live-tested surface" per CLAUDE.md's
          # own Change Impact Log policy (rides, dispatch, payments, auth,
          # corporate, safety). Kept as substrings, not exact paths, so it
          # still catches new files in these domains without maintenance.
          SENSITIVE_MARKERS = [
              'backend/routes/rides', 'backend/services/dispatch_service',
              'backend/services/fare_service', 'backend/routes/payments',
              'backend/routes/webhooks', 'backend/routes/auth.py',
              'backend/routes/corporate', 'backend/services/corporate',
              'backend/routes/wallet', 'backend/routes/safety.py',
              'backend/utils/insurance_periods', 'backend/services/payment_service',
              'backend/routes/drivers/ride_', 'backend/routes/drivers/status',
              'backend/routes/drivers/payouts', 'backend/migrations/',
          ]

          touched = [f for f in changed if any(m in f for m in SENSITIVE_MARKERS)]

          if not touched:
              print("PASS: No live-tested-surface files changed — Change Impact Log not required.")
              sys.exit(0)

          print(f"Live-tested-surface files changed: {touched}")

          # Required fields, per docs/templates/CHANGE_IMPACT_LOG.md. Matched
          # loosely (case-insensitive substring) since PR authors may adapt
          # heading style slightly — this checks presence, not formatting.
          REQUIRED_MARKERS = [
              'root cause',
              'risk & impact',
              'user experience',
              'rollback plan',
              'verification performed',
          ]

          # Accept either: (a) the PR body contains the required sections, or
          # (b) this PR adds a docs/change-log/*.md file (also checked for markers).
          change_log_added = [
              f for f in changed
              if f.startswith('docs/change-log/') and f.endswith('.md')
          ]

          # Normalize hyphens to spaces before matching — the template itself
          # uses hyphenated headings in places (e.g. "## 5. User-experience
          # effect"), and a literal-substring match against 'user experience'
          # (space) would false-negative on that exact heading. Found via a
          # real false-positive on this gate's own first production run.
          def _normalize(text):
              return text.lower().replace('-', ' ')

          candidate_text = _normalize(PR_BODY)
          for f in change_log_added:
              try:
                  candidate_text += '\n' + _normalize(open(f, encoding='utf-8').read())
              except OSError:
                  pass

          missing = [m for m in REQUIRED_MARKERS if m not in candidate_text]

          if missing:
              print("FAIL: This PR touches a live-tested surface but is missing a Change Impact & Risk Log.")
              print(f"Missing section(s): {missing}")
              print()
              print("Fix: paste a filled docs/templates/CHANGE_IMPACT_LOG.md into the PR description,")
              print("or add docs/change-log/YYYY-MM-DD-<short-slug>.md with the same sections.")
              print("See CLAUDE.md → 'Change Impact & Risk Log (mandatory)'.")
              sys.exit(1)
          else:
              print("PASS: Change Impact & Risk Log present and covers required sections.")
          PYEOF

  # ─── 8. Risk label bot ────────────────────────────────────────────────────
  # Informational only (never blocks): labels the PR risk:high / risk:medium /
  # risk:low based on which surfaces it touches, so reviewers can triage
  # attention before reading the full diff. High = same live-tested-surface
  # marker list as the Change Impact Log gate above.
  risk-label:
    name: Apply risk label
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine risk level
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, subprocess

          BASE_SHA = os.environ.get('BASE_SHA', '')
          HEAD_SHA = os.environ.get('HEAD_SHA', '')

          result = subprocess.run(
              ['git', 'diff', '--name-only', BASE_SHA, HEAD_SHA],
              capture_output=True, text=True,
          )
          changed = [f for f in result.stdout.strip().split('\n') if f]

          HIGH_MARKERS = [
              'backend/routes/rides', 'backend/services/dispatch_service',
              'backend/services/fare_service', 'backend/routes/payments',
              'backend/routes/webhooks', 'backend/routes/auth.py',
              'backend/routes/corporate', 'backend/services/corporate',
              'backend/routes/wallet', 'backend/routes/safety.py',
              'backend/utils/insurance_periods', 'backend/services/payment_service',
              'backend/routes/drivers/ride_', 'backend/routes/drivers/status',
              'backend/routes/drivers/payouts', 'backend/migrations/',
          ]
          MEDIUM_MARKERS = [
              'backend/', 'rider-app/', 'driver-app/', 'admin-dashboard/',
          ]

          if any(m in f for f in changed for m in HIGH_MARKERS):
              level = 'high'
          elif any(m in f for f in changed for m in MEDIUM_MARKERS):
              level = 'medium'
          else:
              level = 'low'

          gh_output = os.environ.get('GITHUB_OUTPUT')
          with open(gh_output, 'a') as f:
              f.write(f'level={level}\n')
          print(f"Risk level: {level}")
          PYEOF

      - name: Apply label
        uses: actions/github-script@v9
        with:
          script: |
            const level = '${{ steps.risk.outputs.level }}';
            const allLevels = ['risk:high', 'risk:medium', 'risk:low'];
            const target = `risk:${level}`;

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const currentNames = current.map(l => l.name);

            // Remove any stale risk:* label that doesn't match the current level.
            for (const name of currentNames) {
              if (allLevels.includes(name) && name !== target) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                }).catch(() => {});
              }
            }

            if (!currentNames.includes(target)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [target],
              }).catch(() => {});
            }

  # ─── Guard rail summary comment on PR ─────────────────────────────────────
  guardrail-summary:
    name: Post guard rail summary
    runs-on: ubuntu-latest
    needs:
      - coverage-regression-gate
      - lint-trend-gate
      - security-posture-gate
      - migration-safety-gate
      - breaking-change-gate
      - mobile-test-placement-gate
      - change-impact-log-gate
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Summarise results
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = {
              'Coverage Regression':  '${{ needs.coverage-regression-gate.result }}',
              'Lint Trend':           '${{ needs.lint-trend-gate.result }}',
              'Security Posture':     '${{ needs.security-posture-gate.result }}',
              'Migration Safety':     '${{ needs.migration-safety-gate.result }}',
              'Breaking Changes':     '${{ needs.breaking-change-gate.result }}',
              'Test Placement':       '${{ needs.mobile-test-placement-gate.result }}',
              'Change Impact Log':    '${{ needs.change-impact-log-gate.result }}',
            };

            const icon = r => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'skipped' ? '⏭️' : '⚠️';
            const rows = Object.entries(jobs)
              .map(([name, result]) => `| ${icon(result)} **${name}** | \`${result}\` |`)
              .join('\n');

            const body = `## CI Guard Rails Summary\n\n| Gate | Status |\n|---|---|\n${rows}\n\n` +
              `> Guard rails run on every PR to \`main\`/\`develop\`. ` +
              `Failures must be resolved or a [Change Request]` +
              `(https://github.com/${{ github.repository }}/issues/new?template=ci_change_request.yml) ` +
              `approved before merging.\n` +
              `> Audit: [CI Error Audit System](https://github.com/${{ github.repository }}/tree/main/reports/audits)`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CI Guard Rails Summary')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
