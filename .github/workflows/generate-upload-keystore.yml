name: Generate Upload Keystore (one-off)

# ─── What this does ────────────────────────────────────────────────────────
# Generates a fresh Android upload keystore and exports its public certificate,
# so a Play Console "upload key reset" can be completed without a local
# terminal. Run once, download the artifact, then DELETE the artifact and
# disable this workflow.
#
# Why this exists: com.spinr.driver's registered upload key (SHA1 B7:F7:…) is
# unrecoverable — no custodian on record (see audit finding [23-6]). Play
# rejects every AAB EAS signs. The fix is to register a NEW upload certificate
# with Google, which requires keytool.
#
# ─── Prerequisites ─────────────────────────────────────────────────────────
#   • Repo secret KEYSTORE_PASSWORD — a strong password you choose. It protects
#     the generated .jks both in the artifact and at rest in EAS. Store it in a
#     password vault BEFORE running this; it cannot be recovered afterwards.
#
# ─── After the run ─────────────────────────────────────────────────────────
#   1. Download the artifact (contains upload-keystore.jks + upload_certificate.pem)
#   2. Play Console → Protected with Play → Play app signing →
#      Request upload key reset → upload ONLY upload_certificate.pem
#   3. expo.dev → Credentials → Android → com.spinr.driver →
#      Add new build credentials → upload upload-keystore.jks, make it active
#   4. Vault the .jks + password, then delete the workflow-run artifact
#   5. Wait 1–2 business days for Google, then re-run the deploy workflow

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias to embed in the keystore"
        required: true
        default: "upload"
        type: string
      confirm:
        description: 'Type "generate" to confirm — this mints a new signing key'
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental runs
        if: ${{ github.event.inputs.confirm != 'generate' }}
        run: |
          echo "::error::Confirmation input must be exactly 'generate'."
          exit 1

      - name: Check keystore password secret is set
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is empty or unset."
            echo "Add it under Settings > Secrets and variables > Actions,"
            echo "and save the same value in a password vault first — it is"
            echo "unrecoverable once the keystore is generated."
            exit 1
          fi
          # A weak keystore password is the only thing protecting the private
          # key inside the downloadable artifact.
          if [ "${#KEYSTORE_PASSWORD}" -lt 12 ]; then
            echo "::error::KEYSTORE_PASSWORD must be at least 12 characters."
            exit 1
          fi

      - name: Generate keystore and export certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          set -euo pipefail

          # -dname is supplied non-interactively; these fields are cosmetic for
          # an upload key (Play identifies it by fingerprint, not subject).
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Spinr Driver Upload Key, O=Spinr, L=Saskatoon, ST=SK, C=CA"

          # -rfc emits PEM, which is the format Play's reset flow accepts.
          keytool -export -rfc \
            -keystore upload-keystore.jks \
            -alias "$ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -file upload_certificate.pem

      - name: Print fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          # Fingerprints are public information — safe to log. Record the SHA-1:
          # it is what Play will show as the upload key certificate after the
          # reset is approved, and what future mismatch errors will name.
          keytool -list -v \
            -keystore upload-keystore.jks \
            -alias "$ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -A1 "Certificate fingerprints" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: |
            upload-keystore.jks
            upload_certificate.pem
          retention-days: 1
          if-no-files-found: error

      - name: Next steps
        run: |
          {
            echo "## Upload keystore generated"
            echo ""
            echo "Download the **upload-keystore** artifact from this run"
            echo "(expires in 1 day), then:"
            echo ""
            echo "1. **Vault** \`upload-keystore.jks\` + the KEYSTORE_PASSWORD."
            echo "   Alias: \`${{ github.event.inputs.alias }}\`"
            echo "2. **Play Console** → Protected with Play → Play app signing →"
            echo "   Request upload key reset → upload **only** \`upload_certificate.pem\`"
            echo "3. **expo.dev** → Credentials → Android → \`com.spinr.driver\` →"
            echo "   Add new build credentials → upload the \`.jks\`, make it active"
            echo "4. **Delete this run's artifact** once downloaded"
            echo "5. Wait 1–2 business days for Google, then re-run the deploy workflow"
            echo ""
            echo "> Never upload the \`.jks\` to Play Console — Google only takes the \`.pem\`."
          } >> $GITHUB_STEP_SUMMARY
