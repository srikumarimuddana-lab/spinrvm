name: Deploy Fly (signed GHCR image) — EXPERIMENTAL, manual only

# 2026-09-20 CI/CD audit, task 4: today deploy-fly.yml has Fly's remote
# builder independently REBUILD the backend from backend/Dockerfile on every
# push to main, while ci.yml's docker-image-scan job separately builds,
# scans, pushes-to-GHCR, and cosign-signs its own copy of the same image —
# so the bits Fly actually runs are never the exact bits that got scanned
# and signed, just a same-Dockerfile rebuild. The ask this workflow answers:
# make Fly deploy that exact signed GHCR artifact instead.
#
# This is intentionally NOT wired to `push: branches: [main]` yet. Investigation
# for this task found three concrete gaps; #3 is now code-fixed, #1 and #2
# still make an automatic switchover risky on a live-tested production surface:
#
#   1. RACE CONDITION (open): deploy-fly.yml and ci.yml's docker-image-scan
#      job are two independently-triggered workflows on the same push, with
#      no needs:/workflow_run: link. docker-image-scan needs: [backend-test]
#      (~13-14 min) plus build/push/sign time, so a naive "trigger deploy on
#      push" would very likely try to deploy an image that doesn't exist yet.
#      This workflow's "Wait for signed image" step below polls/retries to
#      cover that gap, but the wait has never been exercised against a real
#      run end-to-end.
#   2. REGISTRY AUTH (DECIDED 2026-09-21, NOT YET APPLIED): researched
#      2026-09-20 — multiple independent reports (Fly community thread
#      "deploy from private package with github actions", flyctl issues
#      #75/#1100/#362) describe `flyctl deploy --image` returning
#      `401 Unauthorized` pulling a PRIVATE ghcr.io image even with
#      `docker login ghcr.io` already done — the exact setup below. The one
#      consistently-reported working fix is making the GHCR package PUBLIC.
#      Repository owner decided 2026-09-21: make `ghcr.io/<repo>/spinr-backend`
#      public (the image is application code, not secrets — this repo's
#      Dockerfile never bakes secrets in — verified before presenting the
#      option). Decision made; the actual GitHub package-visibility change is
#      a manual, repo/org-admin action outside this file and outside any
#      agent's available tooling — not yet applied as of this comment. Once
#      applied, this gap can be marked closed and gap #1's end-to-end dispatch
#      test can include a real auth check.
#   3. BUILD PROVENANCE (CLOSED 2026-09-20): ci.yml's docker-image-scan job
#      now has its own "Stamp build info" step (mirrors deploy-fly.yml's),
#      so the GHCR image carries a real commit SHA instead of the committed
#      placeholder. The "Verify the deployed build SHA is serving" step
#      below is re-enabled accordingly — still pending confirmation on the
#      first real end-to-end dispatch, same as gaps #1 and #2.
#
# Run this manually, watch it end-to-end, and only then decide whether to
# promote it to replace deploy-fly.yml's push trigger. See ACTION_ITEMS.md
# for the tracked entry and promotion checklist.

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Git SHA of the GHCR image to deploy (ghcr.io/<repo>/spinr-backend:<sha> — only sha-tagged images are cosign-signed, :latest is not). Leave blank to use this run's own HEAD SHA."
        required: false
        type: string

# Share deploy-fly.yml's concurrency group: both ultimately run `flyctl
# deploy` against the same Fly app, and must never race each other.
concurrency:
  group: deploy-fly-spinr-backend-yyz
  cancel-in-progress: false

permissions:
  contents: read
  packages: read # GHCR pull

jobs:
  deploy-signed-image:
    name: Deploy signed GHCR image to Fly.io
    runs-on: ubuntu-latest
    # ACTION_ITEMS.md C127: this budget must stay ahead of the upstream
    # image-build chain the poll step below waits on (backend-test's own
    # timeout-minutes + docker-image-scan's, both in ci.yml) plus this job's
    # own deploy/readiness/verify steps. As of 2026-09-21 that chain is 35
    # (backend-test) + 10 (docker-image-scan) = 45 min worst case -- rechecked
    # against ci.yml directly, not copied from this item's original 40 min
    # estimate, which was stale (backend-test moved 30->35 under CR #5579
    # after this item was filed). 70 = 50 min poll (below) + ~20 min margin
    # for setup/login/deploy/scale/readiness(3m)/verify(2m). Re-derive both
    # numbers from ci.yml's current timeout-minutes values if they change.
    timeout-minutes: 70
    env:
      FLY_APP: spinr-backend-yyz
      FLY_HEALTH_URL: ${{ secrets.FLY_HEALTH_URL }}
      # Optional: enables "Verify the deployed build SHA is serving" below,
      # same as deploy-fly.yml.
      METRICS_AUTH_TOKEN: ${{ secrets.METRICS_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify FLY_API_TOKEN is set
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error title=Missing secret::FLY_API_TOKEN is not set."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify SENTRY_DSN is set
        run: |
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::error title=Missing secret::SENTRY_DSN is not set (name, not SENTRY_DNS)."
            exit 1
          fi
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Resolve image reference
        id: image
        run: |
          TAG="${IMAGE_SHA_INPUT}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${REPO}/spinr-backend:${TAG}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_SHA_INPUT: ${{ inputs.image_sha }}
          REPO: ${{ github.repository }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (2026-08-18)

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # GHCR pull auth for the later `flyctl deploy --image` step. Gap #2
      # above: real-world reports show this alone may not be enough for a
      # PRIVATE image (flyctl still 401s) — this step is necessary but may
      # not be sufficient until that gap is resolved.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Combines "does the image exist" and "is it cosign-signed" into one
      # gate: cosign verify fails on either a missing manifest or a missing
      # signature, so a single retry loop covers both (gap #1 above).
      - name: Wait for signed image to exist in GHCR
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -uo pipefail
          echo "Waiting for ${IMAGE_REF} to exist and be cosign-signed"
          echo "(ci.yml's docker-image-scan job needs: [backend-test] -- worst case"
          echo "35 min backend-test + 10 min docker-image-scan = 45 min; see this"
          echo "job's timeout-minutes comment for how the 50 min budget below and"
          echo "the job-level 70 min ceiling were derived) ..."
          for i in $(seq 1 50); do
            if cosign verify "${IMAGE_REF}" \
                --certificate-identity-regexp 'github.com/srikumarimuddana-lab/spinrvm' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                >/tmp/cosign-verify.log 2>&1; then
              echo "Signature verified after attempt ${i}/50."
              exit 0
            fi
            echo "  attempt ${i}/50: not ready yet ($(tail -1 /tmp/cosign-verify.log))"
            sleep 60
          done
          echo "::error::Timed out after 50 minutes waiting for a verified signed image at ${IMAGE_REF}."
          cat /tmp/cosign-verify.log
          exit 1

      - name: Stage Sentry DSN in Fly secrets
        run: flyctl secrets set SENTRY_DSN="${SENTRY_DSN}" --stage -a "${FLY_APP}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # No "Stamp build info" step here (unlike deploy-fly.yml) — there is no
      # build, so there is nothing to stamp into. The image's baked-in
      # build_info.json now comes from ci.yml's docker-image-scan job's own
      # "Stamp build info" step (gap #3, closed), so it already carries the
      # real commit SHA by the time it reaches this workflow.
      - name: Deploy signed image to Fly.io
        working-directory: backend
        run: flyctl deploy --image "${IMAGE_REF}" --config fly.toml --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}

      - name: Ensure mixed pool (2 warm 4 GB + 6 burst 2 GB)
        run: flyctl scale count app=2 burst=6 --region yyz -a "${FLY_APP}" --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Readiness check
        if: ${{ env.FLY_HEALTH_URL != '' }}
        run: |
          echo "Polling ${FLY_HEALTH_URL}/ready …"
          for i in $(seq 1 18); do
            STATUS=$(curl -sf --max-time 5 "${FLY_HEALTH_URL}/ready" \
              -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
            echo "  attempt ${i}/18 → HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Readiness check timed out after 3 minutes."
          echo "Fly keeps the previous release in traffic on a failed rolling deploy."
          echo "Inspect with: flyctl status -a spinr-backend-yyz && flyctl logs -a spinr-backend-yyz"
          exit 1

      # A green /ready only proves *something* is serving. This proves it is
      # THIS image: /deploy-info returns the build stamp ci.yml's
      # docker-image-scan job wrote (gap #3, closed). Skipped (not failed)
      # when either optional secret is absent. Compares against the image's
      # own tag SHA (steps.image.outputs.tag), not GITHUB_SHA — this
      # workflow can deploy a different commit's image than the one that
      # triggered the run, via the image_sha input.
      - name: Verify the deployed build SHA is serving
        if: ${{ env.FLY_HEALTH_URL != '' && env.METRICS_AUTH_TOKEN != '' }}
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            running=$(curl -sf --max-time 5 -H "Authorization: Bearer ${METRICS_AUTH_TOKEN}" \
              "${FLY_HEALTH_URL}/deploy-info" | jq -r '.build.sha // empty' 2>/dev/null || true)
            echo "  attempt ${i}/12 → running sha: ${running:-<none>}"
            if [ "${running}" = "${IMAGE_TAG}" ]; then
              echo "Fly is serving ${IMAGE_TAG}."
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Stale build serving::Fly /deploy-info reports sha '${running:-<none>}', expected ${IMAGE_TAG}. Inspect with: flyctl releases -a ${FLY_APP}"
          exit 1
