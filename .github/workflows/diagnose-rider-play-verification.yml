name: Diagnose Rider Play package verification

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS Android build ID to inspect"
        required: true
        default: "f58e4fbe-ff82-4c0b-bf5d-917ffccce1c1"
        type: string
      mode:
        description: "Inspect the AAB, or inspect and retry Play submission"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - submit

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect Rider AAB and Play credential
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rider-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate build ID and Play key
        env:
          BUILD_ID: ${{ inputs.build_id }}
          PLAY_KEY_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if ! printf '%s' "$BUILD_ID" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'; then
            echo "::error::build_id must be a valid EAS build UUID."
            exit 1
          fi

          if [ -z "$PLAY_KEY_B64" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi

          umask 077
          printf '%s' "$PLAY_KEY_B64" | base64 --decode > play-service-account.json

          jq -e '.type == "service_account" and
            .client_email == "eas-play-submit@playconsole-505223.iam.gserviceaccount.com" and
            (.private_key | type == "string" and length > 0)' \
            play-service-account.json > /dev/null || {
              echo "::error::The decoded key is not the expected Play service account."
              echo "Expected: eas-play-submit@playconsole-505223.iam.gserviceaccount.com"
              exit 1
            }

          echo "Play service account: $(jq -r '.client_email' play-service-account.json)"
          echo "Cloud project: $(jq -r '.project_id' play-service-account.json)"

      - name: Install locked app dependencies
        timeout-minutes: 20
        run: yarn install --frozen-lockfile --non-interactive

      - name: Download exact EAS AAB
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          # build:download currently treats the artifact as an archive and
          # cannot reliably extract store AABs. Fetch the direct artifact URL
          # returned by build:view instead.
          eas build:view "$BUILD_ID" --json > build-info.json
          AAB_URL=$(jq -er '.artifacts.buildUrl' build-info.json)

          curl --fail --location --retry 3 --silent --show-error \
            "$AAB_URL" --output rider-build.aab

          test -s rider-build.aab
          unzip -t rider-build.aab > /dev/null
          echo "Downloaded AAB size: $(stat -c '%s' rider-build.aab) bytes"
      - name: Print actual AAB certificate
        run: |
          echo "===== AAB certificate fingerprint ====="
          keytool -printcert -jarfile rider-build.aab
          echo "======================================"
          echo "The SHA-256 shown above is the certificate actually inside this AAB."

      - name: Write diagnostic summary
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          {
            echo "## Rider Play verification diagnostic"
            echo ""
            echo "- Package: `com.spinr.user`"
            echo "- EAS build: `$BUILD_ID`"
            echo "- Service account: `$(jq -r '.client_email' play-service-account.json)`"
            echo "- Cloud project: `$(jq -r '.project_id' play-service-account.json)`"
            echo ""
            echo "The certificate fingerprint is printed in the previous step. Compare it with the key registered under Android developer verification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit exact build to internal track
        if: ${{ inputs.mode == 'submit' }}
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          eas submit --platform android --profile production \
            --id "$BUILD_ID" --non-interactive --wait

      - name: Clean up credentials and artifact
        if: always()
        run: rm -f play-service-account.json rider-build.aab
