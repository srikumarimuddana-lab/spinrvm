name: CI Guard Rails

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

  # Runs this job against the merge queue's temporary merge commit once
  # GitHub's native merge queue is enabled on this repo (branch protection ->
  # require merge queue). Closes the CR #4187 cross-PR migration-collision
  # race window: a per-PR check only sees its own fork point, but a
  # merge_group run sees the actual would-be post-merge state. See
  # docs/audit/2026-08-19-decision-writeups.md section 5 and ACTION_ITEMS.md
  # C36. No filters needed -- fires on every PR added to the queue.
  merge_group:

  # Allow manual check against any branch
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch to compare against"
        required: false
        default: "main"

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  # ACTION_ITEMS.md C47: needed for shared-coverage-run's upload-artifact
  # and the two downstream gates' download-artifact. `read` (not `write`)
  # matches this repo's own proven-working precedent for the same pair of
  # actions within one workflow run -- see ci-error-audit.yml.
  actions: read

# Cancel in-flight runs for the same PR
concurrency:
  group: guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect changed surfaces (blast-radius-aware triggering, Phase 1) ─────
  # docs/audit/2026-08-27-cicd-gates-guardrails-audit.md Section 2: this repo
  # already path-filters migration-check.yml, the mobile-* workflows, and
  # every deploy-*.yml correctly -- but ci.yml/ci-guardrails.yml/
  # security-gates.yml run every job on every PR regardless of what changed,
  # which is the direct cause of slow turnaround on a single-surface PR.
  #
  # Phase 1 (this change) wires the three gates below that were already
  # advisory (continue-on-error: true) -- lint-trend-gate,
  # breaking-change-gate, coverage-regression-gate -- to this filter as a
  # low-risk trial: none of the three blocks a merge today, so a wrong
  # filter mapping costs nothing worse than a job running when it didn't
  # need to. Phase 2 (a follow-up, not this change) extends the same
  # pattern to the blocking gates once this trial is observed clean across
  # real PRs, and promotes this job into a shared `workflow_call` reusable
  # workflow once ci.yml and security-gates.yml also need it (kept inline
  # here for now, per CLAUDE.md "no single-use abstractions" -- one caller
  # doesn't justify extraction yet).
  #
  # Uses dorny/paths-filter -- not a new dependency, already vendored and
  # proven in this repo by eas-build.yml's own `detect` job (same pinned
  # SHA). This workflow has no `push:` trigger at all (see `on:` above) --
  # every dependent gate's own `if:` falls open on
  # `github.event_name != 'pull_request'`, so a merge_group run or a manual
  # workflow_dispatch always executes every gated job regardless of what
  # this filter reports (it doesn't even run on those events -- see this
  # job's own `if:` below). Path-filtering is a PR-time fast-feedback
  # optimization only; it never gets to decide what runs on anything but a
  # PR event.
  #
  # NAMING NOTE for whoever does Phase 2: the `admin` output below means
  # `admin-dashboard/**` (the frontend surface). It is unrelated to
  # `backend/routes/admin/` -- the directory `admin-coverage-floor-gate`
  # tracks -- which lives under the `backend` output instead. Do not wire
  # admin-coverage-floor-gate to `needs.detect-changes.outputs.admin`; that
  # would scope it to admin-dashboard changes and skip it on the
  # backend-admin-route PRs it actually exists to cover.
  # Phase 2 (docs/audit/2026-08-27-cicd-gates-guardrails-audit.md Section 5):
  # now a reusable workflow_call (.github/workflows/detect-changes.yml),
  # shared with ci.yml and security-gates.yml -- extracted once a second and
  # third caller needed the same filter job (kept inline through Phase 1,
  # per CLAUDE.md "no single-use abstractions", when this was the only
  # caller). Job name kept as `detect-changes` so every existing
  # `needs.detect-changes.outputs.*` reference below is unchanged.
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  # ─── 0. Shared coverage run (feeds coverage-regression-gate and
  # money-path-coverage-floor-gate below) ───────────────────────────────────
  # ACTION_ITEMS.md C47: those two gates used to each independently run the
  # full, unscoped backend pytest suite just to slice the resulting
  # coverage.json differently afterward -- tripling CI compute per PR event
  # (alongside ci.yml's own backend-test, deliberately left out of this
  # consolidation -- see money-path-coverage-floor-gate's own comment below
  # on cross-workflow artifact-sharing being rejected as too complex for a
  # first version) and tripling each gate's exposure window to an
  # unexplained external cancellation that intermittently kills these
  # full-suite runs mid-flight (exit 143, "runner has received a shutdown
  # signal" -- confirmed not a pytest failure; full investigation in C47).
  # This job runs pytest --cov=. exactly once; both downstream gates
  # download its coverage.json instead of re-running the suite themselves.
  # Same-workflow artifact sharing only -- not the cross-workflow case
  # already rejected, so this doesn't reopen that earlier decision.
  shared-coverage-run:
    name: Run backend test suite with coverage (shared)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [detect-changes]
    # Phase 2 (docs/audit/2026-08-27-cicd-gates-guardrails-audit.md Section
    # 5): this is the single most expensive job in this workflow (a full
    # `pytest --cov` run, ~15-18 min) -- the real turnaround-time win. Every
    # downstream consumer (coverage-regression-gate, money-path-coverage-
    # floor-gate, admin-coverage-floor-gate) already uses `if: always()` and
    # a `continue-on-error: true` artifact-download step specifically so a
    # skipped (or failed/cancelled) shared-coverage-run degrades them to
    # their own existing "no coverage report" no-op path instead of
    # cascading a skip -- unchanged by this gate.
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        needs.detect-changes.result == 'failure' ||
        needs.detect-changes.outputs.backend == 'true'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        # See coverage-regression-gate below for why this step tolerates a
        # transient install failure: the blocking backend-test job in ci.yml
        # already surfaces a real dependency problem.
        continue-on-error: true
        run: |
          pip install --require-hashes -r requirements-locked.txt --quiet \
            || pip install -r requirements-locked.txt --quiet || true

      - name: Run full backend test suite with coverage
        working-directory: backend
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test_key
          JWT_SECRET: ci-only-not-a-real-secret-000000000000
          ADMIN_PASSWORD: ci-placeholder-password
          ENV: test
        run: |
          pytest --cov=. --cov-report=json:../shared-coverage.json -q --no-header 2>/dev/null || true

      - name: Upload shared coverage artifact
        # if-no-files-found: warn (not error) -- a hard pytest crash before
        # any coverage.json is written must not fail this step loudly; both
        # downstream gates already have their own, pre-existing handling
        # for a missing/corrupt coverage.json (coverage-regression-gate's
        # try/except; money-path-coverage-floor-gate's fail-closed
        # _coverage_floor_lib.py path) -- neither changes because of this.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-coverage-${{ github.run_id }}
          # The pytest step above runs with working-directory: backend and
          # writes to ../shared-coverage.json -- i.e. the repo root
          # (GITHUB_WORKSPACE), which is what upload-artifact's `path:` is
          # resolved relative to (not per-step working-directory). Matches
          # the original jobs' own ../*.json convention.
          path: shared-coverage.json
          if-no-files-found: warn
          retention-days: 1

  # ─── 1. Coverage regression gate ─────────────────────────────────────────
  coverage-regression-gate:
    name: Coverage regression check
    runs-on: ubuntu-latest
    needs: [detect-changes, shared-coverage-run]
    timeout-minutes: 30
    # Gated on detect-changes' same fail-open pattern used below by
    # lint-trend-gate/breaking-change-gate -- this gate has nothing to
    # compare on a PR that never touched backend/, so it's included in the
    # same Phase 1 trial even though it isn't one of the two jobs that
    # trial's own intro comment above names; both are advisory
    # (continue-on-error: true), matching that trial's stated safety bar.
    # `needs.detect-changes.result == 'failure'` is the fail-open leg: if
    # the filter itself couldn't run, default to running this job rather
    # than silently skipping it on a PR that may have touched backend/.
    # Also runs regardless of shared-coverage-run's own outcome (success,
    # failure, or an external cancellation like C47) so a shared-run
    # problem degrades this gate exactly like a missing coverage.json
    # always has, rather than silently vanishing as "skipped" -- see the
    # download step below.
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        needs.detect-changes.result == 'failure' ||
        needs.detect-changes.outputs.backend == 'true'
      )
    continue-on-error: true
    outputs:
      # C24 (ACTION_ITEMS.md) / 2026-08-27 fix (docs/audit/2026-08-27-cicd-
      # gates-guardrails-audit.md Section 3): this gate used to depend on a
      # CODECOV_TOKEN secret that was never provisioned (no one has Codecov
      # account access to create one), so base_pct always resolved to 0 and
      # "no regression detected" was indistinguishable from "no baseline to
      # compare against." Fixed by computing the base-branch baseline
      # locally instead (see "Compute base-branch coverage" below) --
      # removes the third-party dependency entirely rather than waiting on
      # a token that may never arrive. This output still lets
      # guardrail-summary render an honest distinction for the remaining
      # failure mode (the base-commit pytest run itself failing outright).
      baseline_status: ${{ steps.assert_no_regression.outputs.baseline_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download shared coverage artifact
        # ACTION_ITEMS.md C47: no longer runs its own full-suite pytest --
        # downloads shared-coverage-run's single coverage.json instead.
        # continue-on-error: true so a missing artifact (shared job crashed
        # or was externally cancelled before uploading) doesn't hard-stop
        # this step -- the extraction step below already has its own
        # try/except that degrades identically to today's existing
        # "coverage read failed" path when the file isn't there.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shared-coverage-${{ github.run_id }}
          path: backend

      - name: Extract PR branch coverage
        working-directory: backend
        run: |
          python3 -c "
          import json
          try:
              data = json.load(open('shared-coverage.json'))
              pct = data['totals']['percent_covered']
              print(f'PR branch coverage: {pct:.1f}%')
              with open('../.coverage-pr', 'w') as f:
                  f.write(str(pct))
          except Exception as e:
              print(f'Coverage read failed: {e}')
              with open('../.coverage-pr', 'w') as f:
                  f.write('0')
          "

      - name: Resolve merge-base SHA
        id: mb
        env:
          # Preserves the pre-existing workflow_dispatch `base_branch` input
          # (on: workflow_dispatch: inputs: above) -- a manual run has no
          # pull_request.base.sha, so without this the comparison would
          # silently always fall back to origin/main regardless of what the
          # dispatch input asked for.
          BASE_BRANCH_INPUT: ${{ inputs.base_branch }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE="origin/${BASE_BRANCH_INPUT:-main}"
          fi
          MB=$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")
          echo "sha=$MB" >> "$GITHUB_OUTPUT"
          echo "Merge-base: $MB"

      # Self-computed baseline, replacing the Codecov API dependency above
      # (2026-08-27 fix, see this job's own outputs comment). Cached by
      # merge-base SHA: many PRs share the same current main tip on any
      # given day, so only the first PR against a given base commit pays
      # for this second full pytest run -- every later one this run gets a
      # cache hit and skips straight to "Extract base branch coverage"
      # below. Cache is scoped to this job only (coverage.json for one
      # specific commit, never invalidated -- a given SHA's coverage never
      # changes), so no staleness risk from reusing a hit.
      - name: Cache base-branch coverage
        id: base_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: base-coverage.json
          key: coverage-regression-base-${{ steps.mb.outputs.sha }}

      - name: Compute base-branch coverage (cache miss only)
        if: steps.base_cache.outputs.cache-hit != 'true'
        # Every command below already tolerates its own failure (git
        # checkout can fail to resolve an unusual SHA, pip can hit a
        # transient network error, pytest can crash outright) -- the step
        # itself must not hard-stop the job when one does. Without this,
        # a checkout failure aborts the job here (no `if: always()` on the
        # steps after this one), leaving `baseline_status` completely
        # unset instead of the honest 'no-baseline' the missing-file path
        # below produces -- guardrail-summary would then render that as a
        # plain green pass, reintroducing the exact silent-pass bug (C24)
        # this whole gate was rewritten to close, just via a different
        # trigger.
        continue-on-error: true
        working-directory: backend
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test_key
          JWT_SECRET: ci-only-not-a-real-secret-000000000000
          ADMIN_PASSWORD: ci-placeholder-password
          ENV: test
        run: |
          # Detached checkout of the merge-base commit -- this job's tree is
          # not needed again after this step (PR-branch coverage was already
          # extracted above), so overwriting it here is safe.
          git checkout --quiet ${{ steps.mb.outputs.sha }} || exit 0
          pip install --require-hashes -r requirements-locked.txt --quiet \
            || pip install -r requirements-locked.txt --quiet || true
          pytest --cov=. --cov-report=json:../base-coverage.json -q --no-header 2>/dev/null || true

          # Validate the JSON before letting the cache step (next) see it.
          # actions/cache saves whatever exists at `path:` at job end
          # regardless of how this step went -- an empty/corrupt file left
          # in place would get cached under this merge-base SHA's key
          # permanently (the key never invalidates by design), silently
          # degrading every later PR sharing that base commit to
          # "not verified" for the rest of the day with no way to self-heal.
          # Deleting an invalid result here means the next PR against the
          # same base gets a real cache miss and retries the computation
          # fresh, instead of inheriting today's fluke.
          python3 -c "
          import json
          try:
              json.load(open('../base-coverage.json'))
          except Exception:
              import os
              if os.path.exists('../base-coverage.json'):
                  os.remove('../base-coverage.json')
              print('Base coverage JSON invalid or missing -- not caching.')
          "

      - name: Extract base branch coverage
        id: base_coverage
        run: |
          python3 -c "
          import json
          try:
              data = json.load(open('base-coverage.json'))
              pct = data['totals']['percent_covered']
          except Exception as e:
              print(f'Base coverage read failed: {e}')
              pct = 0
          print(f'base_pct={pct}')
          " | tee /tmp/base_pct_line
          BASE_PCT=$(grep -oE '[0-9.]+' /tmp/base_pct_line | tail -1)
          echo "base_pct=${BASE_PCT:-0}" >> "$GITHUB_OUTPUT"
          echo "Base branch coverage: ${BASE_PCT:-0}%"

      - name: Assert no regression
        id: assert_no_regression
        run: |
          PR_PCT=$(cat .coverage-pr)
          BASE_PCT="${{ steps.base_coverage.outputs.base_pct }}"
          export BASE_PCT
          python3 - <<'PYEOF'
          import os

          pr_pct   = float(open('.coverage-pr').read().strip() or 0)
          base_pct = float(os.environ.get('BASE_PCT', '0') or 0)
          # Allow up to 2% regression before blocking (accounts for flaky mocks)
          TOLERANCE = 2.0
          delta = pr_pct - base_pct
          print(f"Base coverage : {base_pct:.1f}%")
          print(f"PR coverage   : {pr_pct:.1f}%")
          print(f"Delta         : {delta:+.1f}%")

          github_output = os.environ["GITHUB_OUTPUT"]
          github_summary = os.environ.get("GITHUB_STEP_SUMMARY")

          # 2026-08-27: base_pct==0 now means the base-commit pytest run
          # itself produced no readable coverage.json (crashed outright, or
          # the cache/compute step above was skipped for some other
          # reason) -- NOT "verified zero regression". Conflating those two
          # into one silent PASS was the original C24 bug (ACTION_ITEMS.md)
          # when this depended on a never-provisioned CODECOV_TOKEN; this
          # branch must still never claim regression was checked when it
          # wasn't, now that the mechanism is a locally-computed baseline
          # instead of a third-party API call.
          if base_pct <= 0:
              print("UNKNOWN: no base-branch coverage data available -- this run did NOT verify")
              print("whether coverage regressed. The base-commit pytest run produced no readable")
              print("coverage.json -- see the 'Compute base-branch coverage' step's own log.")
              with open(github_output, "a") as f:
                  f.write("baseline_status=no-baseline\n")
              if github_summary:
                  with open(github_summary, "a") as f:
                      f.write(
                          "### ⚠️ Coverage Regression: NOT actually checked\n\n"
                          "No base-branch coverage data was available (the base-commit pytest "
                          "run produced no readable `coverage.json` — see the 'Compute base-branch "
                          "coverage' step's log). This run could not tell whether this PR regressed "
                          "coverage or not. The green check above reflects that this gate doesn't "
                          "block merges when the baseline can't be computed, not that coverage was "
                          "verified.\n"
                      )
              # Not sys.exit(1): a missing baseline is an infra gap outside any
              # single PR author's control, not something this specific PR
              # did -- job-level continue-on-error already means this never
              # blocked a merge either way. What changes here is the message
              # is now honest instead of claiming a check that didn't happen.
          elif delta < -TOLERANCE:
              print(f"FAIL: Coverage regressed by {abs(delta):.1f}% (tolerance: {TOLERANCE}%)")
              print("Open a Change Request via .github/ISSUE_TEMPLATE/ci_change_request.yml if")
              print("the regression is intentional (e.g., removed dead code).")
              with open(github_output, "a") as f:
                  f.write("baseline_status=verified\n")
              raise SystemExit(1)
          else:
              print("PASS: Coverage within tolerance (verified against a real baseline).")
              with open(github_output, "a") as f:
                  f.write("baseline_status=verified\n")
          PYEOF

  # ─── 1b. Corporate per-module coverage floor ─────────────────────────────
  # CLAUDE.md targets >=80% for backend/{routes,services}/corporate_*.py
  # (same tier as rides/dispatch -- moves real money via
  # corporate_wallet_apply_delta) and says explicitly this is "not yet
  # enforced by a --cov-fail-under gate on this module specifically."
  # coverage-regression-gate above does not close that gap: it is
  # whole-codebase-aggregate (a module can sit at 33% forever as long as it
  # doesn't drop further) and advisory (continue-on-error: true). This gate
  # is scoped and BLOCKING, but only for a PR that actually touches a
  # tracked corporate_* module -- an unrelated PR is a no-op pass, so it
  # ratchets without blocking anything it didn't change. Floor values and
  # their provenance (measured vs. conservative-starting) live in
  # backend/scripts/check_corporate_coverage_floor.py -- read that file's
  # docstring before changing a floor.
  corporate-coverage-floor-gate:
    name: Corporate coverage floor check
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: [detect-changes]
    # Phase 2 (docs/audit/2026-08-27-cicd-gates-guardrails-audit.md Section
    # 5): runs its own separate ~2 min scoped pytest ("Run corporate test
    # suite with coverage" below), worth skipping outright for a PR that
    # can't possibly touch a tracked corporate_* module. Blocking
    # (continue-on-error: false) is unaffected by this gate -- a job
    # skipped via `if:` reports `skipped`, which GitHub's required-checks
    # mechanism treats as satisfying the check, same as every other gated
    # job in this file.
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        needs.detect-changes.result == 'failure' ||
        needs.detect-changes.outputs.backend == 'true'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: List changed files
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git diff --name-only "$BASE"...HEAD > /tmp/changed_files.txt || true
          echo "Changed files in this PR:"
          cat /tmp/changed_files.txt

      - name: Install backend deps
        working-directory: backend
        # See coverage-regression-gate above for why this step tolerates a
        # transient install failure: the blocking backend-test job in ci.yml
        # already surfaces a real dependency problem.
        continue-on-error: true
        run: |
          pip install --require-hashes -r requirements-locked.txt --quiet \
            || pip install -r requirements-locked.txt --quiet || true

      - name: Run corporate test suite with coverage
        working-directory: backend
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test_key
          JWT_SECRET: ci-only-not-a-real-secret-000000000000
          ADMIN_PASSWORD: ci-placeholder-password
          ENV: test
        run: |
          # Scoped to the corporate test files (48 of them) rather than the
          # full suite -- same targeted-measurement pattern already used
          # throughout docs/change-log/2026-07-28-corporate-*-coverage-80.md
          # ("pytest tests/ -k allowance" etc). --cov=. still measures every
          # source file those tests actually exercise, which is exactly the
          # corporate_* modules this gate cares about.
          pytest tests/ tests/services/ -k corporate \
            --cov=. --cov-report=json:../corp-coverage.json -q --no-header 2>/dev/null || true

      - name: Check per-module floors
        working-directory: backend
        run: |
          python3 scripts/check_corporate_coverage_floor.py \
            --coverage-json ../corp-coverage.json \
            --changed-files-file /tmp/changed_files.txt

  # ─── 1c. Money-path per-module coverage floor ────────────────────────────
  # CLAUDE.md's coverage-minimums table names >=90% for routes/payments.py,
  # services/fare_service.py, utils/crypto.py, and >=80% for routes/rides.py
  # (now the routes/rides/ package) + services/dispatch_service.py -- a
  # *higher*-priority tier than corporate_*.py's, which already got a gate
  # above. Ranked blocker #30, docs/audit/2026-08-18-full-fleet-whole-app-
  # audit.md. Same scoped-and-blocking-but-only-for-touched-files shape as
  # corporate-coverage-floor-gate above; see backend/scripts/
  # check_money_path_coverage_floor.py's docstring for floor provenance and
  # docs/change-log/2026-08-19-money-path-coverage-floor-gate-fix.md for the
  # 2026-08-19 measurement this gate's floors are derived from.
  #
  # Unlike corporate_*.py, these 5 files/package aren't cleanly separable by
  # a `-k` keyword filter (they're exercised across most of the suite), so
  # this gate needs full-suite coverage data rather than a scoped subset --
  # originally accepted as a real cost (its own duplicate full-suite pytest
  # run, on top of coverage-regression-gate's and ci.yml's backend-test's
  # own separate full runs) over a cross-workflow artifact-sharing setup
  # for a first version; see the change-log entry's Risk section.
  # ACTION_ITEMS.md C47 (2026-08-27): the *same-workflow* half of that cost
  # is now paid down -- this gate downloads shared-coverage-run's single
  # coverage.json instead of running its own full suite. ci.yml's
  # backend-test remains a separate, cross-workflow full run, still
  # deliberately out of scope for the reason above.
  money-path-coverage-floor-gate:
    name: Money-path coverage floor check
    runs-on: ubuntu-latest
    needs: [detect-changes, shared-coverage-run]
    # Phase 2 (docs/audit/2026-08-27-cicd-gates-guardrails-audit.md Section
    # 5) adds the detect-changes fail-open leg -- same pattern as
    # corporate-coverage-floor-gate above. Otherwise unchanged: still runs
    # regardless of shared-coverage-run's outcome (success, failure, or an
    # external cancellation like C47) so a shared-run problem produces this
    # gate's existing fail-closed "coverage report missing" result instead
    # of silently vanishing as "skipped" -- see the download step below and
    # check_money_path_coverage_floor.py's own handling.
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        needs.detect-changes.result == 'failure' ||
        needs.detect-changes.outputs.backend == 'true'
      )
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: List changed files
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git diff --name-only "$BASE"...HEAD > /tmp/changed_files_money.txt || true
          echo "Changed files in this PR:"
          cat /tmp/changed_files_money.txt

      - name: Download shared coverage artifact
        # ACTION_ITEMS.md C47: no longer runs its own full-suite pytest --
        # downloads shared-coverage-run's single coverage.json instead.
        # continue-on-error: true so a missing artifact doesn't hard-stop
        # this step; "Check per-module floors" below has no continue-on-
        # error of its own, so a genuinely missing coverage.json still
        # fails this job exactly like it always has (_coverage_floor_lib.py's
        # existing "FAIL: expected coverage report ... but it does not
        # exist" path) -- this gate stays blocking either way.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shared-coverage-${{ github.run_id }}
          path: backend

      - name: Check per-module floors
        working-directory: backend
        run: |
          python3 scripts/check_money_path_coverage_floor.py \
            --coverage-json shared-coverage.json \
            --changed-files-file /tmp/changed_files_money.txt

  # ─── 1d. Admin routes / utilities coverage floor ─────────────────────────
  # CLAUDE.md's coverage-minimums table names ">= 70%" for "Admin routes,
  # utilities" -- the one tier in that table with no enforcing gate, closed
  # here (2026-08-27, docs/audit/2026-08-27-cicd-gates-guardrails-audit.md
  # Section 3 / Phase 3). Same scoped-and-blocking-but-only-for-touched-
  # files shape as corporate-coverage-floor-gate/money-path-coverage-floor-
  # gate above; see backend/scripts/check_admin_coverage_floor.py's
  # docstring for why this tracks two directory-aggregate keys
  # (routes/admin/, utils/) rather than an explicit file list like its two
  # siblings, and for the real measured baseline this gate's floors cite.
  admin-coverage-floor-gate:
    name: Admin/utils coverage floor check
    runs-on: ubuntu-latest
    needs: [detect-changes, shared-coverage-run]
    # Same rationale as money-path-coverage-floor-gate above (Phase 2 fail-
    # open leg added): runs regardless of shared-coverage-run's outcome so
    # a shared-run problem produces this gate's existing fail-closed
    # "coverage report missing" result instead of silently vanishing as
    # "skipped".
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        needs.detect-changes.result == 'failure' ||
        needs.detect-changes.outputs.backend == 'true'
      )
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: List changed files
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git diff --name-only "$BASE"...HEAD > /tmp/changed_files_admin.txt || true
          echo "Changed files in this PR:"
          cat /tmp/changed_files_admin.txt

      - name: Download shared coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shared-coverage-${{ github.run_id }}
          path: backend

      - name: Check per-module floors
        working-directory: backend
        run: |
          python3 scripts/check_admin_coverage_floor.py \
            --coverage-json shared-coverage.json \
            --changed-files-file /tmp/changed_files_admin.txt

  # ─── 2. Lint warning count gate ───────────────────────────────────────────
  lint-trend-gate:
    name: Lint warning trend check
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [detect-changes]
    # Phase 1 blast-radius trial (see detect-changes' own comment above).
    # Lints both backend (ruff) and admin-dashboard (ESLint), so it needs
    # either surface. detect-changes only runs `if: pull_request` (see its
    # own job), so on a merge_group/workflow_dispatch run it's skipped and
    # its outputs are empty -- `github.event_name != 'pull_request'` is the
    # always-run-everything fallback for exactly that case, not a push-to-
    # main check (this workflow has no `push:` trigger at all).
    # `needs.detect-changes.result == 'failure'` is a second fail-open leg:
    # if the filter job itself errors out on a PR run (checkout or
    # dorny/paths-filter failure), default to running this job rather than
    # silently skipping an advisory check with no visible reason.
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        needs.detect-changes.result == 'failure' ||
        needs.detect-changes.outputs.backend == 'true' ||
        needs.detect-changes.outputs.admin == 'true'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.12 --quiet

      - name: Count ruff warnings on PR branch
        working-directory: backend
        run: |
          python -m ruff check . --output-format=json 2>/dev/null | \
            python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              errors   = [d for d in data if d.get('message','').startswith('E')]
              warnings = [d for d in data if not d.get('message','').startswith('E')]
              total    = len(data)
              print(f'Total issues: {total} (errors: {len(errors)}, warnings: {len(warnings)})')
              with open('/tmp/lint_pr_count', 'w') as f:
                  f.write(str(total))
          except Exception:
              with open('/tmp/lint_pr_count', 'w') as f:
                  f.write('0')
          " || echo "0" > /tmp/lint_pr_count

      - name: Set up Node (for admin lint)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Count admin ESLint issues
        working-directory: admin-dashboard
        run: |
          npm ci --quiet 2>/dev/null
          WARN_COUNT=$(npm run lint -- --format=json 2>/dev/null | \
            python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              total = sum(f.get('warningCount', 0) + f.get('errorCount', 0) for f in data)
              print(total)
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "$WARN_COUNT" > /tmp/lint_admin_count

          # GUARDRAIL: admin dashboard currently tolerates 600 warnings.
          # This gate enforces the count does NOT grow beyond current baseline.
          # See Change Request CR-2026-001 for the proposal to reduce this threshold.
          CURRENT=$(cat /tmp/lint_admin_count)
          BASELINE=600
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "FAIL: Admin ESLint warning count ($CURRENT) exceeds baseline ($BASELINE)"
            echo "Do not introduce new lint issues. Fix existing ones first."
            exit 1
          fi

      - name: Summary
        run: |
          echo "Backend ruff issues: $(cat /tmp/lint_pr_count)"
          echo "Admin ESLint issues: $(cat /tmp/lint_admin_count)"

  # ─── 3. Security posture gate ─────────────────────────────────────────────
  security-posture-gate:
    name: Security posture check
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # B-P1-10: refuse to merge a PR that ships an unhashed (or missing)
      # lockfile. Without this gate someone could regenerate the lockfile
      # without --generate-hashes and the Dockerfile's --require-hashes
      # check would silently degrade to "no enforcement".
      - name: Verify requirements-locked.txt has SHA-256 hashes
        run: |
          LOCK=backend/requirements-locked.txt
          if [ ! -f "$LOCK" ]; then
            echo "FAIL: $LOCK is missing. Regenerate via:"
            echo "  cd backend && pip-compile --generate-hashes --resolver=backtracking \\"
            echo "      --output-file=requirements-locked.txt requirements.txt"
            exit 1
          fi
          HASH_COUNT=$(grep -c -- '--hash=sha256:' "$LOCK" || true)
          if [ "$HASH_COUNT" -lt 100 ]; then
            echo "FAIL: $LOCK contains only $HASH_COUNT SHA-256 hashes (expected 100+)."
            echo "It looks like the file was regenerated without --generate-hashes."
            echo "See docs/runbooks/dependency-update.md."
            exit 1
          fi
          echo "PASS: $LOCK has $HASH_COUNT SHA-256 hashes."

      - name: Run pip-audit (Python CVE scan)
        # Non-blocking: CVE enforcement lives in security-gates.yml (G4a) which
        # runs on its own schedule and posts SARIF results. This step reports
        # findings to the step summary so authors are aware, but never exits 1
        # so the guardrail job passes even when patched versions are available.
        # Fail-fast only on CRITICAL aliases that pip-audit marks as such
        # (requires --strict-versions once available; tracked in CR-2026-009).
        working-directory: backend
        run: |
          pip install pip-audit --quiet
          pip-audit -r requirements-locked.txt --format=json \
            --output=/tmp/pip_audit.json --skip-editable 2>/dev/null || true
          python3 - <<'PYEOF'
          import json, os, sys
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          try:
              data = json.load(open('/tmp/pip_audit.json'))
              vulns = [
                  (pkg.get('name','?'), pkg.get('version','?'), v)
                  for pkg in data.get('dependencies', [])
                  for v in pkg.get('vulns', [])
              ]
              with open(summary_file, 'a') as sf:
                  sf.write("### pip-audit results\n\n")
                  if not vulns:
                      sf.write("✅ No Python CVEs found.\n")
                      print("PASS: No Python CVEs detected.")
                  else:
                      fixable = [(n, ver, v) for n, ver, v in vulns if v.get('fix_versions')]
                      sf.write(f"⚠️ {len(vulns)} CVE(s) found ({len(fixable)} fixable):\n\n")
                      sf.write("| Package | CVE | Fix versions |\n|---|---|---|\n")
                      for pkg_name, pkg_ver, v in vulns[:10]:
                          fixes = ', '.join(v.get('fix_versions', ['none']))
                          sf.write(f"| {pkg_name}=={pkg_ver} | {v.get('id','?')} | {fixes} |\n")
                      print(f"WARN: {len(vulns)} CVE(s) found ({len(fixable)} fixable).")
                      print("Review above in step summary; update requirements-locked.txt via")
                      print("  cd backend && pip-compile --generate-hashes ...")
          except Exception as e:
              print(f"pip-audit output could not be parsed: {e}")
          # Always exit 0 — blocking enforcement is in security-gates.yml G4a.
          PYEOF

      - name: Check for new secrets in diff
        uses: trufflesecurity/trufflehog@e12da3c72f1fa4bd17a7345467d735c5aae1fbcf # main (2026-08-19)
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Check EXPO_PUBLIC_ variable exposure
        run: |
          python3 - <<'PYEOF'
          import subprocess, re, sys

          # Scan changed files in PR for accidental private key exposure via EXPO_PUBLIC_
          result = subprocess.run(
              ['git', 'diff', '--name-only',
               '${{ github.event.pull_request.base.sha }}',
               '${{ github.event.pull_request.head.sha }}'],
              capture_output=True, text=True
          )
          changed = [f for f in result.stdout.strip().split('\n')
                     if f.endswith(('.ts', '.tsx', '.js', '.jsx', '.env', '.json'))]

          PRIVATE_PATTERNS = [
              r'EXPO_PUBLIC_.*(?:SECRET|PRIVATE|PASSWORD|KEY|TOKEN)',
              r'EXPO_PUBLIC_SUPABASE_SERVICE',
              r'EXPO_PUBLIC_JWT',
              r'EXPO_PUBLIC_ADMIN',
          ]
          issues = []
          for filepath in changed:
              try:
                  content = open(filepath).read()
                  for pat in PRIVATE_PATTERNS:
                      if re.search(pat, content, re.IGNORECASE):
                          issues.append(f"{filepath}: matches {pat}")
              except (OSError, UnicodeDecodeError):
                  pass

          if issues:
              print("FAIL: Potential private key in EXPO_PUBLIC_ variable:")
              for i in issues:
                  print(f"  {i}")
              sys.exit(1)
          else:
              print("PASS: No EXPO_PUBLIC_ key exposure detected.")
          PYEOF

  # ─── 4. DB migration safety gate ──────────────────────────────────────────
  migration-safety-gate:
    name: Migration safety check
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for dangerous migration patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, re, sys

          result = subprocess.run(
              ['git', 'diff', '--name-only', '$BASE_SHA', '$HEAD_SHA'],
              capture_output=True, text=True
          )
          migration_files = [f for f in result.stdout.strip().split('\n')
                             if 'migration' in f.lower() and f.endswith('.sql')]

          if not migration_files:
              print("PASS: No migration files changed.")
              sys.exit(0)

          print(f"Changed migration files: {migration_files}")

          DANGEROUS = [
              (r'\bDROP\s+TABLE\b',         "DROP TABLE — data loss risk"),
              (r'\bDROP\s+COLUMN\b',        "DROP COLUMN — data loss risk"),
              (r'\bTRUNCATE\b',             "TRUNCATE — data loss risk"),
              (r'\bDELETE\s+FROM\b',        "DELETE FROM in migration — unintended data loss"),
              (r'\bALTER\s+TABLE.*NOT\s+NULL\b', "Adding NOT NULL without default — locks table"),
              (r'WITHOUT\s+ROWID',          "WITHOUT ROWID — irreversible schema change"),
              (r'\bDROP\s+INDEX\b',         "DROP INDEX — query performance regression risk"),
          ]

          issues = []
          for filepath in migration_files:
              try:
                  content = open(filepath).read().upper()
                  for pattern, description in DANGEROUS:
                      if re.search(pattern, content, re.IGNORECASE):
                          issues.append(f"{filepath}: {description}")
              except OSError:
                  pass

          if issues:
              print("\nFAIL: Dangerous migration patterns detected:")
              for issue in issues:
                  print(f"  ⚠  {issue}")
              print("\nAction required:")
              print("  1. Review whether this is intentional.")
              print("  2. If intentional, open a Change Request using .github/ISSUE_TEMPLATE/ci_change_request.yml")
              print("     with full rollback plan before merging.")
              sys.exit(1)
          else:
              print("PASS: No dangerous migration patterns found.")
          PYEOF

      - name: Check for CREATE OR REPLACE conflicts across migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, sys

          BASE_SHA = os.environ.get('BASE_SHA', '')
          HEAD_SHA = os.environ.get('HEAD_SHA', '')

          # Only added migration files in this PR
          result = subprocess.run(
              ['git', 'diff', '--name-only', '--diff-filter=A', BASE_SHA, HEAD_SHA],
              capture_output=True, text=True,
          )
          new_migrations = [
              f for f in result.stdout.strip().split('\n')
              if f.startswith('backend/migrations/') and f.endswith('.sql')
          ]

          if not new_migrations:
              print("PASS: No new migration files added in this PR.")
              sys.exit(0)

          print(f"New migration files: {new_migrations}")

          # `[\w.]+` (not `\w+`) so a schema-qualified name is captured whole.
          # With `\w+` the capture stopped at the dot, so every
          # `CREATE OR REPLACE FUNCTION public.foo` reported its target as
          # "public" — 18 migrations in this repo claim that name, so ANY PR
          # adding a schema-qualified function collided with all of them and
          # the gate failed unconditionally. It could also never detect a real
          # collision, since every target compared equal.
          COR = re.compile(
              r'CREATE\s+OR\s+REPLACE\s+(?:FUNCTION|VIEW|TRIGGER|PROCEDURE)\s+([\w.]+)',
              re.IGNORECASE,
          )
          OVERRIDE = re.compile(r'--\s*migration-override-ok\s*:', re.IGNORECASE)

          def target_name(raw: str) -> str:
              """Bare object name, schema-insensitive.

              `public.foo` and `foo` are the same object when search_path
              includes public, so they must compare equal.
              """
              return raw.rsplit('.', 1)[-1].lower()

          # Collect targets defined by this PR's new migrations
          pr_targets: dict[str, list[str]] = {}
          for fpath in new_migrations:
              try:
                  content = open(fpath).read()
              except OSError:
                  continue
              if OVERRIDE.search(content):
                  print(f"  Skipping {fpath}: migration-override-ok annotation found.")
                  continue
              for name in COR.findall(content):
                  pr_targets.setdefault(target_name(name), []).append(fpath)

          if not pr_targets:
              print("PASS: No CREATE OR REPLACE targets in new migrations.")
              sys.exit(0)

          print(f"CREATE OR REPLACE targets in this PR: {sorted(pr_targets)}")

          # Walk all existing migrations not in this PR
          new_set = {os.path.normpath(f) for f in new_migrations}
          conflicts: list[dict] = []
          for root, _dirs, files in os.walk('backend/migrations'):
              for fname in sorted(files):
                  if not fname.endswith('.sql'):
                      continue
                  fpath = os.path.normpath(os.path.join(root, fname))
                  if fpath in new_set:
                      continue
                  try:
                      content = open(fpath).read()
                  except OSError:
                      continue
                  for name in COR.findall(content):
                      if target_name(name) in pr_targets:
                          conflicts.append({
                              'target': name,
                              'existing': fpath,
                              'pr_files': pr_targets[target_name(name)],
                          })

          if conflicts:
              seen: set[tuple] = set()
              print(f"\nFAIL: {len(conflicts)} CREATE OR REPLACE conflict(s):")
              for c in conflicts:
                  key = (c['target'].lower(), c['existing'])
                  if key in seen:
                      continue
                  seen.add(key)
                  print(f"  Target : {c['target']}")
                  print(f"  Already in : {c['existing']}")
                  print(f"  PR file(s) : {', '.join(c['pr_files'])}")
              print("\nTwo migrations redefine the same Postgres object.")
              print("Options:")
              print("  1. Add '-- migration-override-ok: <reason>' to the new migration to suppress.")
              print("  2. Rename one target if the conflict is accidental.")
              sys.exit(1)
          else:
              print(f"\nPASS: No CREATE OR REPLACE conflicts ({len(pr_targets)} target(s) checked).")
          PYEOF

      - name: Check for duplicate migration prefix numbers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, sys

          BASE_SHA = os.environ.get('BASE_SHA', '')
          HEAD_SHA = os.environ.get('HEAD_SHA', '')

          # New migration files added by this PR only
          result = subprocess.run(
              ['git', 'diff', '--name-only', '--diff-filter=A', BASE_SHA, HEAD_SHA],
              capture_output=True, text=True,
          )
          new_migrations = [
              f for f in result.stdout.strip().split('\n')
              if f.startswith('backend/migrations/') and f.endswith('.sql')
          ]

          if not new_migrations:
              print("PASS: No new migration files added in this PR.")
              sys.exit(0)

          PREFIX = re.compile(r'backend/migrations/(\d+)_')

          # Build prefix -> filenames map from all existing migrations on disk
          existing: dict[str, list[str]] = {}
          for fname in os.listdir('backend/migrations'):
              if not fname.endswith('.sql'):
                  continue
              m = PREFIX.match(f'backend/migrations/{fname}')
              if m:
                  existing.setdefault(m.group(1), []).append(fname)

          collisions = []
          for new_file in new_migrations:
              m = PREFIX.match(new_file)
              if not m:
                  continue
              prefix = m.group(1)
              others = [f for f in existing.get(prefix, [])
                        if f'backend/migrations/{f}' != new_file]
              if others:
                  collisions.append((new_file, prefix, others))

          if collisions:
              print("FAIL: New migration(s) reuse an existing numeric prefix:")
              for new_file, prefix, others in collisions:
                  print(f"  New file  : {new_file}")
                  print(f"  Prefix    : {prefix}_")
                  print(f"  Conflicts : {', '.join(others)}")
              print("\nRename the new file to the next free numeric slot.")
              print("Current highest slot and next free slot are documented in CLAUDE.md.")
              sys.exit(1)
          else:
              print(f"PASS: No duplicate migration prefix numbers ({len(new_migrations)} new file(s) checked).")
          PYEOF

  # ─── 5. Breaking change detection ─────────────────────────────────────────
  breaking-change-gate:
    name: Breaking change detection
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [detect-changes]
    # Phase 1 blast-radius trial (see detect-changes' own comment above).
    # Only ever diffs backend/routes/ and backend/db_supabase.py, so
    # backend is the only surface that can produce a finding here.
    # `needs.detect-changes.result == 'failure'` fails open on a filter-job
    # error, same rationale as lint-trend-gate above.
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        needs.detect-changes.result == 'failure' ||
        needs.detect-changes.outputs.backend == 'true'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for breaking API changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, re, sys

          # Detect changes to backend route signatures and DB schema
          result = subprocess.run(
              ['git', 'diff', '$BASE_SHA', '$HEAD_SHA', '--', 'backend/routes/', 'backend/db_supabase.py'],
              capture_output=True, text=True
          )
          diff = result.stdout

          BREAKING_PATTERNS = [
              (r'^\-.*@.*router\.(get|post|put|delete|patch)\(["\']',
               "Removed API route — existing clients will 404"),
              (r'^\-.*def (get_|create_|update_|delete_)\w+\(.*\)',
               "Removed public DB helper function"),
              (r'^\+.*def \w+\(.*\)\s*->\s*None:',
               "Function now returns None (potential type contract break)"),
          ]

          issues = []
          for pattern, description in BREAKING_PATTERNS:
              matches = re.findall(pattern, diff, re.MULTILINE)
              if matches:
                  issues.append(f"{description} ({len(matches)} instance(s))")

          if issues:
              print("WARN: Potential breaking changes detected:")
              for issue in issues:
                  print(f"  ⚠  {issue}")
              print("\nIf intentional, document the breaking change in your PR description")
              print("and open a Change Request if client apps need updating.")
              # Warning only — does not block PR
          else:
              print("PASS: No obvious breaking API changes detected.")
          PYEOF

  # ─── 6. Mobile test-placement gate ────────────────────────────────────────
  # Blocks a test file (*.test.*, *.spec.*, __tests__/) from landing inside an
  # Expo Router app/ tree, where require.context eagerly bundles it into the
  # production JS bundle and breaks the iOS/Android EAS build at the
  # "Bundle JavaScript" phase (Node built-in imports like fs fail to resolve).
  mobile-test-placement-gate:
    name: Mobile test placement check
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure no test files under an Expo Router app/ tree
        run: python3 scripts/check_mobile_test_placement.py

  # ─── 7. Change Impact & Risk Log gate ─────────────────────────────────────
  # CLAUDE.md: any PR touching a live-tested surface (rides, dispatch,
  # payments, auth, corporate, safety) must include a filled Change Impact
  # & Risk Log — either pasted into the PR description or added under
  # docs/change-log/. This gate only checks presence/shape of the required
  # sections, not their content quality — that's still a human reviewer's job.
  change-impact-log-gate:
    name: Change Impact & Risk Log check
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify Change Impact Log present for sensitive-surface PRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, sys

          BASE_SHA = os.environ.get('BASE_SHA', '')
          HEAD_SHA = os.environ.get('HEAD_SHA', '')
          PR_BODY = os.environ.get('PR_BODY') or ''

          # Diff from the actual merge-base, not raw BASE_SHA.
          # `pull_request.base.sha` is the base branch's CURRENT tip, which
          # keeps moving as main advances -- a PR branch that hasn't
          # rebased/merged main in a while would otherwise show every file
          # main gained since the PR's fork point as "changed by this PR",
          # tripping this gate on files the PR never touched. Same bug class
          # already found and fixed in migration-check.yml (PR #3497) --
          # mirroring that fix here rather than reinventing it. Found
          # 2026-08-21 on PR #4319: a stale BASE_SHA made the two-dot diff
          # surface backend/migrations/356_legacy_consent_notice_enabled_flag.sql
          # as "changed" even though this PR touches only CI workflow files
          # and one new doc.
          merge_base_result = subprocess.run(
              ['git', 'merge-base', BASE_SHA, HEAD_SHA],
              capture_output=True, text=True,
          )
          MERGE_BASE = merge_base_result.stdout.strip() or BASE_SHA

          result = subprocess.run(
              ['git', 'diff', '--name-only', MERGE_BASE, HEAD_SHA],
              capture_output=True, text=True,
          )
          changed = [f for f in result.stdout.strip().split('\n') if f]

          # Path substrings that mark a "live-tested surface" per CLAUDE.md's
          # own Change Impact Log policy (rides, dispatch, payments, auth,
          # corporate, safety). Kept as substrings, not exact paths, so it
          # still catches new files in these domains without maintenance.
          SENSITIVE_MARKERS = [
              'backend/routes/rides', 'backend/services/dispatch_service',
              'backend/services/fare_service', 'backend/routes/payments',
              'backend/routes/webhooks', 'backend/routes/auth.py',
              'backend/routes/corporate', 'backend/services/corporate',
              'backend/routes/wallet', 'backend/routes/safety.py',
              'backend/utils/insurance_periods', 'backend/services/payment_service',
              'backend/routes/drivers/ride_', 'backend/routes/drivers/status',
              'backend/routes/drivers/payouts', 'backend/migrations/',
          ]

          touched = [f for f in changed if any(m in f for m in SENSITIVE_MARKERS)]

          if not touched:
              print("PASS: No live-tested-surface files changed — Change Impact Log not required.")
              sys.exit(0)

          print(f"Live-tested-surface files changed: {touched}")

          # Required fields, per docs/templates/CHANGE_IMPACT_LOG.md. Matched
          # loosely (case-insensitive substring) since PR authors may adapt
          # heading style slightly — this checks presence, not formatting.
          REQUIRED_MARKERS = [
              'root cause',
              'risk & impact',
              'user experience',
              'rollback plan',
              'verification performed',
          ]

          # Accept either: (a) the PR body contains the required sections, or
          # (b) this PR adds a docs/change-log/*.md file (also checked for markers).
          change_log_added = [
              f for f in changed
              if f.startswith('docs/change-log/') and f.endswith('.md')
          ]

          # Normalize hyphens to spaces before matching — the template itself
          # uses hyphenated headings in places (e.g. "## 5. User-experience
          # effect"), and a literal-substring match against 'user experience'
          # (space) would false-negative on that exact heading. Found via a
          # real false-positive on this gate's own first production run.
          def _normalize(text):
              return text.lower().replace('-', ' ')

          candidate_text = _normalize(PR_BODY)
          for f in change_log_added:
              try:
                  candidate_text += '\n' + _normalize(open(f, encoding='utf-8').read())
              except OSError:
                  pass

          missing = [m for m in REQUIRED_MARKERS if m not in candidate_text]

          if missing:
              print("FAIL: This PR touches a live-tested surface but is missing a Change Impact & Risk Log.")
              print(f"Missing section(s): {missing}")
              print()
              print("Fix: paste a filled docs/templates/CHANGE_IMPACT_LOG.md into the PR description,")
              print("or add docs/change-log/YYYY-MM-DD-<short-slug>.md with the same sections.")
              print("See CLAUDE.md → 'Change Impact & Risk Log (mandatory)'.")
              sys.exit(1)
          else:
              print("PASS: Change Impact & Risk Log present and covers required sections.")
          PYEOF

  # ─── 8. Risk label bot ────────────────────────────────────────────────────
  # Informational only (never blocks): labels the PR risk:high / risk:medium /
  # risk:low based on which surfaces it touches, so reviewers can triage
  # attention before reading the full diff. High = same live-tested-surface
  # marker list as the Change Impact Log gate above.
  risk-label:
    name: Apply risk label
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine risk level
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, subprocess

          BASE_SHA = os.environ.get('BASE_SHA', '')
          HEAD_SHA = os.environ.get('HEAD_SHA', '')

          result = subprocess.run(
              ['git', 'diff', '--name-only', BASE_SHA, HEAD_SHA],
              capture_output=True, text=True,
          )
          changed = [f for f in result.stdout.strip().split('\n') if f]

          HIGH_MARKERS = [
              'backend/routes/rides', 'backend/services/dispatch_service',
              'backend/services/fare_service', 'backend/routes/payments',
              'backend/routes/webhooks', 'backend/routes/auth.py',
              'backend/routes/corporate', 'backend/services/corporate',
              'backend/routes/wallet', 'backend/routes/safety.py',
              'backend/utils/insurance_periods', 'backend/services/payment_service',
              'backend/routes/drivers/ride_', 'backend/routes/drivers/status',
              'backend/routes/drivers/payouts', 'backend/migrations/',
          ]
          MEDIUM_MARKERS = [
              'backend/', 'rider-app/', 'driver-app/', 'admin-dashboard/',
          ]

          if any(m in f for f in changed for m in HIGH_MARKERS):
              level = 'high'
          elif any(m in f for f in changed for m in MEDIUM_MARKERS):
              level = 'medium'
          else:
              level = 'low'

          gh_output = os.environ.get('GITHUB_OUTPUT')
          with open(gh_output, 'a') as f:
              f.write(f'level={level}\n')
          print(f"Risk level: {level}")
          PYEOF

      - name: Apply label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const level = '${{ steps.risk.outputs.level }}';
            const allLevels = ['risk:high', 'risk:medium', 'risk:low'];
            const target = `risk:${level}`;

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const currentNames = current.map(l => l.name);

            // Remove any stale risk:* label that doesn't match the current level.
            for (const name of currentNames) {
              if (allLevels.includes(name) && name !== target) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                }).catch(() => {});
              }
            }

            if (!currentNames.includes(target)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [target],
              }).catch(() => {});
            }

  # ─── Guard rail summary comment on PR ─────────────────────────────────────
  guardrail-summary:
    name: Post guard rail summary
    runs-on: ubuntu-latest
    needs:
      - coverage-regression-gate
      - corporate-coverage-floor-gate
      - money-path-coverage-floor-gate
      - admin-coverage-floor-gate
      - lint-trend-gate
      - security-posture-gate
      - migration-safety-gate
      - breaking-change-gate
      - mobile-test-placement-gate
      - change-impact-log-gate
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Summarise results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const jobs = {
              'Coverage Regression':  '${{ needs.coverage-regression-gate.result }}',
              'Corporate Coverage Floor': '${{ needs.corporate-coverage-floor-gate.result }}',
              'Money-Path Coverage Floor': '${{ needs.money-path-coverage-floor-gate.result }}',
              'Admin/Utils Coverage Floor': '${{ needs.admin-coverage-floor-gate.result }}',
              'Lint Trend':           '${{ needs.lint-trend-gate.result }}',
              'Security Posture':     '${{ needs.security-posture-gate.result }}',
              'Migration Safety':     '${{ needs.migration-safety-gate.result }}',
              'Breaking Changes':     '${{ needs.breaking-change-gate.result }}',
              'Test Placement':       '${{ needs.mobile-test-placement-gate.result }}',
              'Change Impact Log':    '${{ needs.change-impact-log-gate.result }}',
            };

            const icon = r => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'skipped' ? '⏭️' : '⚠️';
            const rows = Object.entries(jobs)
              .map(([name, result]) => {
                // C24: coverage-regression-gate's `.result` is always
                // 'success' (job-level continue-on-error masks a real
                // step failure) whether it actually verified no regression
                // or found no baseline to compare against at all -- those
                // are not the same thing and must not render the same way.
                if (name === 'Coverage Regression' && '${{ needs.coverage-regression-gate.outputs.baseline_status }}' === 'no-baseline') {
                  return `| ⚠️ **${name}** | \`not verified (no baseline — see ACTION_ITEMS.md C24)\` |`;
                }
                return `| ${icon(result)} **${name}** | \`${result}\` |`;
              })
              .join('\n');

            const body = `## CI Guard Rails Summary\n\n| Gate | Status |\n|---|---|\n${rows}\n\n` +
              `> Guard rails run on every PR to \`main\`/\`develop\`. ` +
              `Failures must be resolved or a [Change Request]` +
              `(https://github.com/${{ github.repository }}/issues/new?template=ci_change_request.yml) ` +
              `approved before merging.\n` +
              `> Audit: [CI Error Audit System](https://github.com/${{ github.repository }}/tree/main/reports/audits)`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CI Guard Rails Summary')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
